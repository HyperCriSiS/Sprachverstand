<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Sprachverstand</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header class="brand-header">
        <img src="../icons/icon32.png" width="32" height="32" alt="">
        <div>
          <h1>Sprachverstand</h1>
          <output id="state"></output>
        </div>
      </header>

      <div class="count-row" aria-live="polite">
        <span>Korrekturen auf dieser Seite</span>
        <output id="count">0</output>
      </div>

      <label class="switch-row">
        <span>Erweiterung aktiv</span>
        <input id="enabled" type="checkbox">
      </label>

      <section class="rules-panel">
        <h2>Was soll korrigiert werden?</h2>
        <div id="rule-groups" class="popup-rules"></div>
      </section>

      <button id="open-options" type="button">Ausnahmen und weitere Einstellungen</button>
    </main>
  </body>
</html>
