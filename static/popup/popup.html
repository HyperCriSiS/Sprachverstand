<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Sprachverstand</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header class="brand-header">
        <img src="../icons/icon32.png" width="32" height="32" alt="">
        <div>
          <h1>Sprachverstand</h1>
          <output id="state"></output>
        </div>
      </header>

      <div class="count-row popup-section" data-popup-section="count" aria-live="polite">
        <span>Korrekturen auf dieser Seite</span>
        <output id="count">0</output>
      </div>

      <label class="switch-row popup-section" data-popup-section="activation">
        <span>Erweiterung aktiv</span>
        <input id="enabled" type="checkbox">
      </label>

      <section class="rules-panel popup-section" data-popup-section="rule-groups">
        <h2>Was soll korrigiert werden?</h2>
        <div id="rule-groups" class="popup-rules"></div>
      </section>

      <section class="where-panel popup-section" data-popup-section="text-options">
        <h2>Wo soll korrigiert werden?</h2>
        <label class="popup-option-row">
          <span>Bildbeschreibungen und Beschriftungen</span>
          <input id="process-accessible-attributes" type="checkbox">
        </label>
        <label class="popup-option-row">
          <span>Text in Anführungszeichen</span>
          <input id="process-quoted-text" type="checkbox">
        </label>
        <label class="popup-option-row">
          <span>Untertitel</span>
          <input id="process-subtitles" type="checkbox">
        </label>
      </section>

      <button id="add-current-domain" class="domain-action-button popup-section" data-popup-section="domain-action" type="button"></button>

      <button id="open-options" class="popup-section" data-popup-section="open-options" type="button">Ausnahmen und weitere Einstellungen</button>
    </main>
  </body>
</html>
