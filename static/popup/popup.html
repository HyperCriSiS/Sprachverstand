<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Sprachverstand</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Sprachverstand</h1>
        <output id="state"></output>
      </header>

      <div class="count-row" aria-live="polite">
        <span>Korrekturen auf dieser Seite</span>
        <output id="count">0</output>
      </div>

      <label class="switch-row">
        <span>Aktiv</span>
        <input id="enabled" type="checkbox">
      </label>

      <p id="rules-summary" class="rules-summary"></p>

      <button id="open-options" type="button">Regeln und Ausnahmen</button>
    </main>
  </body>
</html>
