name: Kontrollierte Interaktionsperformance

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "A/B-Paare mit abwechselnder Reihenfolge (1–5)"
        type: choice
        options: ["3", "5", "1"]
        default: "3"
        required: true
      browser_source:
        description: "System-Chromium oder separat gepinntes Chrome for Testing"
        type: choice
        options: ["system-chromium", "chrome-for-testing"]
        default: "system-chromium"
        required: true
      cpu_profile:
        description: "Zusätzliches V8-Sampling (verändert Laufzeiten)"
        type: choice
        options: ["off", "on"]
        default: "off"
        required: true
      browser_trace:
        description: "Zusätzliche Render-/Compilertrace (verändert Laufzeiten)"
        type: choice
        options: ["off", "on"]
        default: "off"
        required: true
      active_subtitles:
        description: "Aktivierte Untertitel während Klicks und Texteingabe prüfen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: controlled-interaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interaction:
    name: Echte Chromium-A/B-Interaktionen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPRACHVERSTAND_TEST_BROWSER_SOURCE: ${{ inputs.browser_source || 'system-chromium' }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Gepinntes Chrome for Testing separat vorbereiten
        if: ${{ inputs.browser_source == 'chrome-for-testing' }}
        run: bash scripts/setup-chrome-for-testing.sh
      - name: Chromium-Erweiterung erstellen
        run: npm run build:chromium
      - name: Erweiterung im Browser prüfen
        run: npm run test:browser:chromium
      - name: Gepaarte Interaktions- und Longtaskmessung
        env:
          PAIR_COUNT: ${{ inputs.pairs }}
          CPU_PROFILE: ${{ inputs.cpu_profile }}
          BROWSER_TRACE: ${{ inputs.browser_trace }}
          ACTIVE_SUBTITLES: ${{ inputs.active_subtitles }}
        run: |
          trace_args=()
          if [ "$BROWSER_TRACE" = "on" ]; then trace_args+=(--browser-trace); fi
          if [ "$ACTIVE_SUBTITLES" = "true" ]; then trace_args+=(--active-subtitles); fi
          node scripts/controlled-interaction-performance.mjs --pairs "$PAIR_COUNT" \
            --cpu-profile "$CPU_PROFILE" "${trace_args[@]}" \
            --output artifacts/interaction-performance/report.json
      - name: Diagnosebericht sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kontrollierte-interaktionsperformance-${{ github.sha }}
          path: artifacts/interaction-performance/
          if-no-files-found: warn
          retention-days: 14
