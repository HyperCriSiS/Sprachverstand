name: Einmalige Review-Policy-Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Öffentliches Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Öffentliche Review-Policy umstellen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          review = Path(".github/workflows/source-review.yml")
          s = review.read_text(encoding="utf-8")

          marker = '''        type: string
'''
          addition = '''        type: string
      external_evidence:
        description: "Nur für echte Grenzfälle zusätzlich Wikidata/Wikipedia abfragen"
        required: true
        default: false
        type: boolean
'''
          if "external_evidence:" not in s:
              if marker not in s:
                  raise SystemExit("Input-Anker in source-review.yml nicht gefunden.")
              s = s.replace(marker, addition, 1)

          old = '''      - name: Wikidata- und Wikipedia-Evidenz parallel abfragen
        env:
'''
          new = '''      - name: Optionale externe Evidenz für Grenzfälle abfragen
        if: ${{ inputs.external_evidence }}
        env:
'''
          if old in s:
              s = s.replace(old, new, 1)

          old_cmd = '''          python datastore/sprachverstand/scripts/assemble_review_queue.py             "$CANDIDATE_FILE"             "datastore/sprachverstand/derived/review/${REVIEW_PREFIX}-review.json"             --source-id "$SOURCE_ID"             --wikidata-jsonl "datastore/sprachverstand/derived/evidence/${REVIEW_PREFIX}-wikidata.jsonl"             --wikipedia-jsonl "datastore/sprachverstand/derived/evidence/${REVIEW_PREFIX}-wikipedia.jsonl"             --pairs-json "$PAIRS_FILE"             --product-commit "$PRODUCT_COMMIT"
'''
          new_cmd = '''          if [[ "${{ inputs.external_evidence }}" == "true" ]]; then
            python datastore/sprachverstand/scripts/assemble_review_queue.py \
              "$CANDIDATE_FILE" \
              "datastore/sprachverstand/derived/review/${REVIEW_PREFIX}-review.json" \
              --source-id "$SOURCE_ID" \
              --wikidata-jsonl "datastore/sprachverstand/derived/evidence/${REVIEW_PREFIX}-wikidata.jsonl" \
              --wikipedia-jsonl "datastore/sprachverstand/derived/evidence/${REVIEW_PREFIX}-wikipedia.jsonl" \
              --pairs-json "$PAIRS_FILE" \
              --product-commit "$PRODUCT_COMMIT"
          else
            python datastore/sprachverstand/scripts/assemble_review_queue.py \
              "$CANDIDATE_FILE" \
              "datastore/sprachverstand/derived/review/${REVIEW_PREFIX}-review.json" \
              --source-id "$SOURCE_ID" \
              --pairs-json "$PAIRS_FILE" \
              --product-commit "$PRODUCT_COMMIT"
          fi
'''
          if old_cmd in s:
              s = s.replace(old_cmd, new_cmd, 1)
          elif "if [[ "${{ inputs.external_evidence }}" == "true" ]]" not in s:
              raise SystemExit("Assembly-Anker in source-review.yml nicht gefunden.")

          pair_guard = '''          if missing_source_pair_candidates:
              raise SystemExit(
                  "BA-Quellpaare fehlen für Review-Kandidaten: "
                  + ", ".join(missing_source_pair_candidates)
              )

'''
          s = s.replace(pair_guard, "")

          postprocess_anchor = '''      - name: Kompakte Review-Zusammenfassung erzeugen
'''
          postprocess = '''      - name: Sprachmodell-Review als Standard markieren
        env:
          REVIEW_PREFIX: ${{ steps.queue.outputs.review_prefix }}
        shell: bash
        run: |
          python - <<'PY2'
          import json
          import os
          from pathlib import Path

          prefix = os.environ["REVIEW_PREFIX"]
          path = Path(
              "datastore/sprachverstand/derived/review/"
              f"{prefix}-review.json"
          )
          queue = json.loads(path.read_text(encoding="utf-8"))
          queue["version"] = max(int(queue.get("version") or 1), 2)
          queue["reviewPolicy"] = {
              "mode": "language_model_first",
              "candidateOriginAffectsApproval": False,
              "externalEvidenceRequired": False,
              "sourcePairsRequired": False,
              "externalEvidenceForAmbiguousCasesOnly": True,
              "highConfidenceMayProceedWithoutExternalEvidence": True,
          }
          for item in queue.get("candidates", []):
              item["status"] = "pending_language_review"
              item.pop("manualChecks", None)
              item["languageChecks"] = {
                  "semantics": "pending",
                  "morphology": "pending",
                  "ambiguity": "pending",
                  "regressionRisk": "pending",
              }
              item["externalReview"] = "not_required"
          path.write_text(
              json.dumps(queue, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY2

'''
          if "Sprachmodell-Review als Standard markieren" not in s:
              if postprocess_anchor not in s:
                  raise SystemExit("Postprocess-Anker nicht gefunden.")
              s = s.replace(postprocess_anchor, postprocess + postprocess_anchor, 1)

          s = s.replace(
              "name: Private Quellenreview",
              "name: Private Kandidatenprüfung",
              1,
          )
          s = s.replace(
              "name: Private Evidenz über öffentlichen Runner erzeugen",
              "name: Private Sprachmodell-Prüfqueue vorbereiten",
              1,
          )
          review.write_text(s, encoding="utf-8")

          lexicon = Path("docs/LEXICON.md")
          l = lexicon.read_text(encoding="utf-8")
          section = '''## Prüfprinzip für Quellenkandidaten

Externe Wortlisten und Klassifikationen dienen ausschließlich zur Kandidatengewinnung. Die Herkunft eines deutschen Wortes ist keine Freigabevoraussetzung. Neue Kandidaten werden standardmäßig semantisch und morphologisch intern bewertet; eindeutige Formen benötigen keinen zusätzlichen Webbeleg. Externe Recherche ist nur für Mehrdeutigkeiten, ungewöhnliche Fachsprache oder widersprüchliche Befunde vorgesehen.

Unabhängig davon gelten für jede produktive Aufnahme weiterhin die oben beschriebenen Kontext-, Flexions- und Regressionsanforderungen.

'''
          if "## Prüfprinzip für Quellenkandidaten" not in l:
              l = l.replace("## Aktuelle Abdeckung\n", section + "## Aktuelle Abdeckung\n", 1)
          lexicon.write_text(l, encoding="utf-8")

          state = Path("docs/AI_SESSION_STATE.md")
          a = state.read_text(encoding="utf-8")
          start = a.index("## Quellenreview-Infrastruktur")
          end = a.index("## Privater Quellenstand")
          policy = '''## Kandidatenprüfung

- Externe Web-Evidenz ist **keine Freigabevoraussetzung mehr**. KldB, ESCO und andere Quellen dienen nur als Kandidatenlieferanten.
- Standard ist `language_model_first`: Kandidaten werden semantisch und morphologisch intern geprüft; eindeutige Formen dürfen ohne Wikidata-, Wikipedia-, Duden- oder DWDS-Recherche in die Produktprüfung gehen.
- Lokal vorhandene Paarinformationen dürfen als Hinweis genutzt werden, sind aber keine Pflicht.
- Externe Recherche wird nur noch für echte Grenzfälle, Mehrdeutigkeiten oder widersprüchliche Befunde zugeschaltet.
- Der nächste `kldb-current`-Batch darf bis zu 250 Kandidaten umfassen; die produktive Aufnahme bleibt durch exakte Mappings und Regressionstests abgesichert.

'''
          a = a[:start] + policy + a[end:]
          start = a.index("## Nächste Arbeitseinheit")
          end = a.index("## Verbindliche Wiederaufnahme-Regel")
          nxt = '''## Nächste Arbeitseinheit

Als nächster Quellenblock:

1. `kldb-current-priority-4` mit bis zu 250 Kandidaten reproduzierbar ableiten und bereits entschiedene Kandidaten ausschließen.
2. Den gesamten Batch intern semantisch und morphologisch prüfen.
3. Eindeutige Kandidaten ohne externe Webrecherche für exakte Produkt-Mappings vorbereiten.
4. Nur echte Grenzfälle separat markieren und bei Bedarf gezielt extern nachprüfen.
5. Positiv-/Negativregressionen und die vollständige Produktprüfung ausführen.
6. Keine generische Suffixregel allein aus dem Batch ableiten.

'''
          a = a[:start] + nxt + a[end:]
          state.write_text(a, encoding="utf-8")

          current = Path("docs/engineering/CURRENT-WORK.md")
          current.write_text('''# Aktueller Arbeitsstand

Stand: 2026-09-30
Autorität: `main`

Diese Datei ist der kompakte operative Übergabepunkt für unterbrochene oder in einem neuen Chat fortgesetzte Arbeit.

## Produktbaseline

- Moderne Produktlinie: `main`
- Letzte integrierte Lexikon-Ausbauwelle: **57**
- Letzter integrierter Produkt-PR: **#249 — siebenundfünfzigste konservative Ausbauwelle**
- Verifizierter Produktbaseline-Commit: `1fc46b0a9fd37f61e931178cc5489e152f30e25a`
- Aktuellen `main`-HEAD bei jeder Wiederaufnahme live ermitteln.

## Aktiver Arbeitsstrom

### Priorität 1 — KldB/DKZ-Kandidaten sprachmodellbasiert abarbeiten

Der Quellenimport ist abgeschlossen. Für die Produktfreigabe gilt keine externe Evidenzpflicht mehr:

1. Quellen liefern nur Kandidaten; ihre Herkunft hat kein Freigabegewicht.
2. Kandidaten werden in größeren Batches intern semantisch und morphologisch geprüft.
3. Eindeutige deutsche Personenformen können ohne Webrecherche weiterverarbeitet werden.
4. Lokal vorhandene Paarinformationen sind optionaler Hinweis, keine Voraussetzung.
5. Nur mehrdeutige, fachsprachlich ungewöhnliche oder widersprüchliche Fälle werden gezielt extern recherchiert.
6. Produktiv bleiben exakte Mappings, Positiv-/Negativregressionen und die vollständige CI die Sicherheitsgrenze; aus einem Batch wird keine generische Suffixregel abgeleitet.

Nächster Block: `kldb-current-priority-4`, bis zu 250 Kandidaten statt 50.

## Optionale private Ebene

Für Quellenimport, Kandidatengenerierung und Coverage darf `HyperCriSiS/Generic-Datastore` geladen werden. Private Rohquellen, URLs und Herkunftsmetadaten bleiben außerhalb des öffentlichen Produkt-Repositories. Herkunftsmetadaten dürfen die sprachliche Freigabeentscheidung nicht beeinflussen.

## Wiederaufnahmeprotokoll

1. Diese Datei aus `main` lesen.
2. Aktuellen `main`-HEAD live verifizieren.
3. Bei Quellenarbeit zusätzlich `sprachverstand/CURRENT-STATE.json` im privaten Datastore lesen.
4. Sprachmodell-Review ist Standard; externe Evidenz nur bei echten Grenzfällen.
5. Nach einer abgeschlossenen größeren Einheit diesen Checkpoint aktualisieren.
''', encoding="utf-8")
          PY

          grep -q 'external_evidence:' .github/workflows/source-review.yml
          grep -q 'pending_language_review' .github/workflows/source-review.yml
          grep -q 'language_model_first' docs/AI_SESSION_STATE.md
          grep -q 'bis zu 250 Kandidaten' docs/engineering/CURRENT-WORK.md

      - name: Öffentliche Änderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/source-review.yml docs/LEXICON.md docs/AI_SESSION_STATE.md docs/engineering/CURRENT-WORK.md
          git commit -m "Quellenreview: Sprachmodellprüfung zum Standard machen"
          git push origin HEAD:main

      - name: Privaten Datastore auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HyperCriSiS/Generic-Datastore
          ref: main
          path: datastore
          token: ${{ secrets.GENERIC_DATASTORE_TOKEN }}
          persist-credentials: true

      - name: Privaten Wiederaufnahmestand anpassen
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("datastore/sprachverstand")
          selector = root / "scripts/select_kldb_current_batch.py"
          s = selector.read_text(encoding="utf-8")
          s = s.replace(
              'parser.add_argument("--limit", type=int, default=50)',
              'parser.add_argument("--limit", type=int, default=250)',
          )
          selector.write_text(s, encoding="utf-8")

          path = root / "CURRENT-STATE.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          data["authority"]["reviewPrinciple"] = (
              "Quellen liefern Kandidaten; die Herkunft hat kein Freigabegewicht. "
              "Standard ist interne semantische und morphologische Prüfung."
          )
          pipeline = data["privateSourcePipeline"]
          pipeline["workflowHost"]["externalEvidenceMode"] = "optional_for_ambiguous_cases_only"
          pipeline["workflowHost"]["defaultExternalEvidence"] = False
          pipeline["reviewPolicy"] = {
              "mode": "language_model_first",
              "candidateOriginAffectsApproval": False,
              "externalEvidenceRequired": False,
              "sourcePairsRequired": False,
              "externalEvidenceForAmbiguousCasesOnly": True,
              "defaultBatchSize": 250,
              "productSafetyBoundary": [
                  "semantic_review",
                  "morphology_review",
                  "exact_mappings",
                  "positive_negative_regressions",
                  "product_ci",
              ],
          }
          pipeline["nextStep"] = (
              "kldb-current-priority-4 mit bis zu 250 Kandidaten ableiten, "
              "bereits entschiedene Kandidaten ausschließen und den Batch intern "
              "semantisch sowie morphologisch prüfen. Eindeutige Kandidaten ohne "
              "externe Webrecherche als exact-Mappings vorbereiten; nur echte "
              "Grenzfälle gezielt extern nachprüfen."
          )
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python -m py_compile datastore/sprachverstand/scripts/select_kldb_current_batch.py
          grep -q '"defaultBatchSize": 250' datastore/sprachverstand/CURRENT-STATE.json
          grep -q 'default=250' datastore/sprachverstand/scripts/select_kldb_current_batch.py

      - name: Private Änderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          cd datastore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprachverstand/CURRENT-STATE.json sprachverstand/scripts/select_kldb_current_batch.py
          git commit -m "review: Sprachmodellprüfung als Standard festhalten"
          git push origin HEAD:main
