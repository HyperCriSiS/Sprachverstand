name: Publish corrected Pale Moon 0.7.0

on:
  push:
    branches:
      - palemoon

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: palemoon
          fetch-depth: 0

      - name: Einmaligen Trigger entfernen und Release-Tag setzen
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.7.0-palemoon.2"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/publish-palemoon-0.7.0-palemoon.2.yml
          git commit -m "ci: remove one-time Pale Moon release trigger"
          git push origin HEAD:palemoon

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} existiert bereits."
            exit 1
          fi

          git tag "${TAG}"
          git push origin "${TAG}"
