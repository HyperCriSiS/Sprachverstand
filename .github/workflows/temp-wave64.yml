name: Temporärer Welle-64-Generator

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Arbeitsbranch für Welle 64
        required: true
        default: lexicon/wave-64
        type: string

permissions:
  contents: write

jobs:
  generate:
    name: Welle 64 erzeugen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}

    steps:
      - name: Arbeitsbranch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Welle 64 integrieren
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wave = '''import type { GeneratedPersonForms } from "./generated-person-lexicon";

          // Quellenneutraler, exakt freigegebener Zusatzbestand aus Welle 64.
          // Die Mengen sind reine Allow-Lists und erzeugen keine generische Suffixfreigabe.
          const unchangedForms: ReadonlySet<string> = new Set([
            "ankerschließer",
            "bauabrechner",
            "betriebsabrechner",
            "gehaltsabrechner",
            "kostenabrechner",
            "landkartenaufzieher",
            "lohnabrechner",
            "minibar-checker",
            "stanzmaschineneinsteller",
            "tierkörperverwerter",
            "tuftingwarennachseher",
            "verpflegungsautomatenauffüller",
            "verpflegungsautomatenbefüller",
            "viehtreiber",
            "warenbereitsteller",
            "webgutnachseher",
            "zigarettenautomatenauffüller",
            "zigarettenautomatenbefüller"
          ]);

          const pluralEForms: ReadonlySet<string> = new Set([
            "museumsregistrar",
            "warenhandelssubstitut"
          ]);

          export const reviewedPersonFormCountWave64 =
            unchangedForms.size + pluralEForms.size;

          function regularForms(
            base: string,
            plural: string
          ): GeneratedPersonForms {
            return {
              plural,
              singular: base,
              feminineSingular: `${base}in`,
              obliqueSingular: base,
              genitiveSingular: `${base}s`
            };
          }

          export function getReviewedPersonFormsWave64(
            normalizedBase: string
          ): GeneratedPersonForms | undefined {
            if (unchangedForms.has(normalizedBase)) {
              return regularForms(normalizedBase, normalizedBase);
            }

            if (pluralEForms.has(normalizedBase)) {
              return regularForms(normalizedBase, `${normalizedBase}e`);
            }

            return undefined;
          }
          '''
          wave = "\n".join(line[10:] if line.startswith("          ") else line for line in wave.splitlines()) + "\n"
          Path("src/rules/reviewed-person-forms-wave-64.ts").write_text(wave, encoding="utf-8")

          lexicon_path = Path("src/rules/person-lexicon.ts")
          lexicon = lexicon_path.read_text(encoding="utf-8")
          import_old = 'import { getReviewedPersonFormsWave63 } from "./reviewed-person-forms-wave-63";'
          import_new = import_old + '\nimport { getReviewedPersonFormsWave64 } from "./reviewed-person-forms-wave-64";'
          if import_new not in lexicon:
            if import_old not in lexicon:
              raise SystemExit("Welle-63-Import nicht gefunden")
            lexicon = lexicon.replace(import_old, import_new, 1)

          resolver_old = '''    getReviewedPersonFormsWave62(normalizedBase) ??
              getReviewedPersonFormsWave63(normalizedBase)
            );'''
          resolver_old = "\n".join(line[10:] if line.startswith("          ") else line for line in resolver_old.splitlines())
          resolver_new = '''    getReviewedPersonFormsWave62(normalizedBase) ??
              getReviewedPersonFormsWave63(normalizedBase) ??
              getReviewedPersonFormsWave64(normalizedBase)
            );'''
          resolver_new = "\n".join(line[10:] if line.startswith("          ") else line for line in resolver_new.splitlines())
          if "getReviewedPersonFormsWave64(normalizedBase)" not in lexicon:
            if resolver_old not in lexicon:
              raise SystemExit("Resolver-Ende von Welle 63 nicht gefunden")
            lexicon = lexicon.replace(resolver_old, resolver_new, 1)

          lexicon_path.write_text(lexicon, encoding="utf-8")

          test = '''import { describe, expect, it } from "vitest";
          import { mappedPluralSeparatorsRule } from "../src/rules/mapped-plural-separators";
          import {
            mapMappedSingular,
            mapMappedSingularPair
          } from "../src/rules/person-lexicon";
          import {
            getReviewedPersonFormsWave64,
            reviewedPersonFormCountWave64
          } from "../src/rules/reviewed-person-forms-wave-64";

          describe("vierundsechzigste Lexikon-Ausbauwelle", () => {
            it("enthält genau den intern geprüften Exaktbestand", () => {
              expect(reviewedPersonFormCountWave64).toBe(20);
              for (const base of [
                "computervisualist",
                "eri-wart",
                "eutonist",
                "fennist",
                "mindermaschinenstricker",
                "modellist",
                "tapisserist",
                "verschmelzer",
                "wäscher",
                "bildmischer",
                "bohrer",
                "blechpresser",
                "bandstanzer",
                "bandwalzer",
                "drahtwickler",
                "branntweinbrenner",
                "briefsortierer",
                "offsetplattenkopierer",
                "devisenrechner",
                "geldzähler",
                "aluminiumspritzer",
                "vorroller",
                "tiefzieher",
                "fantasieabrechner",
                "fantasieauffüller",
                "fantasienachseher"
              ]) {
                expect(getReviewedPersonFormsWave64(base), base).toBeUndefined();
              }
            });

            it.each([
              ["Ankerschließer:innen", "Ankerschließer"],
              ["Bauabrechner:innen", "Bauabrechner"],
              ["Betriebsabrechner:innen", "Betriebsabrechner"],
              ["Gehaltsabrechner:innen", "Gehaltsabrechner"],
              ["Kostenabrechner:innen", "Kostenabrechner"],
              ["Landkartenaufzieher:innen", "Landkartenaufzieher"],
              ["Lohnabrechner:innen", "Lohnabrechner"],
              ["Minibar-Checker:innen", "Minibar-Checker"],
              ["Museumsregistrar:innen", "Museumsregistrare"],
              ["Stanzmaschineneinsteller:innen", "Stanzmaschineneinsteller"],
              ["Tierkörperverwerter:innen", "Tierkörperverwerter"],
              ["Tuftingwarennachseher:innen", "Tuftingwarennachseher"],
              ["Verpflegungsautomatenauffüller:innen", "Verpflegungsautomatenauffüller"],
              ["Verpflegungsautomatenbefüller:innen", "Verpflegungsautomatenbefüller"],
              ["Viehtreiber:innen", "Viehtreiber"],
              ["Warenbereitsteller:innen", "Warenbereitsteller"],
              ["Warenhandelssubstitut:innen", "Warenhandelssubstitute"],
              ["Webgutnachseher:innen", "Webgutnachseher"],
              ["Zigarettenautomatenauffüller:innen", "Zigarettenautomatenauffüller"],
              ["Zigarettenautomatenbefüller:innen", "Zigarettenautomatenbefüller"]
            ])("ersetzt den geprüften Plural %s", (input, expected) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              ["Ankerschließer", "Ankerschließerin", "Ankerschließer"],
              ["Bauabrechner", "Bauabrechnerin", "Bauabrechner"],
              ["Betriebsabrechner", "Betriebsabrechnerin", "Betriebsabrechner"],
              ["Gehaltsabrechner", "Gehaltsabrechnerin", "Gehaltsabrechner"],
              ["Kostenabrechner", "Kostenabrechnerin", "Kostenabrechner"],
              ["Landkartenaufzieher", "Landkartenaufzieherin", "Landkartenaufzieher"],
              ["Lohnabrechner", "Lohnabrechnerin", "Lohnabrechner"],
              ["Minibar-Checker", "Minibar-Checkerin", "Minibar-Checker"],
              ["Museumsregistrar", "Museumsregistrarin", "Museumsregistrar"],
              ["Stanzmaschineneinsteller", "Stanzmaschineneinstellerin", "Stanzmaschineneinsteller"],
              ["Tierkörperverwerter", "Tierkörperverwerterin", "Tierkörperverwerter"],
              ["Tuftingwarennachseher", "Tuftingwarennachseherin", "Tuftingwarennachseher"],
              ["Verpflegungsautomatenauffüller", "Verpflegungsautomatenauffüllerin", "Verpflegungsautomatenauffüller"],
              ["Verpflegungsautomatenbefüller", "Verpflegungsautomatenbefüllerin", "Verpflegungsautomatenbefüller"],
              ["Viehtreiber", "Viehtreiberin", "Viehtreiber"],
              ["Warenbereitsteller", "Warenbereitstellerin", "Warenbereitsteller"],
              ["Warenhandelssubstitut", "Warenhandelssubstitutin", "Warenhandelssubstitut"],
              ["Webgutnachseher", "Webgutnachseherin", "Webgutnachseher"],
              ["Zigarettenautomatenauffüller", "Zigarettenautomatenauffüllerin", "Zigarettenautomatenauffüller"],
              ["Zigarettenautomatenbefüller", "Zigarettenautomatenbefüllerin", "Zigarettenautomatenbefüller"]
            ])("erkennt das intern geprüfte Paar %s/%s", (masculine, feminine, expected) => {
              expect(mapMappedSingularPair(masculine, feminine)).toBe(expected);
            });

            it.each([
              ["ankerschließer", "genitive", "ankerschließers"],
              ["museumsregistrar", "genitive", "museumsregistrars"],
              ["warenhandelssubstitut", "genitive", "warenhandelssubstituts"]
            ] as const)(
              "bildet die repräsentative Basis %s im Kasus %s korrekt ab",
              (base, grammaticalCase, expected) => {
                expect(mapMappedSingular(base, grammaticalCase)).toBe(expected);
              }
            );

            it("erhält die Segmentgroßschreibung bei der Bindestrichform", () => {
              expect(mappedPluralSeparatorsRule.apply("Minibar-Checker:innen")).toEqual({
                text: "Minibar-Checker",
                replacements: 1
              });
            });
          });
          '''
          test = "\n".join(line[10:] if line.startswith("          ") else line for line in test.splitlines()) + "\n"
          Path("tests/lexicon-person-forms-wave-64.test.ts").write_text(test, encoding="utf-8")
          PY

      - name: Änderungen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/person-lexicon.ts src/rules/reviewed-person-forms-wave-64.ts tests/lexicon-person-forms-wave-64.test.ts
          git diff --cached --check
          git commit -m "Lexikon: vierundsechzigste Ausbauwelle"
          git push origin "HEAD:${TARGET_BRANCH}"
