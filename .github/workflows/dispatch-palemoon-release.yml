name: Dispatch corrected Pale Moon release

on:
  push:
    branches:
      - palemoon

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: palemoon

      - name: Dauerhaften Release-Workflow starten
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run release.yml --repo "$REPOSITORY" --ref palemoon -f tag=v0.7.0-palemoon.2

      - name: Einmaligen Dispatcher entfernen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-palemoon-release.yml
          git commit -m "ci: remove one-time Pale Moon release dispatcher"
          git push origin HEAD:palemoon
