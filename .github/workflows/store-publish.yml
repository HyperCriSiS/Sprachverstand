name: Store Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stabiler Release-Tag, z. B. v0.7.2"
        required: true
        type: string
      target:
        description: "Store-Ziel"
        required: true
        default: "both"
        type: choice
        options:
          - "amo"
          - "chrome"
          - "both"
      mode:
        description: "Nur prüfen oder wirklich einreichen"
        required: true
        default: "validate"
        type: choice
        options:
          - "validate"
          - "submit"

permissions:
  contents: read

concurrency:
  group: store-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      asset_label: ${{ steps.release.outputs.asset_label }}
      stable: ${{ steps.release.outputs.stable }}

    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Release-Version prüfen
        id: release
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Store Publish darf nur vom geschützten main-Branch gestartet werden."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
            echo "Erwartet wird ein Tag wie v0.7.2 oder v0.7.2-rc.1."
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          if [[ "$TAG" == "v${VERSION}" ]]; then
            STABLE=true
          else
            STABLE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_label=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"

          if [[ "${{ inputs.mode }}" == "submit" && "$STABLE" != "true" ]]; then
            echo "Store-Einreichungen sind nur für stabile Tags ohne RC-/Beta-Suffix erlaubt."
            exit 1
          fi

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Store-Release-Notes prüfen
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/store-release-notes.mjs --check --release-version "$VERSION"

      - name: GitHub-Release-Artefakte prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
          cd artifacts
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

  amo:
    if: ${{ inputs.mode == 'submit' && (inputs.target == 'amo' || inputs.target == 'both') }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: store-production

    steps:
      - name: Vertrauenswürdigen Publisher-Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Release-Artefakte laden
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
          cd artifacts
          sha256sum -c SHA256SUMS.txt

      - name: Mozilla-Zugangsdaten prüfen
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_ADDON_ID: ${{ vars.AMO_ADDON_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AMO_API_KEY"
          test -n "$AMO_API_SECRET"
          test -n "$AMO_ADDON_ID"
          node scripts/amo-api-v5.mjs profile >/dev/null

      - name: Bei AMO einreichen
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_ADDON_ID: ${{ vars.AMO_ADDON_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_LABEL: ${{ needs.prepare.outputs.asset_label }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/amo-api-v5.mjs submit \
            "artifacts/sprachverstand-${ASSET_LABEL}-firefox.xpi" \
            "artifacts/sprachverstand-${ASSET_LABEL}-source.zip" \
            "$VERSION" \
            "artifacts/amo-release-notes.json"

  chrome:
    if: ${{ inputs.mode == 'submit' && (inputs.target == 'chrome' || inputs.target == 'both') }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: store-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Vertrauenswürdigen Publisher-Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Google-WIF-Konfiguration prüfen
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROVIDER"
          test -n "$SERVICE_ACCOUNT"
          test -n "$PUBLISHER_ID"
          test -n "$EXTENSION_ID"

      - name: Kurzlebiges Google-Access-Token beziehen
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          create_credentials_file: false
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Chromium-Release-Artefakt laden
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
          cd artifacts
          sha256sum -c SHA256SUMS.txt

      - name: Chrome-Web-Store-Paket hochladen und einreichen
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          ASSET_LABEL: ${{ needs.prepare.outputs.asset_label }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/chrome-web-store-v2.mjs upload \
            "artifacts/sprachverstand-${ASSET_LABEL}-chromium.zip"
          node scripts/chrome-web-store-v2.mjs wait
          node scripts/chrome-web-store-v2.mjs publish
