name: Temporärer Quellen-Audit Welle 39

on:
  push:
    branches:
      - feat/source-audit-korrektur-ad-wave-39

permissions:
  contents: write

jobs:
  patch-und-pruefung:
    runs-on: ubuntu-latest
    steps:
      - name: Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: feat/source-audit-korrektur-ad-wave-39

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Quellenänderungen anwenden
        shell: python
        run: |
          from pathlib import Path

          person_path = Path("src/rules/person-lexicon.ts")
          person = person_path.read_text(encoding="utf-8")
          marker = "const personForms: readonly PersonForms[] = [\n"
          insert = (
              "const personForms: readonly PersonForms[] = [\n"
              '  { ...weak("adjutant"), match: "exact" as const },\n'
              '  { ...weak("autodidakt"), match: "exact" as const },\n'
              '  weak("banaus", "banause", "banausen"),\n'
              '  { ...weak("dilettant"), match: "exact" as const },\n'
          )
          if 'weak("adjutant")' not in person:
              if marker not in person:
                  raise RuntimeError("Einfügepunkt im Personenlexikon nicht gefunden")
              person = person.replace(marker, insert, 1)
          person_path.write_text(person, encoding="utf-8")

          adjective_path = Path("src/rules/substantivized-adjectives.ts")
          adjective = adjective_path.read_text(encoding="utf-8")
          replacements = [
              ('  "angestellte",\n', '  "angeklagte",\n  "angestellte",\n'),
              ('  "auszubildende",\n', '  "auszubildende",\n  "bankangestellte",\n'),
              ('  "beauftragte",\n', '  "beauftragte",\n  "befragte",\n'),
          ]
          for old, new in replacements:
              if new.split("\n", 1)[0].strip() not in adjective:
                  if old not in adjective:
                      raise RuntimeError(f"Einfügepunkt nicht gefunden: {old.strip()}")
                  adjective = adjective.replace(old, new, 1)
          adjective_path.write_text(adjective, encoding="utf-8")

          test = '''import { describe, expect, it } from "vitest";
          import { mappedPluralSeparatorsRule } from "../src/rules/mapped-plural-separators";
          import {
            mapMappedSingular,
            mapMappedSingularPair
          } from "../src/rules/person-lexicon";
          import { substantivizedAdjectivesRule } from "../src/rules/substantivized-adjectives";

          describe("neununddreißigste konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Adjutant:innen", "Adjutanten"],
              ["Autodidakt*innen", "Autodidakten"],
              ["Banaus_innen", "Banausen"],
              ["Kulturbanaus:innen", "Kulturbanausen"],
              ["Dilettant:innen", "Dilettanten"]
            ])("normalisiert die neue schwache Personenform %s", (input, expected) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              ["adjutant", "nominative", "adjutant"],
              ["adjutant", "accusative", "adjutanten"],
              ["autodidakt", "dative", "autodidakten"],
              ["banaus", "nominative", "banause"],
              ["kulturbanaus", "genitive", "kulturbanausen"],
              ["dilettant", "genitive", "dilettanten"]
            ] as const)("bildet %s im Kasus %s korrekt ab", (base, grammaticalCase, expected) => {
              expect(mapMappedSingular(base, grammaticalCase)).toBe(expected);
            });

            it.each([
              ["Adjutant", "Adjutantin", "Adjutant"],
              ["Autodidakt", "Autodidaktin", "Autodidakt"],
              ["Banause", "Banausin", "Banause"],
              ["Kulturbanause", "Kulturbanausin", "Kulturbanause"],
              ["Dilettant", "Dilettantin", "Dilettant"]
            ])("erkennt das Paar %s/%s", (masculine, feminine, expected) => {
              expect(mapMappedSingularPair(masculine, feminine)).toBe(expected);
            });

            it.each([
              ["Angeklagte:r", "Angeklagter"],
              ["Befragte:n", "Befragten"],
              ["Bankangestellte:r", "Bankangestellter"],
              ["ein:e Befragte:r", "ein Befragter"],
              ["den:die Angeklagte:n", "den Angeklagten"]
            ])("normalisiert die substantivierte Form %s", (input, expected) => {
              expect(substantivizedAdjectivesRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              "Alumnus:innen",
              "Connaisseur:innen",
              "Dompteur:innen"
            ])("lässt unregelmäßige, nicht abgesicherte Kurzformen unverändert: %s", (input) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: input,
                replacements: 0
              });
            });
          });
          '''
          test = "\n".join(line[10:] if line.startswith("          ") else line for line in test.splitlines()) + "\n"
          Path("tests/lexicon-person-forms-wave-39.test.ts").write_text(test, encoding="utf-8")

          Path(".github/workflows/temporary-wave39.yml").unlink()

      - name: Vollständige Prüfung
        run: npm run check

      - name: Änderungen einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/person-lexicon.ts src/rules/substantivized-adjectives.ts tests/lexicon-person-forms-wave-39.test.ts .github/workflows/temporary-wave39.yml
          git diff --cached --check
          git commit -m "Lexikon: neununddreißigste konservative Ausbauwelle"
          git push
