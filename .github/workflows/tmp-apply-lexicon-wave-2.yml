name: Temporäre Lexikon-Ausbauwelle 2 anwenden

on:
  push:
    branches:
      - feat/lexicon-expansion-wave-2
    paths:
      - .github/workflows/tmp-apply-lexicon-wave-2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Arbeitszweig auschecken
        uses: actions/checkout@v6
        with:
          ref: feat/lexicon-expansion-wave-2
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Konservative Lexikonwelle anwenden
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          known_path = Path("src/rules/known-plural-separators.ts")
          known = known_path.read_text(encoding="utf-8")
          start_marker = "const safePluralSuffixes = [\n"
          end_marker = "\n] as const;"
          start = known.index(start_marker) + len(start_marker)
          end = known.index(end_marker, start)
          body = known[start:end]
          additions = [
              "elektroniker",
              "mechatroniker",
              "pfleger",
              "schweißer",
              "tischler",
          ]

          missing = [suffix for suffix in additions if f'"{suffix}"' not in body]
          if missing:
              lines = body.splitlines()
              last = max(index for index, line in enumerate(lines) if line.strip())
              if not lines[last].rstrip().endswith(","):
                  lines[last] = lines[last].rstrip() + ","
              for index, suffix in enumerate(missing):
                  comma = "," if index < len(missing) - 1 else ""
                  lines.append(f'  "{suffix}"{comma}')
              known = known[:start] + "\n".join(lines) + known[end:]
              known_path.write_text(known, encoding="utf-8")

          person_path = Path("src/rules/person-lexicon.ts")
          person = person_path.read_text(encoding="utf-8")
          marker = "const personForms: readonly PersonForms[] = [\n"
          additions = ["chemikant", "fachlagerist", "orthoptist"]
          missing = [base for base in additions if f'weak("{base}")' not in person]
          if missing:
              insertion = "".join(f'  weak("{base}"),\n' for base in missing)
              person = person.replace(marker, marker + insertion, 1)
              person_path.write_text(person, encoding="utf-8")

          test_path = Path("tests/lexicon-expansion-wave-2.test.ts")
          test_path.write_text(
              '''import { describe, expect, it } from "vitest";
          import { knownPluralSeparatorsRule } from "../src/rules/known-plural-separators";
          import { mappedPluralSeparatorsRule } from "../src/rules/mapped-plural-separators";
          import { mapMappedSingular } from "../src/rules/person-lexicon";

          describe("zweite konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Kinderpfleger:innen", "Kinderpfleger"],
              ["Landmaschinenmechatroniker:innen", "Landmaschinenmechatroniker"],
              ["Industrieelektroniker:innen", "Industrieelektroniker"],
              ["Bautischler:innen", "Bautischler"],
              ["Rohrschweißer:innen", "Rohrschweißer"]
            ])("deckt sichere unveränderte Pluralfamilien ab: %s", (input, expected) => {
              expect(knownPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              ["Orthoptist:innen", "Orthoptisten"],
              ["Fachlagerist:innen", "Fachlageristen"],
              ["Chemikant:innen", "Chemikanten"]
            ])("deckt geprüfte schwache Berufsformen ab: %s", (input, expected) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it("stellt die schwache Singularflexion in allen relevanten Kasus bereit", () => {
              expect(mapMappedSingular("orthoptist", "nominative")).toBe("orthoptist");
              expect(mapMappedSingular("orthoptist", "accusative")).toBe("orthoptisten");
              expect(mapMappedSingular("fachlagerist", "dative")).toBe("fachlageristen");
              expect(mapMappedSingular("chemikant", "genitive")).toBe("chemikanten");
            });

            it.each([
              "Pflege:innen",
              "Elektronik:innen",
              "Mechanik:innen",
              "Schweiß:innen",
              "Tisch:innen"
            ])("lässt ähnlich aussehende Nicht-Personenformen unverändert: %s", (input) => {
              expect(knownPluralSeparatorsRule.apply(input)).toEqual({
                text: input,
                replacements: 0
              });
            });
          });
          ''',
              encoding="utf-8",
          )
          PY

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Neue Regressionen gezielt prüfen
        run: npx vitest run tests/lexicon-expansion-wave-2.test.ts

      - name: Vollständige Projektprüfung ausführen
        run: npm run check

      - name: Temporären Workflow entfernen und Änderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-apply-lexicon-wave-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: zweite konservative Lexikonwelle ergänzen"
          git push origin HEAD:feat/lexicon-expansion-wave-2
