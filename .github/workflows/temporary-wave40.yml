name: Temporärer Quellen-Audit Welle 40

on:
  push:
    branches:
      - feat/source-audit-korrektur-ek-wave-40

permissions:
  contents: write

jobs:
  patch-und-pruefung:
    runs-on: ubuntu-latest
    steps:
      - name: Branch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/source-audit-korrektur-ek-wave-40

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Quellenänderungen anwenden
        shell: python
        run: |
          from pathlib import Path

          person_path = Path("src/rules/person-lexicon.ts")
          person = person_path.read_text(encoding="utf-8")
          marker = "const personForms: readonly PersonForms[] = [\n"
          additions = (
              '  { ...weak("egoman", "egomane", "egomanen"), match: "exact" as const },\n'
              '  { ...weak("ehegatt", "ehegatte", "ehegatten"), match: "exact" as const },\n'
              '  { ...weak("ergonom"), match: "exact" as const },\n'
              '  { ...regular("intermediär", "intermediäre", "intermediär", "intermediärs"), match: "exact" as const },\n'
          )
          if 'weak("egoman"' not in person:
              if marker not in person:
                  raise RuntimeError("Einfügepunkt im Personenlexikon nicht gefunden")
              person = person.replace(marker, marker + additions, 1)

          old_herr = '  weak("herr", "herr", "herrn"),\n'
          new_herr = (
              '  {\n'
              '    stem: "herr",\n'
              '    singular: "herr",\n'
              '    feminineSingular: "herrin",\n'
              '    obliqueSingular: "herrn",\n'
              '    genitiveSingular: "herrn",\n'
              '    plural: "herren"\n'
              '  },\n'
          )
          if old_herr in person:
              person = person.replace(old_herr, new_herr, 1)
          elif 'plural: "herren"' not in person:
              raise RuntimeError("Herr-Flexion weder alt noch bereits aktualisiert gefunden")

          person_path.write_text(person, encoding="utf-8")

          adjective_path = Path("src/rules/substantivized-adjectives.ts")
          adjective = adjective_path.read_text(encoding="utf-8")

          def insert_before(target: str, entry: str) -> None:
              global adjective
              line = f'  "{entry}",'
              if line in adjective:
                  return
              target_line = f'  "{target}",'
              if target_line not in adjective:
                  raise RuntimeError(f"Einfügepunkt nicht gefunden: {target}")
              adjective = adjective.replace(target_line, f'{line}\n{target_line}', 1)

          insert_before("ehrenamtliche", "einzelne")
          insert_before("freiberufliche", "fortgeschrittene")
          insert_before("geschädigte", "gelehrte")
          adjective_path.write_text(adjective, encoding="utf-8")

          test = '''import { describe, expect, it } from "vitest";
          import { mappedPluralSeparatorsRule } from "../src/rules/mapped-plural-separators";
          import {
            mapMappedSingular,
            mapMappedSingularPair
          } from "../src/rules/person-lexicon";
          import { substantivizedAdjectivesRule } from "../src/rules/substantivized-adjectives";

          describe("vierzigste konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Egoman:innen", "Egomanen"],
              ["Ehegatt*innen", "Ehegatten"],
              ["Ergonom_innen", "Ergonomen"],
              ["Intermediär:innen", "Intermediäre"],
              ["Herr:innen", "Herren"],
              ["Bauherr:innen", "Bauherren"]
            ])("normalisiert die neue oder korrigierte Pluralform %s", (input, expected) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              ["egoman", "nominative", "egomane"],
              ["egoman", "accusative", "egomanen"],
              ["ehegatt", "dative", "ehegatten"],
              ["ergonom", "genitive", "ergonomen"],
              ["intermediär", "genitive", "intermediärs"],
              ["herr", "dative", "herrn"],
              ["bauherr", "genitive", "bauherrn"]
            ] as const)("bildet %s im Kasus %s korrekt ab", (base, grammaticalCase, expected) => {
              expect(mapMappedSingular(base, grammaticalCase)).toBe(expected);
            });

            it.each([
              ["Egomane", "Egomanin", "Egomane"],
              ["Ehegatte", "Ehegattin", "Ehegatte"],
              ["Ergonom", "Ergonomin", "Ergonom"],
              ["Intermediär", "Intermediärin", "Intermediär"],
              ["Herr", "Herrin", "Herr"],
              ["Bauherr", "Bauherrin", "Bauherr"]
            ])("erkennt das Paar %s/%s", (masculine, feminine, expected) => {
              expect(mapMappedSingularPair(masculine, feminine)).toBe(expected);
            });

            it.each([
              ["Einzelne:r", "Einzelner"],
              ["Fortgeschrittene:n", "Fortgeschrittenen"],
              ["Gelehrte:r", "Gelehrter"],
              ["ein:e Fortgeschrittene:r", "ein Fortgeschrittener"],
              ["den:die Gelehrte:n", "den Gelehrten"]
            ])("normalisiert die substantivierte Form %s", (input, expected) => {
              expect(substantivizedAdjectivesRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              "Göttergatt:innen",
              "Koryphäe:innen",
              "Hebamme:innen"
            ])("lässt nicht freigegebene Sonderfälle unverändert: %s", (input) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: input,
                replacements: 0
              });
            });
          });
          '''
          test = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in test.splitlines()
          ) + "\n"
          Path("tests/lexicon-person-forms-wave-40.test.ts").write_text(test, encoding="utf-8")

      - name: Vollständige Prüfung
        run: npm run check

      - name: Temporären Workflow entfernen
        run: rm .github/workflows/temporary-wave40.yml

      - name: Änderungen einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/person-lexicon.ts src/rules/substantivized-adjectives.ts tests/lexicon-person-forms-wave-40.test.ts .github/workflows/temporary-wave40.yml
          git diff --cached --check
          git commit -m "Lexikon: vierzigste konservative Ausbauwelle"
          git push
