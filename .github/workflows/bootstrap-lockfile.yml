name: Lockfile Bootstrap

on:
  push:
    branches: [chore/dependency-security]
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lockfile erzeugen
        run: npm install --package-lock-only --ignore-scripts

      - name: Lockfile committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: add npm lockfile"
          git push origin HEAD:chore/dependency-security
