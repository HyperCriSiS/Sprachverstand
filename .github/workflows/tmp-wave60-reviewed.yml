name: Temporärer Welle-60-Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Produktbranch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: lexicon/reviewed-wave-60
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Privaten Review-Stand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HyperCriSiS/Generic-Datastore
          ref: main
          path: datastore
          token: ${{ secrets.GENERIC_DATASTORE_TOKEN }}
          persist-credentials: false

      - name: Welle 60 erzeugen und prüfen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp-wave60-reviewed.py
          npm run typecheck
          npx vitest run tests/lexicon-person-forms-wave-59.test.ts tests/lexicon-person-forms-wave-60.test.ts
          test -f src/rules/reviewed-person-forms-wave-60.ts
          test -f tests/lexicon-person-forms-wave-60.test.ts
          test "$(git diff --name-only -- src/rules/person-lexicon.ts)" = "src/rules/person-lexicon.ts"

      - name: Produktänderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rules/person-lexicon.ts src/rules/reviewed-person-forms-wave-60.ts tests/lexicon-person-forms-wave-60.test.ts
          git diff --cached --quiet && {
            echo "Keine Produktänderungen vorhanden."
            exit 1
          }
          git commit -m "Lexikon: sechzigste Ausbauwelle"
          git push origin HEAD:lexicon/reviewed-wave-60
