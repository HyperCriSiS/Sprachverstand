name: Temporärer BERUFENET-Patch Welle 36

on:
  push:
    branches:
      - feat/berufenet-language-wave-36

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: BERUFENET-Formen und Regressionen ergänzen
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          lexicon = Path("src/rules/person-lexicon.ts")
          text = lexicon.read_text()
          marker = "const personForms: readonly PersonForms[] = [\n"
          additions = (
              '  { ...weak("anglist"), match: "exact" as const },\n',
              '  { ...weak("amerikanist"), match: "exact" as const },\n',
              '  { ...weak("arabist"), match: "exact" as const },\n',
              '  { ...regular("audiodeskriptor", "audiodeskriptoren"), match: "exact" as const },\n',
              '  { ...weak("baltist"), match: "exact" as const },\n',
              '  { ...weak("finnougrist"), match: "exact" as const },\n',
          )
          for line in reversed(additions):
              if line.strip() not in text:
                  text = text.replace(marker, marker + line, 1)
          lexicon.write_text(text)

          Path("tests/lexicon-person-forms-wave-36.test.ts").write_text('''import { describe, expect, it } from "vitest";
          import { mappedPluralSeparatorsRule } from "../src/rules/mapped-plural-separators";
          import {
            mapMappedSingular,
            mapMappedSingularPair
          } from "../src/rules/person-lexicon";

          describe("sechsunddreißigste konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Anglist:innen", "Anglisten"],
              ["Amerikanist*innen", "Amerikanisten"],
              ["Arabist_innen", "Arabisten"],
              ["Audiodeskriptor:innen", "Audiodeskriptoren"],
              ["Baltist*innen", "Baltisten"],
              ["Finnougrist:innen", "Finnougristen"]
            ])("normalisiert die aktuelle BERUFENET-Form %s", (input, expected) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              ["anglist", "anglisten"],
              ["amerikanist", "amerikanisten"],
              ["arabist", "arabisten"],
              ["baltist", "baltisten"],
              ["finnougrist", "finnougristen"]
            ])("bildet die schwache Flexion von %s korrekt ab", (stem, oblique) => {
              expect(mapMappedSingular(stem, "nominative")).toBe(stem);
              expect(mapMappedSingular(stem, "accusative")).toBe(oblique);
              expect(mapMappedSingular(stem, "dative")).toBe(oblique);
              expect(mapMappedSingular(stem, "genitive")).toBe(oblique);
            });

            it("bildet Audiodeskriptor regulär ab", () => {
              expect(mapMappedSingular("audiodeskriptor", "nominative")).toBe("audiodeskriptor");
              expect(mapMappedSingular("audiodeskriptor", "accusative")).toBe("audiodeskriptor");
              expect(mapMappedSingular("audiodeskriptor", "genitive")).toBe("audiodeskriptors");
            });

            it.each([
              ["Anglist", "Anglistin"],
              ["Amerikanist", "Amerikanistin"],
              ["Arabist", "Arabistin"],
              ["Audiodeskriptor", "Audiodeskriptorin"],
              ["Baltist", "Baltistin"],
              ["Finnougrist", "Finnougristin"]
            ])("erkennt das Singularpaar %s/%s", (masculine, feminine) => {
              expect(mapMappedSingularPair(masculine, feminine)).toBe(masculine);
            });
          });
          ''')
          PY

      - name: Gezielte Regressionen ausführen
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          npx vitest run tests/lexicon-person-forms-wave-36.test.ts

      - name: Temporären Workflow entfernen und Änderungen committen
        shell: bash
        run: |
          rm .github/workflows/temp-berufenet-wave-36.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/person-lexicon.ts tests/lexicon-person-forms-wave-36.test.ts .github/workflows/temp-berufenet-wave-36.yml
          git commit -m "Lexikon: zweite BERUFENET-Ausbauwelle ergänzen"
          git push
