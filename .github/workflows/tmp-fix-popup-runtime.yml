name: Temporärer vollständiger i18n-Fix

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Arbeitsbranch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Node.js 24 einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Temporären Übersetzungstransport reparieren
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const { inflateRawSync, gzipSync } = require("node:zlib");

          const files = [
            "scripts/.tmp-i18n-0.txt",
            "scripts/.tmp-i18n-rest-0.txt",
            "scripts/.tmp-i18n-rest-1.txt",
            "scripts/.tmp-i18n-rest-2.txt"
          ];
          const encoded = files.map((file) => readFileSync(file, "utf8")).join("");
          const gzipData = Buffer.from(encoded, "base64");
          const translations = JSON.parse(
            inflateRawSync(gzipData.subarray(10, -8)).toString("utf8")
          );

          translations.ja = [
            "対象ドメイン",
            "これらのウェブサイトでのみ Sprachverstand を有効にする",
            "除外ドメインに切り替える",
            "対象ドメインに切り替える",
            "現在のウェブサイトをドメインリストに追加",
            "ポップアップに、現在のウェブサイトを動作モードに応じてドメインリストへ追加するボタンを表示します。",
            "ウェブサイトはすでにドメインリストにあります",
            "このウェブサイトを対象にする",
            "このウェブサイトを除外する",
            "1 行につき 1 つのドメインを入力します。サブドメインも対象になり、入力はホスト名に正規化されます。ローカルでは固定の件数制限はありません。ブラウザー同期を有効にしている場合は、その安全なサイズ上限も適用されます。",
            "ドメインリスト",
            "動作モードと関連するドメインリストを同期します。個人用または内部用のドメイン名が含まれる場合があります。",
            "ドメインエントリ「$ENTRY$」は無効です。",
            "ドメインエントリ「$ENTRY$」が重複しているか、同等の表記です。"
          ];
          translations.zh_CN = [
            "包含的域名",
            "仅在这些网站上启用 Sprachverstand",
            "切换到排除的域名",
            "切换到包含的域名",
            "将当前网站添加到域名列表",
            "在弹出窗口中显示一个按钮，根据工作模式将当前网站添加到域名列表。",
            "网站已在域名列表中",
            "包含此网站",
            "排除此网站",
            "每行一个域名。子域名也会被包含；输入会规范化为主机名。本地没有固定数量限制。启用浏览器同步后，还会受到其安全大小限制。",
            "域名列表",
            "同步工作模式和对应的域名列表。可能包含个人或内部域名。",
            "域名条目“$ENTRY$”无效。",
            "域名条目“$ENTRY$”重复或以等效写法出现。"
          ];
          translations.zh_TW = [
            "包含的網域",
            "僅在這些網站上啟用 Sprachverstand",
            "切換到排除的網域",
            "切換到包含的網域",
            "將目前網站加入網域清單",
            "在彈出視窗中顯示按鈕，依工作模式將目前網站加入網域清單。",
            "網站已在網域清單中",
            "包含此網站",
            "排除此網站",
            "每行一個網域。子網域也會包含；輸入會正規化為主機名稱。本機沒有固定數量限制。啟用瀏覽器同步時，還會受到其安全大小限制。",
            "網域清單",
            "同步工作模式及其對應的網域清單。可能包含個人或內部網域名稱。",
            "網域項目「$ENTRY$」無效。",
            "網域項目「$ENTRY$」重複，或以等效寫法出現。"
          ];

          const repaired = gzipSync(Buffer.from(JSON.stringify(translations), "utf8")).toString("base64");
          const cuts = [9829, 6106, 6107];
          const parts = [];
          let offset = 0;
          for (const length of cuts) {
            parts.push(repaired.slice(offset, offset + length));
            offset += length;
          }
          parts.push(repaired.slice(offset));
          for (let index = 0; index < files.length; index += 1) {
            writeFileSync(files[index], parts[index]);
          }
          NODE

      - name: Temporären Generator korrigieren
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path("scripts/fix-i18n-temp.mjs")
          source = path.read_text(encoding="utf-8")
          replacements = {
              r'\`${path}: missing German key ${key}\`': r'\`\${path}: missing German key \${key}\`',
              r'\`${relativePath}: unbekannter i18n-Key ${key}.\`': r'\`\${relativePath}: unbekannter i18n-Key \${key}.\`',
              r'\`Verwaiste i18n-Keys gefunden: ${orphanedKeys.join(", ")}.\`': r'\`Verwaiste i18n-Keys gefunden: \${orphanedKeys.join(", ")}.\`',
          }
          for before, after in replacements.items():
              if before not in source:
                  raise SystemExit(f"Erwarteter Generatorausdruck fehlt: {before}")
              source = source.replace(before, after)
          needle = "        keys.add(match[1]);"
          if source.count(needle) != 2:
              raise SystemExit("Unerwartete Anzahl nicht typensicherer Match-Zugriffe.")
          source = source.replace(needle, "        if (match[1]) keys.add(match[1]);")
          path.write_text(source, encoding="utf-8")
          PY

      - name: i18n-Reparatur anwenden
        run: node scripts/fix-i18n-temp.mjs

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Vollständige Projektprüfung
        run: npm run check

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-fix-popup-runtime.yml scripts/fix-i18n-temp.mjs scripts/.tmp-i18n-*.txt scripts/.tmp-i18n-rest-*.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i18n: neue Domain-Oberfläche vollständig lokalisieren"
          git push origin "HEAD:${GITHUB_REF_NAME}"
