name: Temporärer Locale-Abgleich

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Arbeitsbranch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Semantische Übersetzungsverträge anwenden
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const locales = JSON.parse(fs.readFileSync("config/locales.json", "utf8"));
          const contracts = JSON.parse(fs.readFileSync("config/locale-semantic-contracts.json", "utf8"));

          for (const locale of locales) {
            const file = path.join("static", "_locales", locale.code, "messages.json");
            const messages = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const [key, translations] of Object.entries(contracts)) {
              if (!messages[key] || typeof messages[key] !== "object") {
                throw new Error(`${locale.code}/${key}: Nachricht fehlt.`);
              }
              const expected = translations[locale.code];
              if (typeof expected !== "string" || !expected.trim()) {
                throw new Error(`${locale.code}/${key}: Übersetzung fehlt im Semantikvertrag.`);
              }
              const previous = messages[key].message;
              messages[key].message = expected;
              if (previous !== expected) {
                console.log(`${locale.code}/${key}: ${JSON.stringify(previous)} -> ${JSON.stringify(expected)}`);
              }
            }
            const pretty = locale.code === "de" || locale.code === "en";
            const serialized = pretty ? JSON.stringify(messages, null, 2) : JSON.stringify(messages);
            fs.writeFileSync(file, `${serialized}\n`);
          }
          NODE

          node scripts/validate-locales.mjs
          git diff --check

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- static/_locales; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/_locales
          git commit -m "i18n: Locale-Formatierung beibehalten"
          git push origin "HEAD:${GITHUB_REF_NAME}"
