name: Temporäre Einrückungsbereinigung Mann-Frau

on:
  push:
    branches:
      - feat/singular-mann-frau-shorthand

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Einrückung korrigieren und Regression prüfen
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("src/rules/singular-double-forms.ts")
          text = path.read_text()
          pattern = re.compile(
              r"      replacements:\n\s+shorthandResult\.replacements \+\n\s+phraseResult\.replacements \+\n\s+wordResult\.replacements"
          )
          replacement = (
              "      replacements:\n"
              "        shorthandResult.replacements +\n"
              "        phraseResult.replacements +\n"
              "        wordResult.replacements"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Zählerblock wurde nicht eindeutig gefunden")
          path.write_text(text)
          PY
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          npx vitest run tests/rules/mann-frau-shorthand.test.ts tests/rules/singular-double-forms.test.ts

      - name: Temporären Workflow entfernen und Stand committen
        shell: bash
        run: |
          rm .github/workflows/temp-fix-mann-frau-indent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/singular-double-forms.ts .github/workflows/temp-fix-mann-frau-indent.yml
          git commit -m "style: Mann-Frau-Zähler sauber einrücken"
          git push
