name: Temporäre Lexikon-Ausbauwelle 9 anwenden

on:
  push:
    branches:
      - feat/lexicon-expansion-wave-9
    paths:
      - .github/workflows/tmp-apply-lexicon-wave-9.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Arbeitszweig auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/lexicon-expansion-wave-9
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Weitere stabile Personenfamilien ergänzen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          known_path = Path("src/rules/known-plural-separators.ts")
          known = known_path.read_text(encoding="utf-8")
          start_marker = "const safePluralSuffixes = [\n"
          end_marker = "\n] as const;"
          start = known.index(start_marker) + len(start_marker)
          end = known.index(end_marker, start)
          body = known[start:end]
          additions = [
              "lagerhalter",
              "haushälter",
              "treuhänder",
              "markierer",
              "klempner",
              "holzfäller",
              "färber",
              "küper",
              "küster",
              "schaffner",
              "weber",
              "buchbinder",
              "glaser",
              "akustiker",
              "schornsteinfeger",
              "sprachmittler",
          ]

          missing = [suffix for suffix in additions if f'"{suffix}"' not in body]
          if missing:
              lines = body.splitlines()
              last = max(index for index, line in enumerate(lines) if line.strip())
              if not lines[last].rstrip().endswith(","):
                  lines[last] = lines[last].rstrip() + ","
              for index, suffix in enumerate(missing):
                  comma = "," if index < len(missing) - 1 else ""
                  lines.append(f'  "{suffix}"{comma}')
              known = known[:start] + "\n".join(lines) + known[end:]
              known_path.write_text(known, encoding="utf-8")

          test_path = Path("tests/lexicon-expansion-wave-9.test.ts")
          test_path.write_text(
              '''import { describe, expect, it } from "vitest";
          import {
            knownPluralSeparatorsRule,
            mapKnownSingular
          } from "../src/rules/known-plural-separators";

          describe("neunte konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Lagerhalter:innen", "Lagerhalter"],
              ["Haushälter:innen", "Haushälter"],
              ["Treuhänder:innen", "Treuhänder"],
              ["Fahrbahnmarkierer:innen", "Fahrbahnmarkierer"],
              ["Klempner:innen", "Klempner"],
              ["Holzfäller:innen", "Holzfäller"],
              ["Färber:innen", "Färber"],
              ["Küper:innen", "Küper"],
              ["Küster:innen", "Küster"],
              ["Schlafwagenschaffner:innen", "Schlafwagenschaffner"],
              ["Weber:innen", "Weber"],
              ["Buchbinder:innen", "Buchbinder"],
              ["Glaser:innen", "Glaser"],
              ["Hörgeräteakustiker:innen", "Hörgeräteakustiker"],
              ["Schornsteinfeger:innen", "Schornsteinfeger"],
              ["Sprachmittler:innen", "Sprachmittler"]
            ])("deckt eine weitere morphologisch stabile Personenform ab: %s", (input, expected) => {
              expect(knownPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              ["Lagerhalter", "Lagerhalters"],
              ["Haushälter", "Haushälters"],
              ["Treuhänder", "Treuhänders"],
              ["Fahrbahnmarkierer", "Fahrbahnmarkierers"],
              ["Schlafwagenschaffner", "Schlafwagenschaffners"],
              ["Hörgeräteakustiker", "Hörgeräteakustikers"],
              ["Schornsteinfeger", "Schornsteinfegers"],
              ["Sprachmittler", "Sprachmittlers"]
            ])("stellt auch den sicheren Genitiv bereit: %s", (base, expected) => {
              expect(mapKnownSingular(base, "genitive")).toBe(expected);
            });

            it.each([
              "Schalter:innen",
              "Hälter:innen",
              "Akustik:innen",
              "Glas:innen",
              "Web:innen",
              "Markierung:innen"
            ])("öffnet ähnlich aussehende Nicht-Personenformen nicht: %s", (input) => {
              expect(knownPluralSeparatorsRule.apply(input)).toEqual({
                text: input,
                replacements: 0
              });
            });
          });
          ''',
              encoding="utf-8",
          )
          PY

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Neue Regressionen gezielt prüfen
        run: npx vitest run tests/lexicon-expansion-wave-9.test.ts

      - name: Vollständige Projektprüfung ausführen
        run: npm run check

      - name: Temporären Workflow entfernen und Änderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-apply-lexicon-wave-9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: neunte konservative Lexikonwelle ergänzen"
          git push origin HEAD:feat/lexicon-expansion-wave-9
