name: Apply Beta 12 patch

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/apply-beta12.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Beta-12-Änderungen anwenden
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/beta12.patch.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/beta12.patch

          git apply --check /tmp/beta12.patch
          git apply /tmp/beta12.patch

          rm -rf .automation
          rm .github/workflows/apply-beta12.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare Beta 12 public readiness"
          git push origin HEAD:dev
