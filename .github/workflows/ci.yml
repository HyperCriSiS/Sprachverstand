name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Transformationskern testen
        run: npm exec vitest run tests/transform-text.test.ts

      - name: Textsicherheit testen
        run: npm exec vitest run tests/text-safety.test.ts

      - name: DOM und Wiederherstellung testen
        run: npm exec vitest run tests/dom-processor.test.ts

      - name: Einstellungen und Regelgruppen testen
        run: npm exec vitest run tests/settings.test.ts

      - name: Badge-Zähler testen
        run: npm exec vitest run tests/badge.test.ts

      - name: Gezielten Änderungsumfang testen
        run: npm exec vitest run tests/dom-performance.test.ts

      - name: Fehlertreffer-Regressionen
        run: npm exec vitest run tests/regressions/known-false-positives.test.ts

      - name: Sichere Separatorformen testen
        run: npm exec vitest run tests/rules/known-plural-separators.test.ts

      - name: Titelabkürzungen testen
        run: npm exec vitest run tests/rules/title-abbreviations.test.ts

      - name: Unmarkierte Singularformen testen
        run: npm exec vitest run tests/rules/unmarked-singular.test.ts

      - name: Geschlechtsneutrale Umschreibungen testen
        run: npm exec vitest run tests/rules/neutral-person-terms.test.ts

      - name: Kontextkatalog für Umschreibungen prüfen
        run: npm exec vitest run tests/context-catalog.test.ts

      - name: Stellenanzeigen-Zusätze testen
        run: npm exec vitest run tests/rules/job-ad-suffixes.test.ts

      - name: Neutrale Partizipformen testen
        run: npm exec vitest run tests/rules/salutation-participles.test.ts

      - name: Popup, Regelgruppen und Logo absichern
        shell: bash
        run: |
          grep -q "width: 384px" static/popup/popup.css
          grep -q "min-width: 384px" static/popup/popup.css
          ! grep -Eq "[0-9](vw|vh)" static/popup/popup.css
          grep -q "min-height: 500px" static/popup/popup.css
          grep -q 'id="rule-groups"' static/popup/popup.html
          grep -q 'icons/icon32.png' static/popup/popup.html
          grep -q 'icons/icon48.png' static/options/options.html
          for size in 32 48 128; do
            test -s "static/icons/icon${size}.png"
          done
          grep -q '"default_icon"' manifests/chromium.json
          grep -q '"default_icon"' manifests/firefox.json

      - name: Flexionslexikon testen
        run: npm exec vitest run tests/rules/mapped-plural-separators.test.ts

      - name: Binnen-I testen
        run: npm exec vitest run tests/rules/binnen-i.test.ts

      - name: Singularkontext testen
        run: npm exec vitest run tests/rules/singular-context.test.ts

      - name: Singularsonderformen testen
        run: npm exec vitest run tests/rules/special-singular-forms.test.ts

      - name: Singular-Doppelformen testen
        run: npm exec vitest run tests/rules/singular-double-forms.test.ts

      - name: Pronomen und Possessivpaare testen
        run: npm exec vitest run tests/rules/explicit-pronouns.test.ts

      - name: Doppelnennungen testen
        run: npm exec vitest run tests/rules/double-forms.test.ts

      - name: Browser-Builds erstellen
        run: npm run build

      - name: Erzeugte Logo-Dateien vollständig prüfen
        run: npm run validate:icons

      - name: Firefox Desktop und Android linten
        run: npm run lint:firefox

      - name: Beta-Pakete erstellen und prüfen
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BETA="beta.10"
          mkdir -p artifacts

          (
            cd dist/chromium
            zip -qr "../../artifacts/sprachverstand-${VERSION}-${BETA}-chromium.zip" .
          )

          (
            cd dist/firefox
            zip -qr "../../artifacts/sprachverstand-${VERSION}-${BETA}-firefox.xpi" .
          )

          git archive \
            --format=zip \
            --output="artifacts/sprachverstand-${VERSION}-${BETA}-source.zip" \
            HEAD

          cp docs/BETA-TEST.md artifacts/

          (
            cd artifacts
            sha256sum \
              "sprachverstand-${VERSION}-${BETA}-chromium.zip" \
              "sprachverstand-${VERSION}-${BETA}-firefox.xpi" \
              "sprachverstand-${VERSION}-${BETA}-source.zip" \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          unzip -t "artifacts/sprachverstand-${VERSION}-${BETA}-chromium.zip"
          unzip -t "artifacts/sprachverstand-${VERSION}-${BETA}-firefox.xpi"
          unzip -t "artifacts/sprachverstand-${VERSION}-${BETA}-source.zip"

      - name: Beta-Pakete hochladen
        uses: actions/upload-artifact@v4
        with:
          name: sprachverstand-beta-10-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
