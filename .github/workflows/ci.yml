name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Kernprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten und npm-Cache laden
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Paket- und Lizenzmetadaten prüfen
        run: npm run validate:package

      - name: Öffentliche Freigabe prüfen
        run: npm run validate:public-release

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Popup-Zähler und Ersetzungsübersicht gezielt prüfen
        run: npx vitest run tests/popup-runtime-state.test.ts tests/popup-replacement-overview.test.ts

      - name: Gesamte Testsuite ausführen
        run: npm test

      - name: Lokalisierungen und Store-Metadaten prüfen
        run: |
          npm run validate:locales
          npm run validate:store
          npm run validate:store-exports

      - name: Oberfläche und Rechtshinweise absichern
        shell: bash
        run: |
          grep -q "width: 384px" static/popup/popup.css
          grep -q "max-width: 100vw" static/popup/popup.css
          ! grep -q "min-width: 384px" static/popup/popup.css
          grep -q '@media (hover: none) and (pointer: coarse)' static/popup/popup.css
          grep -q "width: 100vw" static/popup/popup.css
          ! grep -Eq "[0-9]vh" static/popup/popup.css
          ! grep -q "min-height: 500px" static/popup/popup.css
          grep -q 'id="rule-groups"' static/popup/popup.html
          grep -q 'icons/icon32.png' static/popup/popup.html
          ! grep -q '../legal/legal.html' static/popup/popup.html
          grep -q 'icons/icon48.png' static/options/options.html
          grep -q 'id="save-settings"' static/options/options.html
          grep -q 'id="reset"' static/options/options.html
          grep -q 'id="expand-all-sections"' static/options/options.html
          grep -q 'id="collapse-all-sections"' static/options/options.html
          grep -q 'id="custom-replacement-feedback"' static/options/options.html
          grep -q 'id="custom-preview-input"' static/options/options.html
          grep -q 'id="custom-preview-output"' static/options/options.html
          grep -q 'id="process-subtitles"' static/options/options.html
          grep -q 'id="export-personal-rules"' static/options/options.html
          grep -q 'id="import-personal-rules"' static/options/options.html
          grep -q 'id="sync-categories"' static/options/options.html
          grep -q 'data-sync-category="custom-replacements"' static/options/options.html
          grep -q '../legal/legal.html' static/options/options.html
          ! grep -q 'Freie Software unter starkem Copyleft' static/legal/legal.html
          grep -q 'data-i18n="legalTitle"' static/legal/legal.html
          grep -q 'Sprachverstand – Lizenz und Quelltext</h1>' static/legal/legal.html
          test -s LICENSE
          test -s TRADEMARKS.md
          test -s NOTICE
          test -s CONTRIBUTING.md
          test -s data/flexion-regression-cases.json
          test -s docs/SETTINGS-BACKUP-FORMAT.md
          test -s docs/AMO-SOURCE-INSTRUCTIONS.md
          test -s docs/PUBLICATION-CHECKLIST.md
          test -s SECURITY.md
          for size in 32 48 128; do
            test -s "static/icons/icon${size}.png"
          done
          for target in chromium edge opera firefox; do
            grep -q '"default_icon"' "manifests/${target}.json"
          done

  gecko:
    name: Gecko CI
    needs: core
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fehlgeschlagene Kernprüfung übernehmen
        if: ${{ needs.core.result != 'success' }}
        run: exit 1

      - name: Repository auschecken
        if: ${{ needs.core.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten und npm-Cache laden
        if: ${{ needs.core.result == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten reproduzierbar installieren
        if: ${{ needs.core.result == 'success' }}
        run: npm ci

      - name: Firefox-Build erstellen
        if: ${{ needs.core.result == 'success' }}
        run: npm run build:firefox

      - name: Firefox im echten Browser prüfen
        if: ${{ needs.core.result == 'success' }}
        run: npm run test:browser:firefox

      - name: Gecko-Build und Kompatibilität prüfen
        if: ${{ needs.core.result == 'success' }}
        run: npm run check:gecko

      - name: Gecko-Icons vollständig prüfen
        if: ${{ needs.core.result == 'success' }}
        run: npm run validate:icons:firefox

      - name: Firefox Desktop und Android linten
        if: ${{ needs.core.result == 'success' }}
        run: npm run lint:firefox

  chromium:
    name: Chromium CI
    needs: core
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fehlgeschlagene Kernprüfung übernehmen
        if: ${{ needs.core.result != 'success' }}
        run: exit 1

      - name: Repository auschecken
        if: ${{ needs.core.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten und npm-Cache laden
        if: ${{ needs.core.result == 'success' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten reproduzierbar installieren
        if: ${{ needs.core.result == 'success' }}
        run: npm ci

      - name: Chromium-, Edge- und Opera-Builds erstellen
        if: ${{ needs.core.result == 'success' }}
        run: npm run build:chromium && npm run build:edge && npm run build:opera

      - name: Chromium im echten Browser prüfen
        if: ${{ needs.core.result == 'success' }}
        run: npm run test:browser:chromium

      - name: Chromium-Builds und Kompatibilität prüfen
        if: ${{ needs.core.result == 'success' }}
        run: npm run check:chromium

      - name: Chromium-Icons vollständig prüfen
        if: ${{ needs.core.result == 'success' }}
        run: npm run validate:icons:chromium

  check:
    name: check
    needs:
      - core
      - gecko
      - chromium
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gesamtergebnis auswerten
        run: |
          test "${{ needs.core.result }}" = "success"
          test "${{ needs.gecko.result }}" = "success"
          test "${{ needs.chromium.result }}" = "success"
