name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  core:
    name: Kernprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten und npm-Cache laden
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Paket- und Lizenzmetadaten prüfen
        run: |
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));const l=JSON.parse(fs.readFileSync("package-lock.json","utf8"));const manifests=["chromium","edge","opera","firefox"].map(name=>JSON.parse(fs.readFileSync(`manifests/${name}.json`,"utf8")));if(l.version!==p.version||l.packages?.[""]?.version!==p.version)throw new Error("package-lock version mismatch");if(manifests.some(m=>m.version!==p.version))throw new Error("manifest version mismatch");if(p.license!=="AGPL-3.0-only"||l.packages?.[""]?.license!==p.license)throw new Error("license mismatch");'

      - name: Öffentliche Freigabe prüfen
        run: npm run audit:public

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Popup-Zähler und Ersetzungsübersicht gezielt prüfen
        run: >-
          npm run test --
          tests/popup-runtime-state.test.ts
          tests/popup-replacement-overview.test.ts
          tests/background-replacement-state.test.ts
          tests/popup-layout.test.ts

      - name: Gesamte Testsuite ausführen
        run: npm run test

      - name: Lokalisierungen und Store-Metadaten prüfen
        run: |
          npm run validate:locales
          npm run validate:store
          npm run validate:store-exports

      - name: Semantische Übersetzungsänderungen vollständig abgleichen
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/validate-locale-change-coverage.mjs

      - name: Oberfläche und Rechtshinweise absichern
        shell: bash
        run: |
          grep -q "width: 384px" static/popup/popup.css
          grep -q "min-width: 384px" static/popup/popup.css
          ! grep -q "max-width: 100vw" static/popup/popup.css
          grep -q '@media (hover: none) and (pointer: coarse)' static/popup/popup.css
          grep -q "width: 100%" static/popup/popup.css
          grep -q "min-width: 0" static/popup/popup.css
          ! grep -q "width: 100vw" static/popup/popup.css
          ! grep -Eq "[0-9]vh" static/popup/popup.css
          ! grep -q "min-height: 500px" static/popup/popup.css
          grep -q 'id="rule-groups"' static/popup/popup.html
          grep -q 'icons/icon32.png' static/popup/popup.html
          ! grep -q '../legal/legal.html' static/popup/popup.html
          grep -q 'icons/icon48.png' static/options/options.html
          grep -q 'id="save-settings"' static/options/options.html
          ! grep -q 'id="reset"' static/options/options.html
          grep -q 'id="expand-all-sections"' static/options/options.html
          grep -q 'id="collapse-all-sections"' static/options/options.html
          grep -q 'id="custom-replacement-feedback"' static/options/options.html
          grep -q 'id="custom-preview-input"' static/options/options.html
          grep -q 'id="custom-preview-output"' static/options/options.html
          grep -q 'id="process-subtitles"' static/options/options.html
          grep -q 'id="export-personal-rules"' static/options/options.html
          grep -q 'id="import-personal-rules"' static/options/options.html
          grep -q 'id="sync-categories"' static/options/options.html
          grep -q 'data-sync-category="custom-replacements"' static/options/options.html
          grep -q '../legal/legal.html' static/options/options.html
          ! grep -q 'Freie Software unter starkem Copyleft' static/legal/legal.html
          grep -q 'data-i18n="legalTitle"' static/legal/legal.html
          grep -q 'Sprachverstand – Lizenz und Quelltext</h1>' static/legal/legal.html
          test -s LICENSE
          test -s TRADEMARKS.md
          test -s NOTICE
          test -s CONTRIBUTING.md
          test -s data/flexion-regression-cases.json
          test -s docs/SETTINGS-BACKUP-FORMAT.md
          test -s docs/AMO-SOURCE-INSTRUCTIONS.md
          test -s docs/PUBLICATION-CHECKLIST.md
          test -s SECURITY.md
          for size in 32 48 128; do
            test -s "static/icons/icon${size}.png"
          done
          for target in chromium edge opera firefox; do
            grep -q '"default_icon"' "manifests/${target}.json"
          done

  gecko:
    name: Gecko CI
    needs: core
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fehlgeschlagene Kernprüfung übernehmen
        if: ${{ needs.core.result != 'success' }}
        run: |
          echo "Die gemeinsame Kernprüfung war nicht erfolgreich."
          exit 1

      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten und npm-Cache laden
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Firefox-Build erstellen
        run: npm run build:firefox

      - name: Firefox im echten Browser prüfen
        run: npm run test:browser:firefox

      - name: Firefox-Video und echte Untertitel prüfen
        run: node scripts/video-playback-regression.mjs --browser firefox --diagnose-cue-phases

      - name: Gecko-Build und Kompatibilität prüfen
        run: npm run validate:browsers:gecko

      - name: Gecko-Icons vollständig prüfen
        run: node scripts/validate-icons.mjs dist/firefox/icons

      - name: Firefox Desktop und Android linten
        run: npm run lint:firefox

  chromium:
    name: Chromium CI
    needs: core
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fehlgeschlagene Kernprüfung übernehmen
        if: ${{ needs.core.result != 'success' }}
        run: |
          echo "Die gemeinsame Kernprüfung war nicht erfolgreich."
          exit 1

      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten und npm-Cache laden
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Gemeinsamen Chromium-Familienbuild erstellen
        run: npm run build:chromium

      - name: Chromium im echten Browser prüfen
        id: chromium_smoke
        env:
          SMOKE_NAVIGATION_DIAGNOSTICS: "1"
          SMOKE_PROCESS_IO: "1"
        run: npm run test:browser:chromium

      - name: Begrenzten Navigationsfehlernachweis prüfen
        id: navigation_diagnostic
        if: ${{ failure() && steps.chromium_smoke.outcome == 'failure' }}
        run: node scripts/validate-navigation-failure-summary.mjs

      - name: Geprüften synthetischen Navigationsfehlernachweis sichern
        if: ${{ failure() && steps.navigation_diagnostic.outcome == 'success' && steps.navigation_diagnostic.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: navigation-failure-${{ github.sha }}
          path: artifacts/browser-smoke-navigation/navigation-failure.json
          if-no-files-found: error
          retention-days: 7

      - name: Begrenzten Start-/Navigationsprozessnachweis prüfen
        id: process_io_diagnostic
        if: ${{ failure() && steps.chromium_smoke.outcome == 'failure' }}
        run: node scripts/validate-smoke-process-io.mjs

      - name: Geprüften synthetischen Prozessnachweis sichern
        if: ${{ failure() && steps.process_io_diagnostic.outcome == 'success' && steps.process_io_diagnostic.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: startup-process-io-${{ github.sha }}
          path: artifacts/browser-smoke-navigation/process-io.json
          if-no-files-found: error
          retention-days: 7

      - name: Kontrollierte Klick-/Eingabe- und Longtaskdiagnose prüfen
        run: npm run test:browser:interaction:chromium -- --pairs 1

      - name: Videowiedergabe unter DOM-Last prüfen
        id: chromium_video
        run: npm run test:browser:video:chromium

      - name: Synthetische Videofehlerwerte filtern
        id: video_diagnostic
        if: ${{ failure() && steps.chromium_video.outcome == 'failure' }}
        run: node scripts/sanitize-video-failure.mjs

      - name: Ausschließlich gefilterte Videofehlerwerte sichern
        if: ${{ failure() && steps.video_diagnostic.outcome == 'success' && steps.video_diagnostic.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: video-failure-${{ github.sha }}
          path: |
            artifacts/video-playback/sanitized-video-failure-1.json
            artifacts/video-playback/sanitized-video-failure-2.json
          if-no-files-found: error
          retention-days: 7

      - name: Chromium-Basisbuild und Familienkompatibilität prüfen
        run: npm run validate:browsers:chromium

      - name: Chromium-Icons vollständig prüfen
        run: node scripts/validate-icons.mjs dist/chromium/icons

  performance:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten und npm-Cache laden
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: DOM-Performance messen
        env:
          PERFORMANCE_REPORT_PATH: performance-report.json
        run: npm run benchmark:dom

      - name: Performance-Report archivieren
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dom-performance-${{ github.sha }}
          path: performance-report.json
          if-no-files-found: error
          retention-days: 90

  check:
    name: check
    needs: [core, gecko, chromium, performance]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Erforderlichen Gesamtstatus setzen
        run: |
          test "${{ needs.core.result }}" = "success"
          test "${{ needs.gecko.result }}" = "success"
          test "${{ needs.chromium.result }}" = "success"
          test "${{ needs.performance.result }}" = "success"
