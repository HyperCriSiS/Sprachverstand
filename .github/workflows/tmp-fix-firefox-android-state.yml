          +  try {
          +    await session.set({ [runtimeStateStorageKey(tabId)]: state });
          +  } catch {
          +    // Der Laufzeitzustand ist nur eine Komfortkopie; der Hauptpfad bleibt aktiv.
          +  }
          +}
          +
          +async function removePersistedTabState(tabId: number): Promise<void> {
          +  const session = api.storage.session;
          +  if (!session) {
          +    return;
          +  }
          +
          +  try {
          +    await session.remove(runtimeStateStorageKey(tabId));
          +  } catch {
          +    // Beim Browser-Shutdown kann der Session-Speicher bereits verschwunden sein.
          +  }
