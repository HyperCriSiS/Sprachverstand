name: Temporärer Firefox-Android-Zustandsfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Fixes anwenden
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Muster fehlt in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("src/browser/api.ts", "export interface ExtensionTab {\n  readonly id?: number;\n}", "export interface ExtensionTab {\n  readonly id?: number;\n  readonly url?: string;\n}")
          replace_once("src/browser/api.ts", "    readonly sync: StorageArea;\n    readonly local: StorageArea;", "    readonly sync: StorageArea;\n    readonly local: StorageArea;\n    readonly session?: StorageArea;")
          replace_once("src/browser/api.ts", "  readonly tabs: {\n    create(createProperties:", "  readonly tabs: {\n    get?(tabId: number): Promise<ExtensionTab>;\n    create(createProperties:")

          replace_once("src/browser/options.ts", "    \"openOptionsPage\" | \"sendMessage\"", "    \"getURL\" | \"sendMessage\"")
          replace_once("src/browser/options.ts", "  readonly tabs: Pick<ExtensionApi[\"tabs\"], \"query\">;", "  readonly tabs: Pick<ExtensionApi[\"tabs\"], \"create\" | \"query\" | \"update\">;")
          options_helper = "function optionsPageUrl(api: OptionsPageApi, tabId: number | undefined): string {\n  const url = new URL(api.runtime.getURL(\"options/options.html\"));\n  if (isValidTabId(tabId)) {\n    url.searchParams.set(\"tabId\", String(tabId));\n  }\n  return url.toString();\n}\n\n"
          replace_once("src/browser/options.ts", "export async function openOptionsPageInForeground", options_helper + "export async function openOptionsPageInForeground")
          old_options_tail = "  if (isValidTabId(activeTab?.id)) {\n    await api.runtime.sendMessage({\n      type: \"sprachverstand.set-inspected-tab\",\n      tabId: activeTab.id\n    });\n  }\n\n  // Die semantische Options-API überlässt Firefox die korrekte Auswahl und\n  // Fokussierung der Optionsseite. tabs.create({ active: true }) garantiert\n  // lediglich einen aktiven Tab, nicht den Fokus des Browserfensters.\n  await api.runtime.openOptionsPage();"
          new_options_tail = "  const inspectedTabId = isValidTabId(activeTab?.id) ? activeTab.id : undefined;\n\n  if (inspectedTabId !== undefined) {\n    await api.runtime.sendMessage({\n      type: \"sprachverstand.set-inspected-tab\",\n      tabId: inspectedTabId\n    });\n  }\n\n  // Firefox Android kann runtime.openOptionsPage() hinter dem Vollbild-Popup\n  // öffnen. Ein explizit aktiver Tab plus anschließendes Schließen des Popups\n  // hält die Einstellungen sichtbar im Vordergrund.\n  const createdTab = await api.tabs.create({\n    url: optionsPageUrl(api, inspectedTabId),\n    active: true\n  });\n\n  if (isValidTabId(createdTab.id)) {\n    await api.tabs.update(createdTab.id, { active: true });\n  }"
          replace_once("src/browser/options.ts", old_options_tail, new_options_tail)

          replace_once("src/popup.ts", "  optionsButton.addEventListener(\"click\", () => {\n    void openOptionsPageInForeground(api);\n  });", "  optionsButton.addEventListener(\"click\", () => {\n    void (async () => {\n      try {\n        await openOptionsPageInForeground(api);\n        window.close();\n      } catch (error) {\n        console.error(\"Die erweiterten Einstellungen konnten nicht geöffnet werden.\", error);\n      }\n    })();\n  });")

          replace_once("src/background.ts", "const api = getExtensionApi();\nconst statesByTab = new Map<number, CachedReplacementState>();\nlet inspectedTabId: number | undefined;", "const api = getExtensionApi();\nconst statesByTab = new Map<number, CachedReplacementState>();\nconst runtimeStateStoragePrefix = \"sprachverstand.runtime-state.\";\nlet inspectedTabId: number | undefined;")
          session_helpers = "function runtimeStateStorageKey(tabId: number): string {\n  return `${runtimeStateStoragePrefix}${tabId}`;\n}\n\nfunction normalizedCachedState(value: unknown): CachedReplacementState | undefined {\n  if (!value || typeof value !== \"object\") {\n    return undefined;\n  }\n\n  const candidate = value as { readonly hostname?: unknown; readonly count?: unknown; readonly replacements?: unknown };\n  if (typeof candidate.count !== \"number\" || !Number.isFinite(candidate.count) || !Array.isArray(candidate.replacements)) {\n    return undefined;\n  }\n\n  return {\n    hostname: typeof candidate.hostname === \"string\" && candidate.hostname ? candidate.hostname : undefined,\n    count: Math.max(0, Math.trunc(candidate.count)),\n    replacements: normalizedReplacementEntries(candidate.replacements)\n  };\n}\n\nasync function hostnameFromTab(tabId: number): Promise<string | undefined> {\n  if (!api.tabs.get) {\n    return undefined;\n  }\n  try {\n    const tab = await api.tabs.get(tabId);\n    return hostnameFromSenderUrl(tab.url);\n  } catch {\n    return undefined;\n  }\n}\n\nasync function readCachedTabState(tabId: number): Promise<CachedReplacementState | undefined> {\n  const memoryState = statesByTab.get(tabId);\n  if (memoryState) {\n    return memoryState;\n  }\n  const session = api.storage.session;\n  if (!session) {\n    return undefined;\n  }\n  try {\n    const key = runtimeStateStorageKey(tabId);\n    const values = await session.get(key);\n    const state = normalizedCachedState(values[key]);\n    if (!state) {\n      return undefined;\n    }\n    const restored = { ...state, hostname: state.hostname ?? (await hostnameFromTab(tabId)) };\n    statesByTab.set(tabId, restored);\n    return restored;\n  } catch {\n    return undefined;\n  }\n}\n\nasync function persistTabState(tabId: number, state: CachedReplacementState): Promise<void> {\n  const session = api.storage.session;\n  if (!session) {\n    return;\n  }\n  try {\n    await session.set({ [runtimeStateStorageKey(tabId)]: state });\n  } catch {\n    // Session-Speicher ist auf älteren Browsern nicht verfügbar.\n  }\n}\n\nasync function removePersistedTabState(tabId: number): Promise<void> {\n  const session = api.storage.session;\n  if (!session) {\n    return;\n  }\n  try {\n    await session.remove(runtimeStateStorageKey(tabId));\n  } catch {\n    // Der flüchtige Session-Speicher ist nur eine Robustheitsschicht.\n  }\n}\n\n"
          replace_once("src/background.ts", "async function notifyStateUpdate", session_helpers + "async function notifyStateUpdate")
          replace_once("src/background.ts", "  statesByTab.set(tabId, state);\n\n  await Promise.all([", "  statesByTab.set(tabId, state);\n  await persistTabState(tabId, state);\n\n  await Promise.all([")
          replace_once("src/background.ts", "  statesByTab.delete(tabId);\n\n  try {", "  statesByTab.delete(tabId);\n  await removePersistedTabState(tabId);\n\n  try {")
          replace_once("src/background.ts", "  const cached = statesByTab.get(tabId);\n  const live = await readLiveReplacementState(tabId);", "  const cached = await readCachedTabState(tabId);\n  const live = await readLiveReplacementState(tabId);")
          replace_once("src/background.ts", "    statesByTab.set(tabId, merged);\n    return { tabId, text: formatBadgeCount(merged.count) || \"0\" };", "    statesByTab.set(tabId, merged);\n    await persistTabState(tabId, merged);\n    return { tabId, text: formatBadgeCount(merged.count) || \"0\" };")
          replace_once("src/background.ts", "      statesByTab.get(tabId)\n    );\n    await updateTabState(tabId, incoming);", "      await readCachedTabState(tabId)\n    );\n    await updateTabState(tabId, incoming);")
          replace_once("src/background.ts", "    await updateTabState(tabId, {\n      hostname:\n        statesByTab.get(tabId)?.hostname ?? hostnameFromSenderUrl(sender.url),\n      count: Math.max(0, Math.trunc(message.count)),\n      replacements: statesByTab.get(tabId)?.replacements ?? []\n    });", "    const cached = await readCachedTabState(tabId);\n    await updateTabState(tabId, {\n      hostname: cached?.hostname ?? hostnameFromSenderUrl(sender.url),\n      count: Math.max(0, Math.trunc(message.count)),\n      replacements: cached?.replacements ?? []\n    });")
          replace_once("src/background.ts", "    const cached = statesByTab.get(message.tabId);\n    const live = await readLiveReplacementState(message.tabId);", "    const cached = await readCachedTabState(message.tabId);\n    const live = await readLiveReplacementState(message.tabId);")
          replace_once("src/background.ts", "      statesByTab.set(message.tabId, merged);\n      return {", "      statesByTab.set(message.tabId, merged);\n      await persistTabState(message.tabId, merged);\n      return {")
          replace_once("src/background.ts", "      hostname: undefined,\n      count: Number.parseInt(badgeText, 10) || 0,", "      hostname: await hostnameFromTab(message.tabId),\n      count: Number.parseInt(badgeText, 10) || 0,")
          replace_once("src/background.ts", "api.tabs.onRemoved.addListener((tabId) => {\n  statesByTab.delete(tabId);\n});", "api.tabs.onRemoved.addListener((tabId) => {\n  statesByTab.delete(tabId);\n  void removePersistedTabState(tabId);\n});")

          # Bestehende Tests an die neue Optionsstrategie und Session-Robustheit anpassen.
          replace_once("tests/browser-options.test.ts", "  it(\"übergibt den Ursprungstab und öffnet danach die native Optionsseite\", async () => {", "  it(\"übergibt den Ursprungstab und öffnet danach einen aktiven Options-Tab\", async () => {")
          replace_once("tests/browser-options.test.ts", "    const openOptionsPage = vi.fn(async () => {\n      calls.push(\"open-options\");\n    });\n    const query = vi.fn(async () => [{ id: 17 }]);", "    const getURL = vi.fn((path: string) => `moz-extension://sprachverstand/${path}`);\n    const query = vi.fn(async () => [{ id: 17 }]);\n    const create = vi.fn(async () => { calls.push(\"create-tab\"); return { id: 31 }; });\n    const update = vi.fn(async () => { calls.push(\"activate-tab\"); return { id: 31 }; });")
          replace_once("tests/browser-options.test.ts", "      runtime: { sendMessage, openOptionsPage },\n      tabs: { query }", "      runtime: { sendMessage, getURL },\n      tabs: { query, create, update }")
          replace_once("tests/browser-options.test.ts", "    expect(openOptionsPage).toHaveBeenCalledTimes(1);\n    expect(calls).toEqual([\"inspected-tab\", \"open-options\"]);", "    expect(create).toHaveBeenCalledWith({\n      url: \"moz-extension://sprachverstand/options/options.html?tabId=17\",\n      active: true\n    });\n    expect(update).toHaveBeenCalledWith(31, { active: true });\n    expect(calls).toEqual([\"inspected-tab\", \"create-tab\", \"activate-tab\"]);")
          replace_once("tests/browser-options.test.ts", "  it(\"öffnet ohne gültigen aktiven Tab trotzdem die Optionsseite\", async () => {\n    const sendMessage = vi.fn(async () => undefined);\n    const openOptionsPage = vi.fn(async () => undefined);\n    const query = vi.fn(async () => [{}]);\n\n    await openOptionsPageInForeground({\n      runtime: { sendMessage, openOptionsPage },\n      tabs: { query }\n    });\n\n    expect(sendMessage).not.toHaveBeenCalled();\n    expect(openOptionsPage).toHaveBeenCalledTimes(1);\n  });", "  it(\"öffnet ohne gültigen aktiven Tab trotzdem einen aktiven Options-Tab\", async () => {\n    const sendMessage = vi.fn(async () => undefined);\n    const getURL = vi.fn((path: string) => `moz-extension://sprachverstand/${path}`);\n    const query = vi.fn(async () => [{}]);\n    const create = vi.fn(async () => ({ id: 31 }));\n    const update = vi.fn(async () => ({ id: 31 }));\n\n    await openOptionsPageInForeground({\n      runtime: { sendMessage, getURL },\n      tabs: { query, create, update }\n    });\n\n    expect(sendMessage).not.toHaveBeenCalled();\n    expect(create).toHaveBeenCalledWith({\n      url: \"moz-extension://sprachverstand/options/options.html\",\n      active: true\n    });\n    expect(update).toHaveBeenCalledWith(31, { active: true });\n  });")

          replace_once("tests/options-count-context.test.ts", "  it(\"übergibt den Ursprungstab vor dem nativen Öffnen der Optionsseite\", () => {\n    expect(browserOptionsSource).toContain(\"sprachverstand.set-inspected-tab\");\n    expect(browserOptionsSource).toContain(\"api.runtime.openOptionsPage()\");", "  it(\"übergibt den Ursprungstab und öffnet die Optionsseite sichtbar als aktiven Tab\", () => {\n    expect(browserOptionsSource).toContain(\"sprachverstand.set-inspected-tab\");\n    expect(browserOptionsSource).toContain(\"api.tabs.create({\");\n    expect(browserOptionsSource).toContain(\"active: true\");\n    expect(browserOptionsSource).not.toContain(\"api.runtime.openOptionsPage()\");")
          replace_once("tests/options-count-context.test.ts", "  it(\"fragt nach einem Worker-Neustart den Content-Script-Zustand live ab und erhält vollständige Cache-Daten\", () => {\n    expect(backgroundSource).toContain(\n      \"const live = await readLiveReplacementState(tabId)\"\n    );\n    expect(backgroundSource).toContain(\n      \"const merged = mergeCompatibleState(live, cached)\"\n    );\n    expect(backgroundSource).toContain(\"statesByTab.set(tabId, merged)\");\n  });", "  it(\"stellt vollständige Ersetzungsdetails nach einem Background-Neustart aus storage.session wieder her\", () => {\n    expect(backgroundSource).toContain(\"sprachverstand.runtime-state.\");\n    expect(backgroundSource).toContain(\"api.storage.session\");\n    expect(backgroundSource).toContain(\"readCachedTabState(tabId)\");\n    expect(backgroundSource).toContain(\"persistTabState(tabId, state)\");\n  });")

          # main dauerhaft auf die bereits gültige Modern-Basisversion 0.7.2 bringen.
          for path in ["package.json", "package-lock.json", "manifests/chromium.json", "manifests/firefox.json", "manifests/edge.json", "manifests/opera.json"]:
              p = Path(path)
              p.write_text(p.read_text().replace('"version": "0.7.0"', '"version": "0.7.2"'))
          PY

      - name: Vollständige Prüfung
        run: npm run check

      - name: Änderungen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/browser/api.ts src/browser/options.ts src/popup.ts src/background.ts \
            tests/browser-options.test.ts tests/options-count-context.test.ts \
            package.json package-lock.json manifests/*.json
          git diff --cached --check
          git commit -m "fix: Firefox-Android-Popupzustand dauerhaft stabilisieren"
          git push origin HEAD:main
