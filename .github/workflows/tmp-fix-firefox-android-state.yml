          +
          +function normalizedCachedReplacementState(
          +  value: unknown
          +): CachedReplacementState | undefined {
          +  if (!value || typeof value !== "object") {
          +    return undefined;
          +  }
          +
          +  const candidate = value as {
          +    readonly hostname?: unknown;
          +    readonly count?: unknown;
          +    readonly replacements?: unknown;
          +  };
          +  if (
          +    typeof candidate.count !== "number" ||
          +    !Number.isFinite(candidate.count) ||
          +    !Array.isArray(candidate.replacements)
          +  ) {
          +    return undefined;
          +  }
          +
          +  return {
          +    hostname:
          +      typeof candidate.hostname === "string" && candidate.hostname
          +        ? candidate.hostname
          +        : undefined,
          +    count: Math.max(0, Math.trunc(candidate.count)),
          +    replacements: normalizedReplacementEntries(candidate.replacements)
          +  };
          +}
          +
          +async function readPersistedTabState(
          +  tabId: number
          +): Promise<CachedReplacementState | undefined> {
          +  const session = api.storage.session;
          +  if (!session) {
          +    return undefined;
          +  }
          +
          +  const key = runtimeStateStorageKey(tabId);
          +  try {
          +    const stored = await session.get(key);
          +    return normalizedCachedReplacementState(stored[key]);
          +  } catch {
          +    // Pale Moon und ältere Browser können storage.session noch nicht anbieten.
          +    return undefined;
          +  }
          +}
          +
          +async function readCachedTabState(
          +  tabId: number
          +): Promise<CachedReplacementState | undefined> {
          +  const memoryState = statesByTab.get(tabId);
          +  if (memoryState) {
          +    return memoryState;
          +  }
          +
          +  const persisted = await readPersistedTabState(tabId);
          +  const newerMemoryState = statesByTab.get(tabId);
          +  if (newerMemoryState) {
          +    return newerMemoryState;
          +  }
          +
          +  if (persisted) {
          +    statesByTab.set(tabId, persisted);
          +  }
          +  return persisted;
          +}
          +
          +async function persistTabState(
