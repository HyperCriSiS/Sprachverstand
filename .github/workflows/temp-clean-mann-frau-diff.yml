name: Temporäre Bereinigung Mann-Frau-Diff

on:
  push:
    branches:
      - feat/singular-mann-frau-shorthand

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ausgangsdatei von main wiederherstellen und gezielt patchen
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:src/rules/singular-double-forms.ts > src/rules/singular-double-forms.ts
          python <<'PY'
          from pathlib import Path

          rule = Path("src/rules/singular-double-forms.ts")
          text = rule.read_text()

          marker = "const determinerPairs: DeterminerPair[] = [];\n"
          pattern = '''const mannFrauShorthandPattern = new RegExp(
            String.raw`(?<![\\p{L}\\p{M}])([\\p{L}\\p{M}’'-]*mann)\\s*/\\s*-frau(?![\\p{L}\\p{M}])`,
            "giu"
          );
          '''
          if marker not in text:
              raise SystemExit("Einfügestelle für Kurzformmuster wurde nicht gefunden")
          text = text.replace(marker, pattern + marker, 1)

          function_marker = "function transformInflectedPhrases(input: string): TransformResult {\n"
          helper = '''function transformMannFrauShorthand(input: string): TransformResult {
            let replacements = 0;
            const text = input.replace(
              mannFrauShorthandPattern,
              (_match: string, masculine: string) => {
                replacements += 1;
                return masculine;
              }
            );
            return { text, replacements };
          }

          '''
          if function_marker not in text:
              raise SystemExit("Einfügestelle für Kurzform-Transformation wurde nicht gefunden")
          text = text.replace(function_marker, helper + function_marker, 1)

          old_phrase = "    const phraseResult = transformInflectedPhrases(input);"
          new_phrase = '''    const shorthandResult = transformMannFrauShorthand(input);
              const phraseResult = transformInflectedPhrases(shorthandResult.text);'''
          if old_phrase not in text:
              raise SystemExit("Apply-Einstieg wurde nicht gefunden")
          text = text.replace(old_phrase, new_phrase, 1)

          old_count = "      replacements: phraseResult.replacements + wordResult.replacements"
          new_count = '''      replacements:
                shorthandResult.replacements +
                phraseResult.replacements +
                wordResult.replacements'''
          if old_count not in text:
              raise SystemExit("Replacement-Zähler wurde nicht gefunden")
          text = text.replace(old_count, new_count, 1)
          rule.write_text(text)

          Path("tests/rules/mann-frau-shorthand.test.ts").write_text('''import { describe, expect, it } from "vitest";
          import { singularDoubleFormsRule } from "../../src/rules/singular-double-forms";

          describe("explizite Mann-Frau-Kurzformen", () => {
            it.each([
              ["Automatenfachmann/-frau", "Automatenfachmann"],
              ["Automobilkaufmann/-frau", "Automobilkaufmann"],
              ["Bankkaufmann/-frau", "Bankkaufmann"],
              ["Berg- und Maschinenmann/-frau", "Berg- und Maschinenmann"],
              ["Fachmann/-frau - Systemgastronomie", "Fachmann - Systemgastronomie"],
              ["Hotelfachmann/-frau", "Hotelfachmann"],
              ["Medienkaufmann/-frau Digital und Print", "Medienkaufmann Digital und Print"],
              ["Pflegefachmann/-frau", "Pflegefachmann"],
              ["Werkfeuerwehrmann/-frau", "Werkfeuerwehrmann"],
              ["BANKKAUFMANN/-FRAU", "BANKKAUFMANN"]
            ])("normalisiert die amtliche Kurzform %s", (input, expected) => {
              expect(singularDoubleFormsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              "Zimmermann/Zimmerfrau",
              "Mann/Frau",
              "Kaufmann/Kauffrau",
              "mannigfaltig/-frau"
            ])("lässt nicht explizit unterstützte Vollformen unverändert: %s", (input) => {
              expect(singularDoubleFormsRule.apply(input)).toEqual({
                text: input,
                replacements: 0
              });
            });
          });
          ''')
          PY

      - name: Regressionen erneut prüfen
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          npx vitest run tests/rules/mann-frau-shorthand.test.ts tests/rules/singular-double-forms.test.ts

      - name: Bereinigten Stand committen
        shell: bash
        run: |
          rm .github/workflows/temp-clean-mann-frau-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/singular-double-forms.ts tests/rules/mann-frau-shorthand.test.ts .github/workflows/temp-clean-mann-frau-diff.yml
          git commit -m "chore: Mann-Frau-Diff auf fachliche Änderung reduzieren"
          git push
