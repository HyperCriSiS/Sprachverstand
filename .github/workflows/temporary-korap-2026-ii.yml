name: Temporärer KorAP-2026-II-Regelaudit

on:
  push:
    branches:
      - feat/korap-2026-ii-kurzformen

permissions:
  contents: write

jobs:
  patch-und-pruefung:
    runs-on: ubuntu-latest
    steps:
      - name: Branch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/korap-2026-ii-kurzformen

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: KorAP-Regeländerungen anwenden
        shell: python
        run: |
          from pathlib import Path

          # Klammerformen bekannter Personenbasen.
          path = Path("src/rules/unmarked-singular.ts")
          text = path.read_text(encoding="utf-8")
          if "parentheticalMarkerPattern" not in text:
              anchor = '''const binnenIMarkerPattern =
            /(?<![\\p{L}\\p{M}])([\\p{L}\\p{M}’'-]+)In(?![\\p{L}\\p{M}])/gu;
          '''
              insertion = '''const parentheticalMarkerPattern =
            /(?<![\\p{L}\\p{M}])([\\p{L}\\p{M}’'-]+)\\((?:-)?in\\)(?![\\p{L}\\p{M}])/giu;
          '''
              if anchor not in text:
                  raise RuntimeError("Anker für Klammermuster nicht gefunden")
              text = text.replace(anchor, anchor + insertion, 1)

          if "const parentheticalResult" not in text:
              start = text.index("    const binnenIResult = transformMarkerPattern(")
              return_pos = text.index("\n\n    return {", start)
              insertion = "\n    const parentheticalResult = transformMarkerPattern(\n      binnenIResult.text,\n      parentheticalMarkerPattern,\n      true\n    );"
              text = text[:return_pos] + insertion + text[return_pos:]
              text = text.replace(
                  "      text: binnenIResult.text,",
                  "      text: parentheticalResult.text,",
                  1
              )
              text = text.replace(
                  "        binnenIResult.replacements",
                  "        binnenIResult.replacements +\n        parentheticalResult.replacements",
                  1
              )
          path.write_text(text, encoding="utf-8")

          # Kaufmann/frau exakt, ohne Komposita zu verallgemeinern.
          path = Path("src/rules/singular-double-forms.ts")
          text = path.read_text(encoding="utf-8")
          if "kaufmannFrauShorthandPattern" not in text:
              anchor = '''const mannFrauShorthandPattern = new RegExp(
            String.raw`(?<![\\p{L}\\p{M}])([\\p{L}\\p{M}’'-]*mann)\\s*/\\s*-frau(?![\\p{L}\\p{M}])`,
            "giu"
          );
          '''
              insertion = '''const kaufmannFrauShorthandPattern =
            /(?<![\\p{L}\\p{M}])(Kaufmann)\\s*\/\\s*frau(?![\\p{L}\\p{M}])/giu;
          '''
              if anchor not in text:
                  raise RuntimeError("Anker für Mann-Frau-Muster nicht gefunden")
              text = text.replace(anchor, anchor + insertion, 1)

          text = text.replace(
              "function transformMannFrauShorthand(input: string): TransformResult {",
              "function transformMannFrauShorthand(\n  input: string,\n  pattern = mannFrauShorthandPattern\n): TransformResult {",
              1
          )
          text = text.replace(
              "    mannFrauShorthandPattern,",
              "    pattern,",
              1
          )

          if "const kaufmannResult" not in text:
              old_chain = "    const shorthandResult = transformMannFrauShorthand(input);\n    const phraseResult = transformInflectedPhrases(shorthandResult.text);"
              new_chain = "    const shorthandResult = transformMannFrauShorthand(input);\n    const kaufmannResult = transformMannFrauShorthand(\n      shorthandResult.text,\n      kaufmannFrauShorthandPattern\n    );\n    const phraseResult = transformInflectedPhrases(kaufmannResult.text);"
              if old_chain not in text:
                  raise RuntimeError("Ausführungskette für Kaufmann/frau nicht gefunden")
              text = text.replace(old_chain, new_chain, 1)

              old_count = "        shorthandResult.replacements +\n        phraseResult.replacements +"
              new_count = "        shorthandResult.replacements +\n        kaufmannResult.replacements +\n        phraseResult.replacements +"
              if old_count not in text:
                  raise RuntimeError("Ersetzungszähler für Kaufmann/frau nicht gefunden")
              text = text.replace(old_count, new_count, 1)

          if "const kaufmannResult" not in text:
              raise RuntimeError("Kaufmann/frau wurde nicht in die Regelkette eingebunden")
          path.write_text(text, encoding="utf-8")

          # Exakte dokumentierte Pronomen- und Determinerkurzformen.
          path = Path("src/rules/explicit-pronouns.ts")
          text = path.read_text(encoding="utf-8")
          if '["ihm/r", "ihm"]' not in text:
              text = text.replace(
                  'const replacements = new Map<string, string>([["jede/-r", "jeder"]]);',
                  '''const replacements = new Map<string, string>([
            ["jede/-r", "jeder"],
            ["ihm/r", "ihm"],
            ["diese(r)", "dieser"],
            ["eine(n)", "einen"]
          ]);''',
                  1
              )
          if "diese\\(r\\)" not in text:
              old_pattern = r'''/(?<![\p{L}\p{M}])(?:([\p{L}\p{M}]+)([:*_/·•’‘])([\p{L}\p{M}]+)|(jede\/-r))(?![\p{L}\p{M}])/giu;'''
              new_pattern = r'''/(?<![\p{L}\p{M}])(?:([\p{L}\p{M}]+)([:*_/·•’‘])([\p{L}\p{M}]+)|(jede\/-r|ihm\/r|diese\(r\)|eine\(n\)))(?![\p{L}\p{M}])/giu;'''
              old_following = r'''/^\s+[\p{L}\p{M}’'-]+(?:[:*_/·•.’‘][\p{L}\p{M}]+|In)(?![\p{L}\p{M}])/u;'''
              new_following = r'''/^\s+[\p{L}\p{M}’'-]+(?:[:*_/·•.’‘][\p{L}\p{M}]+|In|\((?:-)?in\))(?![\p{L}\p{M}])/u;'''
              if old_pattern not in text or old_following not in text:
                  raise RuntimeError("Pronomenmuster nicht gefunden")
              text = text.replace(old_pattern, new_pattern, 1)
              text = text.replace(old_following, new_following, 1)
          path.write_text(text, encoding="utf-8")

          # Tests: Klammerformen.
          path = Path("tests/rules/unmarked-singular.test.ts")
          text = path.read_text(encoding="utf-8")
          if '["Nutzer(in)", "Nutzer"]' not in text:
              text = text.replace(
                  '    ["NutzerIn", "Nutzer"],',
                  '    ["Nutzer(in)", "Nutzer"],\n    ["Nutzer(-in)", "Nutzer"],\n    ["NUTZER(-IN)", "NUTZER"],\n    ["NutzerIn", "Nutzer"],',
                  1
              )
          if '"Vielleicht eine Nutzer(in) im Team"' not in text:
              text = text.replace(
                  '    "Vielleicht eine NutzerIn im Team",',
                  '    "Vielleicht eine Nutzer(in) im Team",\n    "Vielleicht jene Nutzer(-in) im Team",\n    "Vielleicht eine NutzerIn im Team",',
                  1
              )
          if '"Hebamme(in)"' not in text:
              text = text.replace(
                  '    "Hebamme:in",',
                  '    "Hebamme(in)",\n    "Hebamme(-in)",\n    "Hebamme:in",',
                  1
              )
          path.write_text(text, encoding="utf-8")

          # Tests: Kaufmann/frau.
          path = Path("tests/rules/mann-frau-shorthand.test.ts")
          text = path.read_text(encoding="utf-8")
          if '["Kaufmann/frau", "Kaufmann"]' not in text:
              text = text.replace(
                  '    ["BANKKAUFMANN/-FRAU", "BANKKAUFMANN"]',
                  '    ["BANKKAUFMANN/-FRAU", "BANKKAUFMANN"],\n    ["Kaufmann/frau", "Kaufmann"],\n    ["KAUFMANN/FRAU", "KAUFMANN"]',
                  1
              )
          if '"Automobilkaufmann/frau"' not in text:
              text = text.replace(
                  '    "Kaufmann/Kauffrau",',
                  '    "Kaufmann/Kauffrau",\n    "Automobilkaufmann/frau",',
                  1
              )
          path.write_text(text, encoding="utf-8")

          # Tests: kompakte Pronomen/Determiner und Schutzfälle.
          path = Path("tests/rules/explicit-pronouns.test.ts")
          text = path.read_text(encoding="utf-8")
          if '["ihm/r", "ihm"]' not in text:
              text = text.replace(
                  '    ["JEDE/-R", "JEDER"]',
                  '    ["JEDE/-R", "JEDER"],\n    ["ihm/r", "ihm"],\n    ["IHM/R", "IHM"],\n    ["diese(r)", "dieser"],\n    ["DIESE(R)", "DIESER"],\n    ["eine(n)", "einen"],\n    ["EINE(N)", "EINEN"]',
                  1
              )
          if '"diese(r) Nutzer:in"' not in text:
              text = text.replace(
                  '    "jede/-r Nutzer:in"',
                  '    "jede/-r Nutzer:in",\n    "ihm/r Nutzer:in",\n    "diese(r) Nutzer:in",\n    "eine(n) Nutzer(in)",\n    "sier",\n    "xier",\n    "hen",\n    "dey"',
                  1
              )
          path.write_text(text, encoding="utf-8")

      - name: Vollständige Prüfung
        run: npm run check

      - name: Temporären Workflow entfernen
        run: rm .github/workflows/temporary-korap-2026-ii.yml

      - name: Änderungen einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/unmarked-singular.ts src/rules/singular-double-forms.ts src/rules/explicit-pronouns.ts tests/rules/unmarked-singular.test.ts tests/rules/mann-frau-shorthand.test.ts tests/rules/explicit-pronouns.test.ts .github/workflows/temporary-korap-2026-ii.yml
          git diff --cached --check
          git commit -m "Regeln: KorAP-2026-II-Kurzformen ergänzen"
          git push
