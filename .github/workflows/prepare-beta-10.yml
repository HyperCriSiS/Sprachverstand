name: Beta 10 vorbereiten

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/prepare-beta-10.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: dev vollständig auschecken
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Version und Release-Dokumente aktualisieren
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = "0.5.5"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replacements = {
              ".github/workflows/ci.yml": [
                  ('BETA="beta.9"', 'BETA="beta.10"'),
                  ('sprachverstand-beta-9-', 'sprachverstand-beta-10-'),
              ],
              ".github/workflows/release.yml": [
                  ('BETA="beta.9"', 'BETA="beta.10"'),
                  ('Beta 9', 'Beta 10'),
              ],
              "docs/BETA-TEST.md": [
                  ('# Sprachverstand 0.5.4 – Beta 9 testen', '# Sprachverstand 0.5.5 – Beta 10 testen'),
                  ('sprachverstand-0.5.4-beta.9-', 'sprachverstand-0.5.5-beta.10-'),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          beta_test = Path("docs/BETA-TEST.md")
          text = beta_test.read_text(encoding="utf-8")
          marker = "Beta 9 bündelt den aktuellen geprüften Stand:"
          if marker in text:
              text = text.replace(
                  marker,
                  "Beta 10 behebt ausschließlich die versehentlich ausgetauschte Logo-Variante. "
                  "README, Browserleiste, Popup und Einstellungen verwenden wieder das ursprüngliche "
                  "gerahmte SV-Monogramm. Der übrige geprüfte Stand entspricht Beta 9.\n\n"
                  "Beta 9 bündelte den aktuellen geprüften Stand:",
                  1,
              )
          beta_test.write_text(text, encoding="utf-8")

          Path("docs/RELEASE-NOTES.md").write_text(
              """# Sprachverstand 0.5.5 – Beta 10

Beta 10 ist ein gezielter Logo-Hotfix für weitere Praxistests.

## Korrigiert

- Das ursprüngliche gerahmte SV-Monogramm aus Beta 7 ist wiederhergestellt.
- Browserleiste, Popup, Einstellungen und README verwenden wieder dieselbe Grafik.
- Die abweichende randlose Variante und die separat eingebettete README-Grafik wurden entfernt.

## Unverändert

Sprachregeln, Einstellungen, Datenschutzverhalten und Browserunterstützung entsprechen Beta 9.

## Pakete

- Chromium-ZIP zur Installation als entpackte Erweiterung
- Firefox-XPI für temporäre Desktop- und Android-Tests
- vollständiges Quellcodearchiv
- SHA-256-Prüfsummen
- Beta-Testanleitung
""",
              encoding="utf-8",
          )

          Path("docs/RELEASE-CHECKLIST.md").write_text(
              """# Release-Checkliste Beta 10

- [x] Ursprüngliches gerahmtes SV-Logo wiederhergestellt
- [x] README und Add-on auf dieselbe Icon-Datei vereinheitlicht
- [x] Versionsnummer auf 0.5.5 erhöht
- [x] Beta-Bezeichnung auf beta.10 aktualisiert
- [x] Release Notes und Testanleitung aktualisiert
- [x] Chromium-, Firefox- und Quellcodepakete vorgesehen
- [x] SHA-256-Prüfsummen und Archivtests vorgesehen
- [x] Automatisierte vollständige Prüfung vor Veröffentlichung
- [ ] Reale Praxistests nach Download des Releases
""",
              encoding="utf-8",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = """## 0.5.5 – Beta 10 (2026-07-28)

### Korrigiert

- Das ursprüngliche gerahmte SV-Monogramm wurde in allen Icon-Größen wiederhergestellt.
- README und Add-on verwenden nun unmittelbar dieselbe Icon-Datei, damit keine abweichende Logo-Variante mehr entstehen kann.
- Die versehentlich eingeführte randlose Variante und die separate eingebettete README-Grafik wurden entfernt.

### Unverändert

- Sprachregeln, Einstellungen und Datenschutzverhalten entsprechen Beta 9.

"""
          text = text.replace("## Unveröffentlicht\n\n", "## Unveröffentlicht\n\n" + entry, 1)
          changelog.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/prepare-beta-10.yml

      - name: Vorbereitung nach dev übertragen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare 0.5.5 beta 10"
          git push origin HEAD:dev
