name: DOM-02 native Mischlast

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: DOM-Mischlast in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Aktuellen Commit auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: aktuell
          persist-credentials: false

      - name: Voroptimierungskommmit auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: aef8584db39cd2b19d5aa30a16b9966de8c61818
          path: baseline
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Identischen Mischlast-Vertrag bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline/benchmarks reports
          cp aktuell/benchmarks/dom-native-mixed-entry.audit.ts baseline/benchmarks/

      - name: Referenzabhängigkeiten installieren
        working-directory: baseline
        run: npm ci --no-audit --no-fund

      - name: Aktuelle Abhängigkeiten installieren
        working-directory: aktuell
        run: npm ci --no-audit --no-fund

      - name: Referenzbrowsercode bündeln
        working-directory: baseline
        run: >-
          npx --no-install esbuild benchmarks/dom-native-mixed-entry.audit.ts
          --bundle --platform=browser --format=iife --target=es2022
          --outfile=../baseline-native.js

      - name: Aktuellen Browsercode bündeln
        working-directory: aktuell
        run: >-
          npx --no-install esbuild benchmarks/dom-native-mixed-entry.audit.ts
          --bundle --platform=browser --format=iife --target=es2022
          --outfile=../current-native.js

      - name: Gleiche Mischlast in echten Browsern ausführen
        run: node aktuell/scripts/dom-native-browser-audit.mjs ${{ matrix.browser }}

      - name: Vertrag prüfen und Rohdaten vergleichen
        shell: bash
        run: |
          node aktuell/scripts/compare-dom-native-mixed-audit.mjs \
            "reports/native-${{ matrix.browser }}-baseline.json" \
            "reports/native-${{ matrix.browser }}-current.json" \
            "reports/dom02-mischlast-${{ matrix.browser }}.md"

      - name: Mischlast-Rohberichte sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dom02-mischlast-${{ matrix.browser }}-${{ github.sha }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
