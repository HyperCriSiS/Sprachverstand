name: Publish Pale Moon 0.7.0 palemoon.5

on:
  push:
    branches:
      - palemoon
    paths:
      - ".github/workflows/publish-palemoon-0.7.0-palemoon.5.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v0.7.0-palemoon.5
      TARGET_SHA: 1baf7c323ad61b042b74af570b923d08dde68998
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release-Commit prüfen und Tag anlegen
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" "$GITHUB_SHA"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            EXISTING_SHA=$(git rev-list -n 1 "$TAG")
            if [[ "$EXISTING_SHA" != "$TARGET_SHA" ]]; then
              echo "Tag ${TAG} existiert bereits auf ${EXISTING_SHA}, erwartet ${TARGET_SHA}."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "Sprachverstand 0.7.0 Pale Moon palemoon.5"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Release-Workflow starten
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref palemoon -f tag="$TAG"
