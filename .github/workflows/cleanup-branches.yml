name: Einmalige Branch-Bereinigung

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Alle Branches außer main und dev löschen
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' |
          while IFS= read -r branch; do
            case "$branch" in
              main|dev)
                echo "Behalte $branch"
                ;;
              *)
                echo "Lösche $branch"
                gh api --method DELETE \
                  "repos/${REPOSITORY}/git/refs/heads/${branch}"
                ;;
            esac
          done
