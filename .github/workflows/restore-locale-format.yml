name: Locale-Format einmalig wiederherstellen

on:
  push:
    branches: [fix/i18n-locale-format-churn]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/i18n-locale-format-churn

      - name: Fünf versehentlich minifizierte Locales formatieren
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const locales = ['de', 'en', 'es', 'fi', 'fil'];
          for (const locale of locales) {
            const path = `static/_locales/${locale}/messages.json`;
            const before = JSON.parse(fs.readFileSync(path, 'utf8'));
            fs.writeFileSync(path, `${JSON.stringify(before, null, 2)}\n`, 'utf8');
            const after = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (JSON.stringify(before) !== JSON.stringify(after)) {
              throw new Error(`${locale}: semantischer Inhalt hat sich beim Formatieren geändert`);
            }
          }
          NODE
          git diff --check

      - name: Einmal-Workflow entfernen und Korrektur committen
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/restore-locale-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/_locales/de/messages.json \
                  static/_locales/en/messages.json \
                  static/_locales/es/messages.json \
                  static/_locales/fi/messages.json \
                  static/_locales/fil/messages.json
          git diff --cached --check
          git commit -m "fix(i18n): ursprüngliche Locale-Formatierung wiederherstellen"
          git push origin HEAD:fix/i18n-locale-format-churn
