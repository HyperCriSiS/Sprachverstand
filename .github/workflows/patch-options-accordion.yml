name: Patch options accordion

on:
  push:
    branches: [feat/options-accordion-order]
    paths:
      - .github/workflows/patch-options-accordion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/options-accordion-order

      - name: Styles, Steuerung und Regressionstests ergänzen
        shell: python
        run: |
          from pathlib import Path

          css_path = Path("static/options/options.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* Einstellungsbereiche */"
          if marker not in css:
              css += r'''

          /* Einstellungsbereiche */
          .settings-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
            padding: 10px 12px;
            border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
            border-radius: 10px;
            background: color-mix(in srgb, currentColor 4%, transparent);
          }

          .settings-toolbar > span {
            font-weight: 700;
          }

          .settings-section {
            display: block;
            border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
            border-radius: 12px;
            overflow: clip;
          }

          .settings-section > summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 56px;
            padding: 14px 18px;
            cursor: pointer;
            list-style: none;
            user-select: none;
          }

          .settings-section > summary::-webkit-details-marker {
            display: none;
          }

          .settings-section > summary::after {
            content: "";
            flex: 0 0 auto;
            width: 9px;
            height: 9px;
            margin-right: 3px;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(45deg) translate(-2px, -2px);
            transition: transform 120ms ease;
          }

          .settings-section[open] > summary::after {
            transform: rotate(225deg) translate(-2px, -2px);
          }

          .settings-section > summary:hover {
            background: color-mix(in srgb, currentColor 5%, transparent);
          }

          .settings-section > summary:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: -3px;
          }

          .settings-section > summary h2 {
            margin: 0;
            font-size: 18px;
          }

          .settings-section-content {
            display: grid;
            gap: 14px;
            padding: 0 18px 18px;
            border-top: 1px solid color-mix(in srgb, currentColor 14%, transparent);
          }

          .settings-section-content > :first-child {
            margin-top: 16px;
          }

          .settings-section-content > p {
            margin-bottom: 0;
          }

          @media (max-width: 600px) {
            .settings-toolbar {
              align-items: stretch;
              flex-direction: column;
            }

            .settings-toolbar .compact-actions {
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .settings-section > summary {
              padding: 13px 14px;
            }

            .settings-section-content {
              padding: 0 14px 14px;
            }
          }
          '''
              css_path.write_text(css, encoding="utf-8")

          options_path = Path("src/options.ts")
          options = options_path.read_text(encoding="utf-8")
          declarations = '''const statusOutput = requiredElement<HTMLOutputElement>("#status");
          const expandAllSectionsButton =
            requiredElement<HTMLButtonElement>("#expand-all-sections");
          const collapseAllSectionsButton =
            requiredElement<HTMLButtonElement>("#collapse-all-sections");
          const settingsSections = [
            ...document.querySelectorAll<HTMLDetailsElement>("details.settings-section")
          ];'''
          options = options.replace(
              'const statusOutput = requiredElement<HTMLOutputElement>("#status");',
              declarations
          )

          helpers = '''function refreshSectionToggleButtons(): void {
            const allOpen = settingsSections.every((section) => section.open);
            const allClosed = settingsSections.every((section) => !section.open);
            expandAllSectionsButton.disabled = allOpen;
            collapseAllSectionsButton.disabled = allClosed;
          }

          function setAllSectionsOpen(open: boolean): void {
            for (const section of settingsSections) {
              section.open = open;
            }
            refreshSectionToggleButtons();
          }

          function createRuleGroupControls(): void {'''
          options = options.replace(
              'function createRuleGroupControls(): void {',
              helpers
          )

          options = options.replace(
              '  createRuleGroupControls();\n  render(await loadSettings());',
              '  createRuleGroupControls();\n  refreshSectionToggleButtons();\n  render(await loadSettings());'
          )

          listeners = '''  expandAllSectionsButton.addEventListener("click", () => {
            setAllSectionsOpen(true);
          });
          collapseAllSectionsButton.addEventListener("click", () => {
            setAllSectionsOpen(false);
          });
          for (const section of settingsSections) {
            section.addEventListener("toggle", refreshSectionToggleButtons);
          }

          '''
          options = options.replace(
              '  selectAllRulesButton.addEventListener("click", () => {',
              listeners + '  selectAllRulesButton.addEventListener("click", () => {'
          )
          options_path.write_text(options, encoding="utf-8")

          tests_path = Path("tests/rules/known-plural-separators.test.ts")
          tests = tests_path.read_text(encoding="utf-8")
          tests = tests.replace(
              '    ["Follower*innen", "Follower"],\n',
              '    ["Follower*innen", "Follower"],\n'
              '    ["Praktiker*innen", "Praktiker"],\n'
              '    ["Mediziner*innen", "Mediziner"],\n'
          )
          tests_path.write_text(tests, encoding="utf-8")

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/options/options.css src/options.ts tests/rules/known-plural-separators.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "ui: add collapsible settings controls"
          git push origin HEAD:feat/options-accordion-order
