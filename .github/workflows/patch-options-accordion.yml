name: Normalize options accordion

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/patch-options-accordion.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Doppelte Patch-Blöcke bereinigen
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/options.ts")
          text = path.read_text(encoding="utf-8")

          declarations = '''const statusOutput = requiredElement<HTMLOutputElement>("#status");
          const expandAllSectionsButton =
            requiredElement<HTMLButtonElement>("#expand-all-sections");
          const collapseAllSectionsButton =
            requiredElement<HTMLButtonElement>("#collapse-all-sections");
          const settingsSections = [
            ...document.querySelectorAll<HTMLDetailsElement>("details.settings-section")
          ];
          '''
          text = re.sub(
              r'const statusOutput = requiredElement<HTMLOutputElement>\("#status"\);.*?(?=\nlet activeTabId)',
              declarations.rstrip(),
              text,
              count=1,
              flags=re.S
          )

          helpers = '''function refreshSectionToggleButtons(): void {
            const allOpen = settingsSections.every((section) => section.open);
            const allClosed = settingsSections.every((section) => !section.open);
            expandAllSectionsButton.disabled = allOpen;
            collapseAllSectionsButton.disabled = allClosed;
          }

          function setAllSectionsOpen(open: boolean): void {
            for (const section of settingsSections) {
              section.open = open;
            }
            refreshSectionToggleButtons();
          }

          '''
          text = re.sub(
              r'function refreshSectionToggleButtons\(\): void \{.*?(?=function createRuleGroupControls)',
              helpers,
              text,
              count=1,
              flags=re.S
          )

          listeners = '''  expandAllSectionsButton.addEventListener("click", () => {
            setAllSectionsOpen(true);
          });
          collapseAllSectionsButton.addEventListener("click", () => {
            setAllSectionsOpen(false);
          });
          for (const section of settingsSections) {
            section.addEventListener("toggle", refreshSectionToggleButtons);
          }

          '''
          text = re.sub(
              r'  expandAllSectionsButton\.addEventListener\("click".*?(?=  selectAllRulesButton)',
              listeners,
              text,
              count=1,
              flags=re.S
          )
          path.write_text(text, encoding="utf-8")

          tests_path = Path("tests/rules/known-plural-separators.test.ts")
          tests = tests_path.read_text(encoding="utf-8")
          tests = re.sub(r'    \["(?:Praktiker|Mediziner)\*innen", "(?:Praktiker|Mediziner)"\],\n', '', tests)
          tests = tests.replace(
              '    ["Follower*innen", "Follower"],\n',
              '    ["Follower*innen", "Follower"],\n'
              '    ["Praktiker*innen", "Praktiker"],\n'
              '    ["Mediziner*innen", "Mediziner"],\n',
              1
          )
          tests_path.write_text(tests, encoding="utf-8")

      - name: Bereinigung committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/options.ts tests/rules/known-plural-separators.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize options accordion patch"
          git push origin HEAD:${{ github.head_ref }}
