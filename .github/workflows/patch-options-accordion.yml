name: Format options accordion

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/patch-options-accordion.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Akkordeon-Code einheitlich formatieren
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/options.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '  ];\nlet activeTabId',
              '  ];\n\nlet activeTabId'
          )
          listeners = (
              '  expandAllSectionsButton.addEventListener("click", () => {\n'
              '    setAllSectionsOpen(true);\n'
              '  });\n'
              '  collapseAllSectionsButton.addEventListener("click", () => {\n'
              '    setAllSectionsOpen(false);\n'
              '  });\n'
              '  for (const section of settingsSections) {\n'
              '    section.addEventListener("toggle", refreshSectionToggleButtons);\n'
              '  }\n\n'
          )
          text = re.sub(
              r'  expandAllSectionsButton\.addEventListener\("click".*?(?=  selectAllRulesButton)',
              listeners,
              text,
              count=1,
              flags=re.S
          )
          path.write_text(text, encoding="utf-8")

      - name: Formatierung committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/options.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format options accordion controls"
          git push origin HEAD:${{ github.head_ref }}
