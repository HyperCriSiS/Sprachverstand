name: Temporäre Locale-Diff-Bereinigung

on:
  push:
    branches:
      - fix/domain-toggle-additional-scope

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          ref: fix/domain-toggle-additional-scope
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Locale-Diff auf semantische Änderungen reduzieren
        shell: bash
        run: |
          git fetch origin main
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          root = Path('static/_locales')
          keys_to_update = [
              'whereCorrect',
              'popupDomainActionTitle',
              'popupDomainActionDescription',
          ]
          keys_to_add = [
              'removeCurrentWebsiteExclusion',
              'removeCurrentWebsiteInclusion',
              'currentWebsiteExcluded',
              'currentWebsiteExclusionRemoved',
              'currentWebsiteIncluded',
              'currentWebsiteInclusionRemoved',
          ]

          translations = {}
          for path in sorted(root.glob('*/messages.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              translations[path.parent.name] = {
                  key: data[key]['message'] for key in keys_to_update + keys_to_add
              }

          subprocess.run(
              ['git', 'checkout', 'origin/main', '--', 'static/_locales'],
              check=True,
          )

          def property_span(text, key):
              token = json.dumps(key, ensure_ascii=False)
              matches = list(re.finditer(re.escape(token) + r'\s*:', text))
              if len(matches) != 1:
                  raise ValueError(f'{key}: Schlüssel nicht eindeutig gefunden ({len(matches)})')

              match = matches[0]
              value_start = match.end()
              while value_start < len(text) and text[value_start].isspace():
                  value_start += 1
              if value_start >= len(text):
                  raise ValueError(f'{key}: Wert fehlt')

              opener = text[value_start]
              pairs = {'{': '}', '[': ']'}
              if opener not in pairs:
                  raise ValueError(f'{key}: Objekt oder Array erwartet')

              stack = [pairs[opener]]
              in_string = False
              escaped = False
              index = value_start + 1
              while index < len(text) and stack:
                  char = text[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          in_string = False
                  else:
                      if char == '"':
                          in_string = True
                      elif char in pairs:
                          stack.append(pairs[char])
                      elif char == stack[-1]:
                          stack.pop()
                  index += 1

              if stack:
                  raise ValueError(f'{key}: Wert ist nicht abgeschlossen')
              return match.start(), index

          def replace_message(text, key, value):
              start, end = property_span(text, key)
              block = text[start:end]
              pattern = re.compile(r'("message"\s*:\s*)"(?:\\.|[^"\\])*"')
              matches = list(pattern.finditer(block))
              if len(matches) != 1:
                  raise ValueError(f'{key}: message nicht eindeutig gefunden ({len(matches)})')
              match = matches[0]
              encoded = json.dumps(value, ensure_ascii=False)
              block = block[:match.start(0)] + match.group(1) + encoded + block[match.end(0):]
              return text[:start] + block + text[end:]

          def remove_property(text, key):
              start, end = property_span(text, key)
              line_start = text.rfind('\n', 0, start) + 1
              if text[line_start:start].strip() == '':
                  start = line_start

              cursor = end
              while cursor < len(text) and text[cursor] in ' \t':
                  cursor += 1
              if cursor < len(text) and text[cursor] == ',':
                  cursor += 1
                  if cursor < len(text) and text[cursor] == '\r':
                      cursor += 1
                  if cursor < len(text) and text[cursor] == '\n':
                      cursor += 1
                  return text[:start] + text[cursor:]

              cursor = start - 1
              while cursor >= 0 and text[cursor] in ' \t\r\n':
                  cursor -= 1
              if cursor >= 0 and text[cursor] == ',':
                  return text[:cursor] + text[end:]
              raise ValueError(f'{key}: trennendes Komma nicht gefunden')

          def insert_before(text, marker_key, entries):
              marker_start, _ = property_span(text, marker_key)
              line_start = text.rfind('\n', 0, marker_start) + 1
              pretty = '\n' in text and text[line_start:marker_start].strip() == ''

              if pretty:
                  indent = text[line_start:marker_start]
                  child_indent = indent + '  '
                  additions = ''.join(
                      f'{indent}{json.dumps(key)}: {{\n'
                      f'{child_indent}"message": {json.dumps(value, ensure_ascii=False)}\n'
                      f'{indent}}},\n'
                      for key, value in entries
                  )
                  return text[:line_start] + additions + text[line_start:]

              additions = ''.join(
                  f'{json.dumps(key)}:{{"message":{json.dumps(value, ensure_ascii=False)}}},'
                  for key, value in entries
              )
              return text[:marker_start] + additions + text[marker_start:]

          locale_paths = sorted(root.glob('*/messages.json'))
          for path in locale_paths:
              code = path.parent.name
              values = translations[code]
              text = path.read_text(encoding='utf-8')

              for key in keys_to_update:
                  text = replace_message(text, key, values[key])

              text = remove_property(text, 'currentWebsiteAlreadyInDomainList')
              text = insert_before(
                  text,
                  'includeCurrentWebsite',
                  [(key, values[key]) for key in keys_to_add],
              )

              parsed = json.loads(text)
              if len(parsed) != 170:
                  raise SystemExit(
                      f'{code}: erwartet 170 Nachrichten, gefunden {len(parsed)}'
                  )
              expected = set(json.loads(
                  Path('static/_locales/de/messages.json').read_text(encoding='utf-8')
              )) if code != 'de' and Path('static/_locales/de/messages.json').exists() else set(parsed)
              if code != 'de' and set(parsed) != expected:
                  missing = sorted(expected - set(parsed))
                  extra = sorted(set(parsed) - expected)
                  raise SystemExit(f'{code}: abweichende Keys; fehlen={missing}, zusätzlich={extra}')

              path.write_text(text, encoding='utf-8')

          print(f'{len(locale_paths)} Locales formatgetreu aktualisiert.')
          PY

      - name: Temporären Workflow entfernen
        run: rm .github/workflows/tmp-clean-locale-diff.yml

      - name: Locale-Validierung ausführen
        run: npm run validate:locales

      - name: Diff-Größe kontrollieren
        shell: bash
        run: |
          git diff --stat origin/main -- static/_locales
          additions=$(git diff --numstat origin/main -- static/_locales | awk '{sum += $1} END {print sum+0}')
          if [ "$additions" -gt 1000 ]; then
            echo "Locale-Diff ist mit $additions neuen Zeilen weiterhin zu groß." >&2
            exit 1
          fi
          echo "Locale-Diff enthält $additions neue Zeilen."

      - name: Bereinigung committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: Locale-Diff auf echte Änderungen reduzieren"
          git push origin HEAD:fix/domain-toggle-additional-scope
