name: AMO-Listing-Konsolidierung anwenden

on:
  push:
    branches:
      - store/amo-listing-consolidation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Geprüfte AMO-Quelltexte aus dev übernehmen
        shell: bash
        run: |
          git fetch origin dev:refs/remotes/origin/dev
          git checkout origin/dev -- store/amo-listings

      - name: Dokumentation, Skripte und Tests an aktuelle Architektur anpassen
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch-amo.py
          python3 /tmp/patch-amo.py
          node --check scripts/generate-store-metadata.mjs
          node --check scripts/amo-api-v5.mjs

      - name: Gezielte Store-Prüfungen ausführen
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run validate:store-exports
          npm run test -- tests/store-release-automation.test.ts

      - name: Einmaligen Konsolidierungsworkflow entfernen
        run: git rm .github/workflows/apply-amo-listing-consolidation.yml

      - name: Konsolidierung committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/amo-listings package.json ROADMAP.md docs/AMO-SOURCE-INSTRUCTIONS.md docs/STORE-EXPORTS.md tests/store-release-automation.test.ts scripts/generate-store-metadata.mjs scripts/amo-api-v5.mjs
          git commit -m "store: AMO-Listing-Lokalisierungen auf main konsolidieren"
          git push
