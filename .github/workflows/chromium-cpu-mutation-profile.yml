name: Chromium-CPU-Mutationsprofil

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Gepaarte Chromium-CPU-Profile (1–3)"
        type: choice
        options: ["1", "2", "3"]
        default: "1"
        required: true

permissions:
  contents: read

jobs:
  chromium-cpu:
    name: Echtes Chromium-V8-Sampling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Chromium-Erweiterung erstellen
        run: npm run build:chromium
      - name: CPU-Profil der gepaarten DOM-Last aufzeichnen
        env:
          PAIRS: ${{ inputs.pairs }}
        run: >
          node scripts/chromium-cpu-mutation-profile.mjs
          --pairs "$PAIRS"
          --output-dir artifacts/chromium-cpu
      - name: Rohprofile und Bericht sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium-cpu-${{ github.sha }}
          path: artifacts/chromium-cpu/
          if-no-files-found: warn
          retention-days: 14
