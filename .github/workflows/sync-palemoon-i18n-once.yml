name: Pale-Moon-i18n-Parität einmalig synchronisieren

on:
  push:
    branches: [sync/palemoon-i18n-ui-149]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: sync/palemoon-i18n-ui-149
          fetch-depth: 0

      - name: Gemeinsame i18n- und UI-Dateien aus main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- src/options.ts static/_locales static/options/options.html tests/i18n-ui-guard.test.ts
          git rm -f static/options/domain-ui.js
          git rm -f legacy/palemoon/palemoon/domain-ui.js

      - name: Pale-Moon-Build und CI auf die neue UI-Struktur anpassen
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const buildPath = 'scripts/build.mjs';
          let build = fs.readFileSync(buildPath, 'utf8');
          const oldBuild = `    cp(\n      path.join(legacyDirectory, "palemoon", "i18n-bootstrap.js"),\n      path.join(paleMoonRuntimeDirectory, "i18n-bootstrap.js")\n    ),\n    cp(\n      path.join(legacyDirectory, "palemoon", "domain-ui.js"),\n      path.join(outputDirectory, "options", "domain-ui.js")\n    )`;
          const newBuild = `    cp(\n      path.join(legacyDirectory, "palemoon", "i18n-bootstrap.js"),\n      path.join(paleMoonRuntimeDirectory, "i18n-bootstrap.js")\n    )`;
          if (!build.includes(oldBuild)) throw new Error('Erwarteter domain-ui.js-Buildblock fehlt');
          build = build.replace(oldBuild, newBuild);
          fs.writeFileSync(buildPath, build, 'utf8');

          const ciPath = '.github/workflows/ci.yml';
          let ci = fs.readFileSync(ciPath, 'utf8');
          const obsoleteFragments = [
            'test -s legacy/palemoon/palemoon/domain-ui.js',
            'test -s static/options/domain-ui.js',
            'test -s dist/palemoon/options/domain-ui.js',
            "! grep -q 'globalThis' dist/palemoon/options/domain-ui.js",
            "! grep -Fq '?.' dist/palemoon/options/domain-ui.js"
          ];
          const lines = ci.split('\n');
          for (const fragment of obsoleteFragments) {
            if (!lines.some((line) => line.includes(fragment))) {
              throw new Error(`Erwartete veraltete CI-Prüfung fehlt: ${fragment}`);
            }
          }
          ci = lines.filter((line) => !obsoleteFragments.some((fragment) => line.includes(fragment))).join('\n');
          fs.writeFileSync(ciPath, ci, 'utf8');
          NODE

      - name: Einmal-Workflow entfernen und Sync committen
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/sync-palemoon-i18n-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sync(palemoon): i18n- und UI-Parität aus main übernehmen"
          git push origin HEAD:sync/palemoon-i18n-ui-149
