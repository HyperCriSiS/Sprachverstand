name: Temporäre Lexikon-Ausbauwelle 10 anwenden

on:
  push:
    branches:
      - feat/lexicon-expansion-wave-10
    paths:
      - .github/workflows/tmp-apply-lexicon-wave-10.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Arbeitszweig auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/lexicon-expansion-wave-10
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Weitere unveränderte Personenformen ergänzen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          known_path = Path("src/rules/known-plural-separators.ts")
          known = known_path.read_text(encoding="utf-8")
          start_marker = "const safePluralSuffixes = [\n"
          end_marker = "\n] as const;"
          start = known.index(start_marker) + len(start_marker)
          end = known.index(end_marker, start)
          body = known[start:end]
          additions = [
              "beschließer",
              "steinbehauer",
              "listbroker",
              "stepper",
              "schausteller",
              "kaffeeröster",
              "scherer",
              "biersieder",
              "kanalsteurer",
              "hafenschiffer",
              "goldschläger",
              "fasser",
              "skipper",
              "sattler",
              "optiker",
              "müller",
              "feldwebel",
              "geomatiker",
              "schützer",
              "klavierstimmer",
              "wachszieher",
              "tätowierer",
              "drechsler",
              "gürtler",
              "wildheger",
              "funker",
              "kutscher",
              "bildhauer",
              "kürschner",
          ]

          missing = [suffix for suffix in additions if f'"{suffix}"' not in body]
          if missing:
              lines = body.splitlines()
              last = max(index for index, line in enumerate(lines) if line.strip())
              if not lines[last].rstrip().endswith(","):
                  lines[last] = lines[last].rstrip() + ","
              for index, suffix in enumerate(missing):
                  comma = "," if index < len(missing) - 1 else ""
                  lines.append(f'  "{suffix}"{comma}')
              known = known[:start] + "\n".join(lines) + known[end:]
              known_path.write_text(known, encoding="utf-8")

          test_path = Path("tests/lexicon-expansion-wave-10.test.ts")
          test_path.write_text(
              '''import { describe, expect, it } from "vitest";
          import {
            knownPluralSeparatorsRule,
            mapKnownSingular
          } from "../src/rules/known-plural-separators";

          describe("zehnte konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Beschließer:innen", "Beschließer"],
              ["Steinbehauer:innen", "Steinbehauer"],
              ["Listbroker:innen", "Listbroker"],
              ["Schuh- und Lederwarenstepper:innen", "Schuh- und Lederwarenstepper"],
              ["Schausteller:innen", "Schausteller"],
              ["Kaffeeröster:innen", "Kaffeeröster"],
              ["Scherer:innen", "Scherer"],
              ["Biersieder:innen", "Biersieder"],
              ["Kanalsteurer:innen", "Kanalsteurer"],
              ["Hafenschiffer:innen", "Hafenschiffer"],
              ["Goldschläger:innen", "Goldschläger"],
              ["Edelsteinfasser:innen", "Edelsteinfasser"],
              ["Skipper:innen", "Skipper"],
              ["Sattler:innen", "Sattler"],
              ["Feinoptiker:innen", "Feinoptiker"],
              ["Müller:innen", "Müller"],
              ["Feldwebel:innen", "Feldwebel"],
              ["Geomatiker:innen", "Geomatiker"],
              ["Holz- und Bautenschützer:innen", "Holz- und Bautenschützer"],
              ["Klavierstimmer:innen", "Klavierstimmer"],
              ["Wachszieher:innen", "Wachszieher"],
              ["Tätowierer:innen", "Tätowierer"],
              ["Drechsler:innen", "Drechsler"],
              ["Gürtler:innen", "Gürtler"],
              ["Wildheger:innen", "Wildheger"],
              ["Funker:innen", "Funker"],
              ["Kutscher:innen", "Kutscher"],
              ["Steinbildhauer:innen", "Steinbildhauer"],
              ["Kürschner:innen", "Kürschner"]
            ])("deckt eine bestätigte unveränderte Personenform ab: %s", (input, expected) => {
              expect(knownPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              ["Beschließer", "Beschließers"],
              ["Listbroker", "Listbrokers"],
              ["Stepper", "Steppers"],
              ["Schausteller", "Schaustellers"],
              ["Edelsteinfasser", "Edelsteinfassers"],
              ["Skipper", "Skippers"],
              ["Feldwebel", "Feldwebels"],
              ["Geomatiker", "Geomatikers"],
              ["Klavierstimmer", "Klavierstimmers"],
              ["Tätowierer", "Tätowierers"],
              ["Gürtler", "Gürtlers"],
              ["Kürschner", "Kürschners"]
            ])("stellt die sichere Genitivform bereit: %s", (base, expected) => {
              expect(mapKnownSingular(base, "genitive")).toBe(expected);
            });

            it.each([
              "Gardemanger:innen",
              "Portier:innen",
              "Nachtportier:innen",
              "Poissonnier:innen",
              "Prior:innen",
              "Diakon:innen",
              "Fass:innen",
              "Schutz:innen"
            ])("lässt abweichende oder nicht freigegebene Formen unverändert: %s", (input) => {
              expect(knownPluralSeparatorsRule.apply(input)).toEqual({
                text: input,
                replacements: 0
              });
            });
          });
          ''',
              encoding="utf-8",
          )
          PY

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Neue Regressionen gezielt prüfen
        run: npx vitest run tests/lexicon-expansion-wave-10.test.ts

      - name: Vollständige Projektprüfung ausführen
        run: npm run check

      - name: Temporären Workflow entfernen und Änderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-apply-lexicon-wave-10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: zehnte konservative Lexikonwelle ergänzen"
          git push origin HEAD:feat/lexicon-expansion-wave-10
