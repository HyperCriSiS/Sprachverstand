name: Temporärer Pale-Moon-Paritätssync

on:
  push:
    branches:
      - sync/palemoon-domain-toggle-154

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          ref: sync/palemoon-domain-toggle-154
          fetch-depth: 0

      - name: Aktuellen Main-Stand laden
        run: git fetch origin main palemoon

      - name: Gemeinsame Paritätspfade aus main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            src/core \
            src/i18n.ts \
            src/options.ts \
            src/popup.ts \
            src/rules \
            src/settings \
            static/_locales \
            static/i18n-bootstrap.js \
            static/legal \
            static/options \
            static/popup \
            tests/options-layout.test.ts \
            tests/popup-layout.test.ts \
            tests/settings.test.ts \
            tests/rules/mapped-plural-separators.test.ts

      - name: Pale-Moon-i18n-Sollstand auf 170 Keys anheben
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'toHaveLength(165)' tests/palemoon-i18n.test.ts)" -eq 1
          sed -i 's/toHaveLength(165)/toHaveLength(170)/' tests/palemoon-i18n.test.ts
          grep -q 'toHaveLength(170)' tests/palemoon-i18n.test.ts

      - name: Pale-Moon-spezifische Dateien auf Unverändertheit prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/palemoon -- legacy/palemoon
          git diff --exit-code origin/palemoon -- package.json package-lock.json scripts/build.mjs manifests

      - name: Gemeinsame Pfade gegen main prüfen
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- \
            src/core \
            src/i18n.ts \
            src/options.ts \
            src/popup.ts \
            src/rules \
            src/settings \
            static/_locales \
            static/i18n-bootstrap.js \
            static/legal \
            static/options \
            static/popup

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Gesamte Testsuite ausführen
        run: npm run test

      - name: Pale-Moon-Build erstellen
        run: npm run build:palemoon

      - name: Wesentliche Pale-Moon-Artefakte prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/palemoon/install.rdf
          test -s dist/palemoon/palemoon/legacy-api.js
          test -s dist/palemoon/palemoon/parity-api.js
          test -s dist/palemoon/palemoon/i18n-bootstrap.js
          test -s dist/palemoon/_locales/de/messages.json
          test -s dist/palemoon/_locales/en/messages.json
          ! grep -q 'globalThis' dist/palemoon/palemoon/i18n-bootstrap.js
          ! grep -Fq '?.' dist/palemoon/palemoon/i18n-bootstrap.js

      - name: Temporären Workflow entfernen
        run: rm .github/workflows/tmp-sync-palemoon-154.yml

      - name: Geprüften Sync committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync(palemoon): Domain-Toggle und Main-Parität übernehmen"
          git push origin HEAD:sync/palemoon-domain-toggle-154
