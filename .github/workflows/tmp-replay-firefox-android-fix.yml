name: Geprüften Firefox-Android-Fix auf PR-Branch routen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bereits geprüfte Transformation wiederverwenden
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/tmp-fix-firefox-android-state.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == '- name: Fixes anwenden')
          run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(source)) if source[i].startswith('      - name: Vollständige Prüfung'))
          body = source[run_line + 1:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body) + '\n'
          Path('/tmp/replay-fix.sh').write_text(script)
          PY
          bash /tmp/replay-fix.sh

      - name: Vollständige Prüfung
        run: npm run check

      - name: PR-Branch erzeugen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/browser/api.ts src/browser/options.ts src/popup.ts src/background.ts \
            tests/browser-options.test.ts tests/options-count-context.test.ts \
            package.json package-lock.json manifests/*.json
          git diff --cached --check
          git commit -m "fix: Firefox-Android-Popupzustand dauerhaft stabilisieren"
          git push --force origin HEAD:refs/heads/fix/firefox-android-state
