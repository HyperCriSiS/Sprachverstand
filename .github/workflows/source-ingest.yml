name: Temporärer Workflow-Restore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiederherstellen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: lexicon/kldb-current-wave-56-v2
          fetch-depth: 0

      - name: Main-Referenz laden
        run: git fetch origin main

      - name: Source-Ingest auf Main-Stand zurücksetzen
        run: git checkout origin/main -- .github/workflows/source-ingest.yml

      - name: Wiederherstellung committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/source-ingest.yml
          git commit -m "ci: temporären Workflow zurücksetzen"
          git push origin HEAD:lexicon/kldb-current-wave-56-v2
