name: Quellenimport

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Private Quelle importieren"
        required: true
        default: "kldb-snapshot"
        type: choice
        options:
          - kldb-snapshot
          - kldb-current
          - esco-api
          - wiktionary-flexion
          - wikidata-occupations

permissions:
  contents: read

concurrency:
  group: sprachverstand-private-source-ingest
  cancel-in-progress: false

env:
  CI: true
  DATASTORE_REPOSITORY: HyperCriSiS/Generic-Datastore

jobs:
  import:
    name: Private Quelle über öffentlichen Runner importieren
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Sprachverstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten und npm-Cache laden
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Produktabhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Datastore-Zugriff prüfen
        env:
          DATASTORE_TOKEN: ${{ secrets.GENERIC_DATASTORE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATASTORE_TOKEN" ]]; then
            echo "Das Actions-Secret GENERIC_DATASTORE_TOKEN fehlt."
            echo "Benötigt wird ein fein begrenztes Token mit Contents: Read and write ausschließlich für HyperCriSiS/Generic-Datastore."
            exit 1
          fi

      - name: Privaten Datastore auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.DATASTORE_REPOSITORY }}
          ref: main
          path: datastore
          token: ${{ secrets.GENERIC_DATASTORE_TOKEN }}
          persist-credentials: true

      - name: Private Python-Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r datastore/sprachverstand/requirements.txt

      - name: Private Importtests ausführen
        run: python -m pytest -q datastore/sprachverstand/tests

      - name: Private Quell-URL in Logs maskieren
        env:
          SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="$(
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          ids = {
              "kldb-snapshot": "ba-kldb-2026",
              "kldb-current": "ba-dkz-current",
              "esco-api": "esco-de",
              "wiktionary-flexion": "dewiktionary-wiktextract",
              "wikidata-occupations": "wikidata-occupations",
          }
          source = os.environ["SOURCE"]
          source_id = ids[source]
          registry = json.loads(
              Path("datastore/sprachverstand/sources/registry.json").read_text(
                  encoding="utf-8"
              )
          )
          for entry in registry["sources"]:
              if entry.get("id") != source_id:
                  continue
              source_url = entry.get("sourceFileUrl") or entry.get("url")
              if not source_url:
                  raise SystemExit(
                      f"Quelle {source_id} enthält weder sourceFileUrl noch url."
                  )
              print(source_url, end="")
              break
          else:
              raise SystemExit(f"Quelle {source_id} fehlt in der privaten Registry.")
          PY
          )"
          if [[ -z "$SOURCE_URL" ]]; then
            echo "Die private Registry enthält keine Quell-URL."
            exit 1
          fi
          echo "::add-mask::$SOURCE_URL"

      - name: KldB/DKZ importieren und Coverage berechnen
        if: inputs.source == 'kldb-snapshot' || inputs.source == 'kldb-current'
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          python datastore/sprachverstand/scripts/run_kldb_ingest.py \
            --source "$SOURCE" \
            --product-dir "$GITHUB_WORKSPACE"

      - name: ESCO über offizielle API importieren und Coverage berechnen
        if: inputs.source == 'esco-api'
        shell: bash
        run: |
          set -euo pipefail

          NORMALIZED="datastore/sprachverstand/normalized/esco-api-v1.2.0.txt"
          PAIRS="datastore/sprachverstand/derived/candidates/esco-api-v1.2.0-pairs.json"
          COVERAGE_INPUT="datastore/sprachverstand/derived/candidates/esco-api-v1.2.0-coverage-input.json"
          COVERAGE="datastore/sprachverstand/derived/candidates/esco-api-v1.2.0-coverage.json"
          UNKNOWN="datastore/sprachverstand/derived/candidates/esco-api-v1.2.0-unknown.txt"
          MANIFEST="datastore/sprachverstand/derived/manifests/esco-api-v1.2.0.json"
          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRIVATE_COMMIT="$(git -C datastore rev-parse HEAD)"

          python datastore/sprachverstand/scripts/fetch_esco_api.py "$NORMALIZED"

          node scripts/lexicon-candidates.mjs "$NORMALIZED" --output "$PAIRS"

          python datastore/sprachverstand/scripts/prepare_pair_coverage.py \
            "$PAIRS" \
            "$COVERAGE_INPUT" \
            --product-commit "$PRODUCT_COMMIT"

          node scripts/lexicon-coverage.mjs \
            "$COVERAGE_INPUT" \
            --output "$COVERAGE"

          python datastore/sprachverstand/scripts/prepare_unknown_candidates.py \
            "$COVERAGE" \
            "$UNKNOWN"

          python datastore/sprachverstand/scripts/record_ingestion.py \
            --source-id esco-de \
            --input "$NORMALIZED" \
            --output "$PAIRS" \
            --output "$COVERAGE_INPUT" \
            --output "$COVERAGE" \
            --output "$UNKNOWN" \
            --command "fetch_esco_api.py v1.2.0 + Kandidaten/Coverage" \
            --normalizer-version "$PRIVATE_COMMIT" \
            --manifest "$MANIFEST"

      - name: Wiktionary-Flexionen importieren und gegen KldB prüfen
        if: inputs.source == 'wiktionary-flexion'
        shell: bash
        run: |
          set -euo pipefail

          DUMP="$RUNNER_TEMP/dewiktionary-2026-09-01.jsonl.gz"
          FLEXION_DIR="datastore/sprachverstand/derived/flexion/dewiktionary-2026-09-01"
          INDEX="$FLEXION_DIR/index.json"
          SUMMARY="$FLEXION_DIR/summary.json"
          VERIFY="datastore/sprachverstand/derived/review/wiktionary-kldb-current-flexion.json"
          MANIFEST="datastore/sprachverstand/derived/manifests/dewiktionary-2026-09-01.json"
          PRIVATE_COMMIT="$(git -C datastore rev-parse HEAD)"

          SOURCE_URL="$(
            python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(
              Path("datastore/sprachverstand/sources/registry.json").read_text(
                  encoding="utf-8"
              )
          )
          for entry in registry["sources"]:
              if entry.get("id") == "dewiktionary-wiktextract":
                  print(entry["sourceFileUrl"], end="")
                  break
          else:
              raise SystemExit("Wiktionary-Quelle fehlt in der privaten Registry.")
          PY
          )"

          rm -rf "$FLEXION_DIR"
          mkdir -p "$FLEXION_DIR" "$(dirname "$VERIFY")" "$(dirname "$MANIFEST")"

          curl \
            --fail \
            --location \
            --retry 4 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1200 \
            "$SOURCE_URL" \
            --output "$DUMP"

          python datastore/sprachverstand/scripts/normalize_wiktextract.py \
            "$DUMP" \
            "$FLEXION_DIR"

          python - "$FLEXION_DIR" "$INDEX" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          files = []
          for path in sorted(root.glob("flexion-*.json")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append(
                  {
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": digest,
                  }
              )

          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          payload = {
              "version": 1,
              "sourceId": "dewiktionary-wiktextract",
              "dump": "2026-09-01",
              "summary": summary,
              "blocks": files,
          }
          output.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "blocks": len(files),
                      **summary,
                  },
                  ensure_ascii=False,
              )
          )
          PY

          node scripts/lexicon-verify-flexion.mjs \
            datastore/sprachverstand/derived/candidates/kldb-current-pairs.json \
            "$FLEXION_DIR" \
            --output "$VERIFY"

          python datastore/sprachverstand/scripts/record_ingestion.py \
            --source-id dewiktionary-wiktextract \
            --input "$DUMP" \
            --output "$INDEX" \
            --output "$SUMMARY" \
            --output "$VERIFY" \
            --command "normalize_wiktextract.py + lexicon-verify-flexion.mjs" \
            --normalizer-version "$PRIVATE_COMMIT" \
            --manifest "$MANIFEST"

      - name: Wikidata-Berufe importieren und Coverage berechnen
        if: inputs.source == 'wikidata-occupations'
        shell: bash
        run: |
          set -euo pipefail

          NORMALIZED="datastore/sprachverstand/normalized/wikidata-occupations-de.txt"
          SUMMARY="datastore/sprachverstand/derived/candidates/wikidata-occupations-summary.json"
          PAIRS="datastore/sprachverstand/derived/candidates/wikidata-occupations-pairs.json"
          COVERAGE_INPUT="datastore/sprachverstand/derived/candidates/wikidata-occupations-coverage-input.json"
          COVERAGE="datastore/sprachverstand/derived/candidates/wikidata-occupations-coverage.json"
          UNKNOWN="datastore/sprachverstand/derived/candidates/wikidata-occupations-unknown.txt"
          MANIFEST="datastore/sprachverstand/derived/manifests/wikidata-occupations.json"
          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRIVATE_COMMIT="$(git -C datastore rev-parse HEAD)"

          python datastore/sprachverstand/scripts/fetch_wikidata_occupations.py \
            "$NORMALIZED" \
            --summary "$SUMMARY"

          node scripts/lexicon-candidates.mjs \
            "$NORMALIZED" \
            --output "$PAIRS"

          python datastore/sprachverstand/scripts/prepare_pair_coverage.py \
            "$PAIRS" \
            "$COVERAGE_INPUT" \
            --product-commit "$PRODUCT_COMMIT"

          node scripts/lexicon-coverage.mjs \
            "$COVERAGE_INPUT" \
            --output "$COVERAGE"

          python datastore/sprachverstand/scripts/prepare_unknown_candidates.py \
            "$COVERAGE" \
            "$UNKNOWN"

          python datastore/sprachverstand/scripts/record_ingestion.py \
            --source-id wikidata-occupations \
            --input "$NORMALIZED" \
            --output "$SUMMARY" \
            --output "$PAIRS" \
            --output "$COVERAGE_INPUT" \
            --output "$COVERAGE" \
            --output "$UNKNOWN" \
            --command "fetch_wikidata_occupations.py + Kandidaten/Coverage" \
            --normalizer-version "$PRIVATE_COMMIT" \
            --manifest "$MANIFEST"

      - name: Änderungen auf erlaubte private Pfade begrenzen
        shell: bash
        run: |
          set -euo pipefail
          cd datastore
          mapfile -t CHANGED < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          if (( ${#CHANGED[@]} == 0 )); then
            echo "Der Import hat keine privaten Dateien geändert."
            exit 0
          fi

          for path in "${CHANGED[@]}"; do
            case "$path" in
              sprachverstand/raw/*|sprachverstand/normalized/*|sprachverstand/derived/*)
                ;;
              *)
                echo "Unerwartete Änderung außerhalb der erlaubten privaten Importpfade: $path"
                exit 1
                ;;
            esac
          done

          printf 'Geänderte private Importdateien:\n'
          printf ' - %s\n' "${CHANGED[@]}"

      - name: Private Importdaten festschreiben
        env:
          SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          cd datastore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprachverstand/raw sprachverstand/normalized sprachverstand/derived

          if git diff --cached --quiet; then
            echo "Keine Änderungen am privaten Quellenbestand."
            exit 0
          fi

          git commit -m "data: private Quelle $SOURCE aktualisieren"
          git push origin HEAD:main