name: Temporärer Welle-56-Patcher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anwenden:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: lexicon/kldb-current-wave-56-v2
          fetch-depth: 0

      - name: Main-Referenz laden
        run: git fetch origin main

      - name: Welle 56 anwenden
        run: python scripts/tmp-apply-wave56.py

      - name: Temporären Workflow zurücksetzen
        run: git checkout origin/main -- .github/workflows/source-ingest.yml

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lexikon: sechsundfünfzigste konservative Ausbauwelle"
          git push origin HEAD:lexicon/kldb-current-wave-56-v2
