name: Synthetic video failure upload path control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failure_path:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        fixture: [valid, reject-second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Existing synthetic unit fixture
        run: node scripts/prepare-video-upload-control.mjs ${{ matrix.fixture }}
      - name: Intentional failure solely to validate workflow failure conditions
        id: chromium_video
        run: exit 1
      - name: Synthetische Videofehlerwerte filtern
        id: video_diagnostic
        if: ${{ failure() && steps.chromium_video.outcome == 'failure' }}
        run: node scripts/sanitize-video-failure.mjs

      - name: Ausschließlich gefilterte Videofehlerwerte sichern
        if: ${{ failure() && steps.video_diagnostic.outcome == 'success' && steps.video_diagnostic.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failure-upload-control-${{ github.sha }}
          path: |
            artifacts/video-playback/sanitized-video-failure-1.json
            artifacts/video-playback/sanitized-video-failure-2.json
          if-no-files-found: error
          retention-days: 7

