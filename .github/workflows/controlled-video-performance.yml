name: Systembrowser-Dateicache-Voraussetzungen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Syntax pruefen
        run: node --check scripts/system-cache-preflight.mjs
      - name: Eigenen Systembrowser und Dateivoraussetzungen pruefen
        run: node scripts/system-cache-preflight.mjs
      - name: Ausschliesslich festes Metadatenschema pruefen
        run: node scripts/validate-system-cache-preflight.mjs
      - name: Gepruefte Voraussetzungen sichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: system-cache-preflight-${{ github.sha }}
          path: artifacts/system-cache-preflight/summary.json
          if-no-files-found: error
          retention-days: 7
