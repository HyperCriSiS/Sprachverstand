name: Isolierte 30-FPS-Seitentextkontrolle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video30-page-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  video30:
    name: 30 FPS (${{ matrix.control }}, ${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        control: [literal, product]
        order: [baseline-first, extension-first]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Datenfilter prüfen
        run: node --test scripts/test-sanitize-video30-pair.mjs
      - name: Exakten CI-Produktstand bauen
        run: npm run build:chromium
      - name: Drei vorab festgelegte Paare prüfen
        env:
          VIDEO_CONTROL_KIND: ${{ matrix.control }}
          VIDEO_PAIR_ORDER: ${{ matrix.order }}
        run: |
          failed=0
          for pair in 1 2 3; do
            VIDEO_ARTIFACTS_DIR="artifacts/video30-control/pair-${pair}" node scripts/video30-page-control.mjs --fps 30 --diagnose-main-tasks --focused-start || failed=1
          done
          exit "$failed"
      - name: Ausschließlich synthetische Frame-Messwerte filtern
        id: export
        if: ${{ always() }}
        run: node scripts/sanitize-video30-pair.mjs artifacts/video30-control
      - name: Gefilterte Messwerte sichern
        if: ${{ always() && steps.export.outcome == 'success' && steps.export.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: video30-control-${{ matrix.control }}-${{ matrix.order }}-${{ github.sha }}
          path: |
            artifacts/video30-control/pair-1/sanitized-video30-pair.json
            artifacts/video30-control/pair-2/sanitized-video30-pair.json
            artifacts/video30-control/pair-3/sanitized-video30-pair.json
          if-no-files-found: error
          retention-days: 7
