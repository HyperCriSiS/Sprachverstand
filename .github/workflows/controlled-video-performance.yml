name: Kontrollierte 60-FPS-Videodiagnose

on:
  workflow_dispatch:
    inputs:
      long_session:
        description: Drei Minuten aktive Untertitel ohne zusätzliche DOM-Last gegen Baseline prüfen
        type: boolean
        default: false
      browser_trace:
        description: Frühen Videostart und Entfernungen mit Browsertrace diagnostizieren (beeinflusst Laufzeiten)
        type: boolean
        default: false
      main_task_diagnostics:
        description: Frühen Videostart mit passiven Long-Task- und Sichtbarkeitsdaten prüfen
        type: boolean
        default: false
      render_scheduling_diagnostics:
        description: Task-/Animations-/Videofortschritt getrennt erfassen (beeinflusst Rendering)
        type: boolean
        default: false
      dom_phase_diagnostics:
        description: Isolierten Diagnosebuild mit begrenzten DOM-Methodenzeiten verwenden
        type: boolean
        default: false
      dom_phase_pairs:
        description: Getrennte Browserpaare für DOM-Phasen, passive Produktionsmessung oder Videotrace (alle Rohdaten behalten)
        type: choice
        options: ["1", "3", "5"]
        default: "1"
      v8_engine_control:
        description: V8-Gegenprobe ohne parallele Optimierung (nur mit Trace; keine Freigabemessung)
        type: boolean
        default: false
      video_pair_order:
        description: Messreihenfolge als Gegenprobe für native Zeit-/Reihenfolgeeffekte (Grenzen unverändert)
        type: choice
        options: ["baseline-first", "extension-first"]
        default: "baseline-first"

permissions:
  contents: read

concurrency:
  group: video60-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video60:
    name: Lokales Chromium 60 FPS mit Untertiteln
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIDEO_PAIR_ORDER: ${{ inputs.video_pair_order || 'baseline-first' }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lokale Video-Encoder installieren und prüfen
        run: |
          # Nicht alle GitHub-Runner enthalten FFmpeg/FFprobe ab Werk.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Chromium-Erweiterung erstellen
        id: erweiterung_build
        run: npm run build:chromium
      - name: Erweiterten Chromium-Browser prüfen
        run: npm run test:browser:chromium
      - name: Echtes 60-FPS-WebM und dynamische Untertitel prüfen
        if: ${{ !inputs.browser_trace && !inputs.main_task_diagnostics && !inputs.render_scheduling_diagnostics && !inputs.dom_phase_diagnostics }}
        run: npm run test:browser:video:chromium -- --fps 60
      - name: Frühen Videostart mit Browsertrace prüfen
        if: ${{ inputs.browser_trace && !inputs.dom_phase_diagnostics && inputs.dom_phase_pairs == '1' }}
        env:
          VIDEO_ENGINE_CONTROL: ${{ inputs.v8_engine_control && 'no-concurrent-recompilation' || 'standard' }}
        run: npm run test:browser:video:chromium -- --fps 60 --browser-trace
      - name: Getrennte Produktions-Videotraces prüfen
        if: ${{ inputs.browser_trace && !inputs.dom_phase_diagnostics && inputs.dom_phase_pairs != '1' }}
        env:
          VIDEO_ENGINE_CONTROL: ${{ inputs.v8_engine_control && 'no-concurrent-recompilation' || 'standard' }}
          TRACE_PAIRS: ${{ inputs.dom_phase_pairs }}
        run: |
          case "$TRACE_PAIRS" in 3|5) ;; *) exit 1 ;; esac
          failed=0
          for attempt in $(seq 1 "$TRACE_PAIRS"); do
            if ! VIDEO_ARTIFACTS_DIR="artifacts/video-playback/production-traces/pair-$attempt" npm run test:browser:video:chromium -- --fps 60 --browser-trace; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Frühen Videostart mit Long-Task-Daten prüfen
        if: ${{ !inputs.browser_trace && inputs.main_task_diagnostics && !inputs.render_scheduling_diagnostics && !inputs.dom_phase_diagnostics && inputs.dom_phase_pairs == '1' }}
        run: npm run test:browser:video:chromium -- --fps 60 --diagnose-main-tasks
      - name: Getrennte passive Produktionsmessungen prüfen
        if: ${{ !inputs.browser_trace && inputs.main_task_diagnostics && !inputs.render_scheduling_diagnostics && !inputs.dom_phase_diagnostics && inputs.dom_phase_pairs != '1' }}
        env:
          PASSIVE_PAIRS: ${{ inputs.dom_phase_pairs }}
        run: |
          case "$PASSIVE_PAIRS" in 3|5) ;; *) exit 1 ;; esac
          failed=0
          for attempt in $(seq 1 "$PASSIVE_PAIRS"); do
            if ! VIDEO_ARTIFACTS_DIR="artifacts/video-playback/production-passive/pair-$attempt" npm run test:browser:video:chromium -- --fps 60 --diagnose-main-tasks; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Task- und Renderfortschritt getrennt beobachten
        if: ${{ !inputs.browser_trace && inputs.render_scheduling_diagnostics && !inputs.dom_phase_diagnostics }}
        run: npm run test:browser:video:chromium -- --fps 60 --diagnose-render-scheduling
      - name: Isolierten DOM-Phasendiagnosebuild erstellen
        if: ${{ inputs.dom_phase_diagnostics }}
        run: node scripts/build-dom-phase-diagnostic.mjs
      - name: Engine-Gegenprobe auf ausdrückliche Diagnose begrenzen
        if: ${{ inputs.v8_engine_control }}
        run: test '${{ inputs.browser_trace }}' = 'true'
      - name: Frühen Videostart mit DOM-Phasen prüfen
        if: ${{ inputs.dom_phase_diagnostics }}
        env:
          VIDEO_EXTENSION_DIR: artifacts/dom-phase-diagnostic/chromium
          DOM_PHASE_PAIRS: ${{ inputs.dom_phase_pairs }}
          VIDEO_ENGINE_CONTROL: ${{ inputs.v8_engine_control && 'no-concurrent-recompilation' || 'standard' }}
        run: |
          case "$DOM_PHASE_PAIRS" in 1|3|5) ;; *) exit 1 ;; esac
          failed=0
          for attempt in $(seq 1 "$DOM_PHASE_PAIRS"); do
            if ! VIDEO_ARTIFACTS_DIR="artifacts/video-playback/dom-phases/pair-$attempt" npm run test:browser:video:chromium -- --fps 60 --diagnose-main-tasks --diagnose-dom-phases ${{ inputs.browser_trace && '--browser-trace' || '' }}; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Untertitelphasen unabhängig vom Frame-Gate messen
        if: ${{ !cancelled() && steps.erweiterung_build.outcome == 'success' }}
        run: npm run test:browser:video:chromium -- --fps 60 --subtitle-only --diagnose-cue-phases --subtitle-dom-load
      - name: Lange Untertitel-Baseline ohne zusätzliche Textlast
        if: ${{ !cancelled() && steps.erweiterung_build.outcome == 'success' && inputs.long_session }}
        env:
          SUBTITLE_DURATION_MS: 180000
          SUBTITLE_LOAD: none
        run: npm run test:browser:video:chromium -- --fps 60 --subtitle-only --subtitle-dom-load --subtitle-baseline
      - name: Lange aktive Untertitel ohne zusätzliche Textlast
        if: ${{ !cancelled() && steps.erweiterung_build.outcome == 'success' && inputs.long_session }}
        env:
          SUBTITLE_DURATION_MS: 180000
          SUBTITLE_LOAD: none
        run: npm run test:browser:video:chromium -- --fps 60 --subtitle-only --subtitle-dom-load
      - name: Großer neutraler DOM-Burst ohne Erweiterung
        if: ${{ !cancelled() && steps.erweiterung_build.outcome == 'success' && inputs.long_session }}
        env:
          SUBTITLE_DURATION_MS: 30000
          SUBTITLE_LOAD: burst
        run: npm run test:browser:video:chromium -- --fps 60 --subtitle-only --subtitle-dom-load --subtitle-baseline
      - name: Großer neutraler DOM-Burst mit aktiven Untertiteln
        if: ${{ !cancelled() && steps.erweiterung_build.outcome == 'success' && inputs.long_session }}
        env:
          SUBTITLE_DURATION_MS: 30000
          SUBTITLE_LOAD: burst
        run: npm run test:browser:video:chromium -- --fps 60 --subtitle-only --subtitle-dom-load
      - name: Große DOM-Entfernung ohne Erweiterung
        if: ${{ !cancelled() && steps.erweiterung_build.outcome == 'success' && (inputs.long_session || inputs.browser_trace) }}
        env:
          SUBTITLE_DURATION_MS: 30000
          SUBTITLE_LOAD: removal
        run: npm run test:browser:video:chromium -- --fps 60 --subtitle-only --subtitle-dom-load --subtitle-baseline ${{ inputs.browser_trace && '--browser-trace' || '' }}
      - name: Große DOM-Entfernung mit aktiven Untertiteln
        if: ${{ !cancelled() && steps.erweiterung_build.outcome == 'success' && (inputs.long_session || inputs.browser_trace) }}
        env:
          SUBTITLE_DURATION_MS: 30000
          SUBTITLE_LOAD: removal
        run: npm run test:browser:video:chromium -- --fps 60 --subtitle-only --subtitle-dom-load ${{ inputs.browser_trace && '--browser-trace' || '' }}
      - name: Untertitel-Rohdaten archivieren
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: untertitel-dom-last-${{ github.sha }}
          path: |
            artifacts/video-playback/subtitle-dom-load-*.json
            artifacts/video-playback/subtitle-browser-trace-*.json
            artifacts/video-playback/video-pair-*.json
            artifacts/video-playback/video-browser-trace-*.json
            artifacts/video-playback/dom-phases/**/*.json
            artifacts/video-playback/production-traces/**/*.json
            artifacts/video-playback/production-passive/**/*.json
          if-no-files-found: warn
          retention-days: 14
