name: Synthetic optimization source preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node scripts/check-synthetic-opt-output.mjs
      - run: node scripts/check-own-renderer-flag-observation.mjs
      - run: node scripts/opt-source-preflight.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: synthetic-opt-source-preflight
          path: artifacts/opt-source-preflight.json
          if-no-files-found: ignore
          retention-days: 7
