name: 30-FPS-Vorgaengervergleich
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video30-predecessor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  video30:
    name: 30 FPS (${{ matrix.condition }}, ${{ matrix.replica }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        condition: [isolated, preceded]
        replica: [1, 2, 3]
    env:
      PREDECESSOR_CONDITION: ${{ matrix.condition }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhaengigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Prozesszaehler pruefen
        run: node --test scripts/test-process-count-witness.mjs
      - name: Exakten CI-Produktstand bauen
        run: npm run build:chromium
      - name: Prozessausgangszustand erfassen
        run: node scripts/process-count-witness.mjs before
      - name: Regulaeren DOM-Smoke voranstellen
        id: smoke
        if: ${{ matrix.condition == 'preceded' }}
        env:
          SMOKE_NAVIGATION_DIAGNOSTICS: "1"
        run: |
          status=0
          npm run test:browser:chromium || status=$?
          node scripts/process-count-witness.mjs after-smoke
          exit "$status"
      - name: Regulaere Interaktion voranstellen
        if: ${{ matrix.condition == 'preceded' }}
        run: |
          status=0
          npm run test:browser:interaction:chromium -- --pairs 1 || status=$?
          node scripts/process-count-witness.mjs after-interaction
          exit "$status"
      - name: Unveraenderten regulaeren Videotest pruefen
        run: |
          status=0
          npm run test:browser:video:chromium || status=$?
          node scripts/process-count-witness.mjs after-video
          exit "$status"
      - name: Ausschliesslich synthetische Videowerte filtern
        id: video_export
        if: ${{ always() }}
        run: node scripts/sanitize-video-failure.mjs
      - name: Vollstaendigen Prozessnachweis pruefen
        id: process_export
        if: ${{ always() }}
        run: node scripts/process-count-witness.mjs validate
      - name: Gepruefte numerische Nachweise sichern
        if: ${{ always() && steps.video_export.outcome == 'success' && steps.video_export.outputs.present == 'true' && steps.process_export.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: video30-predecessor-${{ matrix.condition }}-${{ matrix.replica }}-${{ github.sha }}
          path: |
            artifacts/video-playback/sanitized-video-failure-1.json
            artifacts/video-playback/sanitized-video-failure-2.json
            artifacts/video-predecessor/process-counts.json
          if-no-files-found: error
          retention-days: 7
      - name: Navigationsfehler begrenzt pruefen
        id: navigation_export
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        run: node scripts/validate-navigation-failure-summary.mjs
      - name: Geprueften Navigationsfehler sichern
        if: ${{ failure() && steps.navigation_export.outcome == 'success' && steps.navigation_export.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: predecessor-navigation-${{ matrix.replica }}-${{ github.sha }}
          path: artifacts/browser-smoke-navigation/navigation-failure.json
          if-no-files-found: error
          retention-days: 7
