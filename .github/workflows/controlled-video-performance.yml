name: Kontrollierte 60-FPS-Videodiagnose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video60-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video60:
    name: Lokales Chromium 60 FPS mit Untertiteln
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lokale Video-Encoder installieren und prüfen
        run: |
          # Nicht alle GitHub-Runner enthalten FFmpeg/FFprobe ab Werk.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Chromium-Erweiterung erstellen
        run: npm run build:chromium
      - name: Erweiterten Chromium-Browser prüfen
        run: npm run test:browser:chromium
      - name: Echtes 60-FPS-WebM und dynamische Untertitel prüfen
        run: npm run test:browser:video:chromium -- --fps 60 --diagnose-cue-phases