name: Owned browser copy cache eligibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node --check scripts/owned-browser-copy-preflight.mjs
      - run: node scripts/check-owned-browser-copy-preflight.mjs
      - run: node scripts/owned-browser-copy-preflight.mjs
      - id: export
        run: node scripts/validate-owned-browser-copy-preflight.mjs
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.export.outcome == 'success'
        with:
          name: owned-browser-copy-preflight
          path: artifacts/owned-browser-copy-preflight/summary.json
          if-no-files-found: ignore
          retention-days: 7
