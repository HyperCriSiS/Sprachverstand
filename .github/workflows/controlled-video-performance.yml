name: Actual product context index comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: system-io-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native_io:
    name: Page thread (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, extension-first]
        backend: [rules]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhaengigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Bestehende 60-FPS-Medienwerkzeuge einrichten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Zaehler und Exportfilter pruefen
        run: |
          node scripts/check-owned-io-observation.mjs
          node scripts/check-system-io-export.mjs
          node scripts/check-page-worker-wait-correlation.mjs
      - name: Exakten Produktstand bauen
        run: |
          git fetch --no-tags --depth=1 origin f6d850e06990c777e2e6b97640ee20be0674d21e
          node scripts/build-context-product-pair.mjs
      - name: Reale DOM-Komponente isoliert bauen und funktional pruefen
        run: |
          node scripts/build-page-dom-control.mjs
          node scripts/check-page-dom-control.mjs
      - name: Ein vorab festgelegtes Systembrowserpaar pruefen
        env:
          DOM_COMPONENT_KIND: product
          VIDEO_PAIR_ORDER: ${{ matrix.order }}
          VIDEO_ARTIFACTS_DIR: artifacts/system-io
        run: node scripts/system-io-runner.mjs --browser chromium --fps 60 --focused-start
      - name: Ausschliesslich feste Aggregate pruefen
        id: export
        if: ${{ always() }}
        run: node scripts/validate-system-io-artifacts.mjs
      - name: Gepruefte numerische Aggregate sichern
        if: ${{ always() && steps.export.outcome == 'success' && steps.export.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-context-index-${{ matrix.order }}-${{ github.sha }}
          path: |
            artifacts/system-io/video-pair-chromium-60-1.json
            artifacts/system-io/video-browser-phase-aggregates-chromium-60-baseline-1.json
            artifacts/system-io/video-browser-phase-aggregates-chromium-60-extension-1.json
          if-no-files-found: error
          retention-days: 7

      - name: Actual product context index comparison bestaetigen
        if: ${{ always() && steps.export.outcome == 'success' && steps.export.outputs.present == 'true' }}
        run: node scripts/check-native-page-witness.mjs
