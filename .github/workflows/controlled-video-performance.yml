name: Isolierte Diagnose des Navigationsbeginns

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navigation-start-${{ github.ref }}
  cancel-in-progress: false

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Diagnosefilter prüfen
        run: node --test scripts/test-navigation-start-observer.mjs
      - name: Unverändertes Chromium-Produkt bauen
        run: npm run build:chromium
      - name: Frische Navigationen mit unabhängigem Zeugen vergleichen
        env:
          NAVIGATION_ARTIFACTS_DIR: artifacts/navigation-start
        run: node scripts/diagnose-initial-navigation.mjs
      - name: Instrumentierung mit absichtlichem Timeout validieren
        if: ${{ always() }}
        env:
          NAVIGATION_ARTIFACTS_DIR: artifacts/navigation-validation
        run: node scripts/diagnose-initial-navigation.mjs --validate-observer
      - name: Nur begrenzte synthetische Aggregate prüfen
        id: summary_guard
        if: ${{ always() }}
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          for(const file of ["artifacts/navigation-start/navigation-summary.json","artifacts/navigation-validation/navigation-summary.json"]){
            if(!fs.existsSync(file))continue;
            const text=fs.readFileSync(file,"utf8"),r=JSON.parse(text);
            if(text.length>100000||r.rawProtocolExported!==false||r.profilesExported!==false||r.sessionIdentifiersExported!==false||r.traceEnabled!==false)throw Error("Unsafe diagnostic summary");
            if(/https?:|webSocket|"sessionId"|"requestId"|Authorization|debuggerAddress|\/home\//u.test(text))throw Error("Unexpected identifiers or URLs");
            if(r.rows.length>6||r.rows.some(x=>x.witness.events.length>256))throw Error("Unbounded diagnostic summary");
          }'
      - name: Geprüfte synthetische Zusammenfassungen sichern
        if: ${{ always() && steps.summary_guard.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: navigation-start-${{ github.sha }}
          path: |
            artifacts/navigation-start/navigation-summary.json
            artifacts/navigation-validation/navigation-summary.json
          if-no-files-found: error
          retention-days: 7
