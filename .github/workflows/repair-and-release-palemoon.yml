name: Repair and publish Pale Moon release

on:
  push:
    branches:
      - palemoon

permissions:
  contents: write

env:
  BASE_COMMIT: 04c1bff2c991d9300c0da8a32b6173d04c3b25c0
  TAG: v0.7.0-palemoon.3
  VERSION: 0.7.0
  ASSET_LABEL: 0.7.0-palemoon.3

jobs:
  repair-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Pale-Moon-Branch vollständig auschecken
        uses: actions/checkout@v7
        with:
          ref: palemoon
          fetch-depth: 0

      - name: Controller minimal auf funktionierende Basis zurücksetzen
        shell: bash
        run: |
          set -euo pipefail
          git show "${BASE_COMMIT}:src/palemoon/controller.ts" > src/palemoon/controller.ts
          git show "${BASE_COMMIT}:legacy/palemoon/palemoon/browser-overlay.xul" > legacy/palemoon/palemoon/browser-overlay.xul

          python - <<'PY'
          from pathlib import Path

          controller = Path("src/palemoon/controller.ts")
          text = controller.read_text()
          old = 'button.setAttribute("sprachverstand-count", text);'
          new = 'button.setAttribute("badge", text);'
          if text.count(old) != 1:
              raise SystemExit("Erwartete Badge-Zeile im Controller nicht eindeutig gefunden")
          controller.write_text(text.replace(old, new))

          overlay = Path("legacy/palemoon/palemoon/browser-overlay.xul")
          text = overlay.read_text()
          old_class = 'class="toolbarbutton-1 chromeclass-toolbar-additional"'
          new_class = 'class="toolbarbutton-1 chromeclass-toolbar-additional badged-button"'
          if text.count(old_class) != 1:
              raise SystemExit("Toolbar-Button-Klasse nicht eindeutig gefunden")
          text = text.replace(old_class, new_class)
          marker = '      tooltiptext="Sprachverstand"\n'
          if text.count(marker) != 1:
              raise SystemExit("Toolbar-Tooltip-Marker nicht eindeutig gefunden")
          text = text.replace(marker, marker + '      badge=""\n')
          overlay.write_text(text)
          PY

      - name: Temporäre Workflow-Dateien entfernen
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dispatch-palemoon-release.yml
          rm -f .github/workflows/repair-and-release-palemoon.yml

      - name: Reparierten Stand lokal committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore stable Pale Moon controller with native badge"

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Vollständige Prüfung ausführen
        run: npm run check

      - name: Release-spezifische Regressionen prüfen
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'Korrekturen im aktuell aktiven Tab' static/options/options.html
          grep -Fq 'badged-button' legacy/palemoon/palemoon/browser-overlay.xul
          grep -Fq 'badge=""' legacy/palemoon/palemoon/browser-overlay.xul
          grep -Fq 'button.setAttribute("badge", text)' src/palemoon/controller.ts
          ! grep -Fq 'button.setAttribute("sprachverstand-count", text)' src/palemoon/controller.ts
          ! grep -Fq 'cp docs/PALEMOON-SUBMISSION.md artifacts/' .github/workflows/release.yml

      - name: Reparierten Branch veröffentlichen und taggen
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:palemoon
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} existiert bereits."
            exit 1
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Pale-Moon-Pakete erstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          (
            cd dist/palemoon
            zip -qr "../../artifacts/sprachverstand-${ASSET_LABEL}-palemoon.xpi" .
          )

          SOURCE_DIR=$(mktemp -d)
          git archive HEAD | tar -x -C "$SOURCE_DIR"
          (
            cd "$SOURCE_DIR"
            zip -qr "$GITHUB_WORKSPACE/artifacts/sprachverstand-${ASSET_LABEL}-source.zip" .
          )
          rm -rf "$SOURCE_DIR"

          cp dist/palemoon/icons/icon64.png artifacts/palemoon-icon64.png
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt

          (
            cd artifacts
            sha256sum \
              "sprachverstand-${ASSET_LABEL}-palemoon.xpi" \
              "sprachverstand-${ASSET_LABEL}-source.zip" \
              palemoon-icon64.png \
              SOURCE_COMMIT.txt \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          unzip -t "artifacts/sprachverstand-${ASSET_LABEL}-palemoon.xpi"
          unzip -t "artifacts/sprachverstand-${ASSET_LABEL}-source.zip"

      - name: Korrigierten GitHub-Prerelease veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" artifacts/* \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "Sprachverstand ${VERSION} – Pale Moon" \
            --notes "Korrigierter Pale-Moon-Prerelease auf aktuellem dev-Basisstand. Der entfernte Einstellungszähler bleibt entfernt; der Korrekturzähler wird wieder als Badge am Toolbar-Icon dargestellt." \
            --prerelease

      - name: Fehlerhafte vorherige Pale-Moon-Veröffentlichungen bereinigen
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.0-palemoon.1 --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release delete v0.7.0-palemoon.1 --repo "$REPOSITORY" --yes --cleanup-tag
          fi
          git push origin :refs/tags/v0.7.0-palemoon.2 || true
