name: DOM-Scheduler-CPU-Diagnose

on:
  workflow_dispatch:
    inputs:
      ticks:
        description: "Lokale Mutationsintervalle (10–100)"
        type: choice
        options: ["30", "60", "100"]
        default: "30"
        required: true

permissions:
  contents: read

jobs:
  diagnose:
    name: Lokale CPU-/Warteschlangenanalyse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: CPU-/Schedulerdiagnose ausführen
        env:
          TICKS: ${{ inputs.ticks }}
        run: >
          node scripts/dom-scheduler-cpu-profile.mjs
          --ticks "$TICKS"
          --output artifacts/dom-scheduler-cpu/report.json
      - name: Diagnoserohdaten sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dom-scheduler-cpu-${{ github.sha }}
          path: artifacts/dom-scheduler-cpu/
          if-no-files-found: warn
          retention-days: 14
