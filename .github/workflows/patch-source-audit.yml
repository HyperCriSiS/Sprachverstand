name: Patch source audit safety

on:
  push:
    branches: [feat/gender-source-audit]
    paths:
      - .github/workflows/patch-source-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/gender-source-audit

      - name: Unsichere Binnen-I-Singularerkennung entfernen
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/rules/source-audit-person-forms.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'const supplementalBinnenISingularPattern =\n'
              '  /(?<![\\p{L}\\p{M}])([\\p{L}\\p{M}’\'-]+)In(?![\\p{L}\\p{M}])/gu;\n',
              ''
          )
          text = text.replace(
              '),\n'
              '      (text) =>\n'
              '        transformPattern(\n'
              '          text,\n'
              '          supplementalBinnenISingularPattern,\n'
              '          mapSupplementalSingular\n'
              '        )\n'
              '    ]);',
              ')\n'
              '    ]);'
          )
          path.write_text(text, encoding="utf-8")

      - name: Änderung committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/source-audit-person-forms.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: protect ambiguous Binnen-I singular forms"
          git push origin HEAD:feat/gender-source-audit
