name: Discovery resumable 10000-domain campaign
run-name: deep10000 ${{ inputs.profile }} slot ${{ inputs.slot }} batch ${{ inputs.batch }}

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Campaign execution slot 0 to 17
        required: true
        type: string
      batch:
        description: Assigned batch 433 to 834
        required: true
        type: string
      profile:
        type: choice
        options: ['full', 'canary', 'retire']
        default: 'full'
      chain_end:
        description: Full campaign requires 834; canary can stop earlier
        type: string
        default: '834'
      resume_run:
        description: Optional earlier checkpoint run
        type: string
        default: ''

permissions:
  contents: read
  actions: write

# One running workflow per fixed slot, including successor jobs and retries.
concurrency:
  group: ${{ inputs.profile == 'retire' && 'discovery-deep10000-full' || format('discovery-deep10000-{0}-slot-{1}', inputs.profile, inputs.slot) }}
  cancel-in-progress: false

jobs:
  retire:
    if: inputs.profile == 'retire'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo Retiring the obsolete pending matrix wave
  crawl:
    if: ${{ inputs.profile != 'retire' }}
    name: Batch ${{ inputs.batch }} (12 workers, slot ${{ inputs.slot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      CI: true
      SPRACHVERSTAND_TEST_BROWSER_SOURCE: chrome-for-testing
      CRAWL_BATCH: ${{ inputs.batch }}
      CRAWL_SLOT: ${{ inputs.slot }}
      CRAWL_PROFILE: ${{ inputs.profile }}
      CRAWL_CHAIN_END: ${{ inputs.chain_end }}
      CRAWL_RESUME_RUN: ${{ inputs.resume_run }}
      CRAWL_MAX_SUBPAGES: ${{ inputs.profile == 'canary' && '0' || '50' }}
      CRAWL_BUDGET_MINUTES: ${{ inputs.profile == 'canary' && '10' || '230' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - name: Validate finite slot assignment
        run: node -e 'import("./scripts/discovery-diagnostic/chain-policy.mjs").then(m=>m.assignment(Number(process.env.CRAWL_SLOT),Number(process.env.CRAWL_BATCH),process.env.CRAWL_PROFILE,Number(process.env.CRAWL_CHAIN_END)))'
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify checkpoint and finite chain policy
        run: node --test scripts/discovery-diagnostic/helpers.test.mjs scripts/discovery-diagnostic/campaign.test.mjs scripts/discovery-diagnostic/chain-policy.test.mjs
      - name: Install pinned official Chrome for Testing
        run: bash scripts/setup-chrome-for-testing.sh
      - name: Build unchanged product and prove extension operation
        run: |
          npm run build:chromium
          npm run test:browser:chromium
      - name: Prepare diagnostic adapter and verify product provenance
        run: node scripts/discovery-diagnostic/campaign-prepare.mjs
      - name: Restore saved batch progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/discovery-diagnostic/campaign-restore.mjs
      - name: Process batch with twelve isolated workers
        run: node scripts/discovery-diagnostic/campaign-run.mjs
      - name: Preserve results and checkpoints
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crawl-${{ inputs.profile }}-batch-${{ inputs.batch }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/discovery-campaign/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
      - name: Queue next batch in the same exclusive slot
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/discovery-diagnostic/chain-next.mjs
