name: Discovery resumable 10000-domain campaign

on:
  workflow_dispatch:
    inputs:
      batches:
        description: JSON array of batch IDs, at most 216 batches per wave
        type: string
        required: true
        default: '[1]'
      profile:
        description: Canary or authorized full campaign
        type: choice
        options: ['canary', 'full']
        default: 'canary'
      resume_run:
        description: Optional earlier run containing checkpoints for these batches
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: discovery-deep10000-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      batches: ${{ steps.check.outputs.batches }}
    steps:
      - id: check
        env:
          BATCHES: ${{ inputs.batches }}
        run: |
          node -e 'const fs=require("fs"),a=JSON.parse(process.env.BATCHES);if(!Array.isArray(a)||!a.length||a.length>216||new Set(a).size!==a.length||a.some(x=>!Number.isInteger(x)||x<1||x>834))throw Error("Invalid batch IDs");fs.appendFileSync(process.env.GITHUB_OUTPUT,"batches="+JSON.stringify(a)+"\n")'
  crawl:
    needs: validate
    name: Batch ${{ matrix.batch }} (12 workers)
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        batch: ${{ fromJSON(needs.validate.outputs.batches) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      CI: true
      SPRACHVERSTAND_TEST_BROWSER_SOURCE: chrome-for-testing
      CRAWL_BATCH: ${{ matrix.batch }}
      CRAWL_PROFILE: ${{ inputs.profile }}
      CRAWL_RESUME_RUN: ${{ inputs.resume_run }}
      CRAWL_MAX_SUBPAGES: ${{ inputs.profile == 'canary' && '2' || '50' }}
      CRAWL_BUDGET_MINUTES: ${{ inputs.profile == 'canary' && '15' || '230' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify queue, checkpoint and robots policy
        run: node --test scripts/discovery-diagnostic/helpers.test.mjs scripts/discovery-diagnostic/campaign.test.mjs
      - name: Install pinned official Chrome for Testing
        run: bash scripts/setup-chrome-for-testing.sh
      - name: Build unchanged product and prove extension operation
        run: |
          npm run build:chromium
          npm run test:browser:chromium
      - name: Prepare diagnostic adapter and verify product provenance
        run: node scripts/discovery-diagnostic/campaign-prepare.mjs
      - name: Restore saved batch progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/discovery-diagnostic/campaign-restore.mjs
      - name: Process batch with twelve isolated workers
        run: node scripts/discovery-diagnostic/campaign-run.mjs
      - name: Preserve results and checkpoints
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crawl-${{ inputs.profile }}-batch-${{ matrix.batch }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/discovery-campaign/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

