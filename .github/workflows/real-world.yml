name: Discovery single-runner load probe

on:
  workflow_dispatch:
    inputs:
      target_workers:
        description: Browser workers to compare with four workers
        type: choice
        options: ['8', '12', '16']
        default: '8'

permissions:
  contents: read

concurrency:
  group: discovery-single-runner-probe-${{ inputs.target_workers }}
  cancel-in-progress: false

jobs:
  probe:
    name: One Ubuntu runner, four versus ${{ inputs.target_workers }} browser workers
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: true
      SPRACHVERSTAND_TEST_BROWSER_SOURCE: chrome-for-testing
      DISCOVERY_TEST_WORKERS: ${{ inputs.target_workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate link and robots policy
        run: node --test scripts/discovery-diagnostic/helpers.test.mjs
      - name: Install pinned official Chrome for Testing
        run: bash scripts/setup-chrome-for-testing.sh
      - name: Build unchanged Chromium product
        run: npm run build:chromium
      - name: Prove extension operation in Chromium
        run: npm run test:browser:chromium
      - name: Prepare local diagnostic adapter
        run: node scripts/discovery-diagnostic/prepare.mjs
      - name: Compare browser worker counts in balanced blocks
        run: node scripts/discovery-diagnostic/benchmark.mjs
      - name: Preserve probe results even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: discovery-single-runner-${{ github.run_id }}
          path: artifacts/discovery-probe/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
