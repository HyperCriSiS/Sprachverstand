name: Reale Webseiten

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Optional: Seiten-ID oder Slug, mehrere durch Komma getrennt"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: real-world-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  live:
    name: Chromium Live-Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten und npm-Cache laden
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Chromium-Build erstellen
        run: npm run build:chromium

      - name: Erweiterung lokal im echten Chromium beweisen
        run: npm run test:browser:chromium

      - name: Reale Webseiten diagnostisch prüfen
        env:
          SITE_FILTER: ${{ inputs.site }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --output artifacts/real-world/report.json
            --screenshots artifacts/real-world/screenshots
          )
          if [[ -n "$SITE_FILTER" ]]; then
            ARGS+=(--site "$SITE_FILTER")
          fi
          npm run test:real-world -- "${ARGS[@]}"

      - name: Live-Ergebnisse kompakt ausgeben
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ ! -s artifacts/real-world/report.json ]]; then
            echo "::warning title=Kein Live-Report::Es wurde kein auswertbarer Real-World-Report erzeugt."
            exit 0
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const report = JSON.parse(
            fs.readFileSync("artifacts/real-world/report.json", "utf8")
          );
          const summary = [
            "## Real-World-Browsermatrix",
            "",
            `Commit: \`${report.commit || "unbekannt"}\``,
            "",
            "| Seite | Baseline | Erweiterung | Δ Laufzeit | Δ Long Tasks | Restmuster | JS/Promise | Geschützte Bereiche |",
            "|---|---:|---:|---:|---:|---:|---:|---|"
          ];

          for (const result of report.results || []) {
            const baseline = result.baseline || {};
            const extension = result.extension || {};
            const comparison = result.comparison || {};
            const patterns = Array.isArray(extension.snapshot?.remainingPatterns)
              ? extension.snapshot.remainingPatterns.reduce(
                  (sum, entry) => sum + Number(entry.count || 0),
                  0
                )
              : undefined;
            const javascriptErrors = Array.isArray(extension.snapshot?.javascriptErrors)
              ? extension.snapshot.javascriptErrors.length
              : 0;
            const rejections = Array.isArray(extension.snapshot?.unhandledRejections)
              ? extension.snapshot.unhandledRejections.length
              : 0;
            const protectedBefore = extension.protectedBefore || {};
            const protectedAfter = extension.protectedAfter || {};
            const protectedKeys = new Set([
              ...Object.keys(protectedBefore),
              ...Object.keys(protectedAfter)
            ]);
            const changedProtected = [...protectedKeys].filter(
              (key) =>
                JSON.stringify(protectedBefore[key]) !==
                JSON.stringify(protectedAfter[key])
            );
            const elapsedDelta = Number.isFinite(comparison.elapsedDeltaMs)
              ? `${Math.round(comparison.elapsedDeltaMs)} ms`
              : "–";
            const longTaskDelta = Number.isFinite(comparison.totalLongTaskDeltaMs)
              ? `${Math.round(comparison.totalLongTaskDeltaMs)} ms`
              : "–";
            const protectedLabel =
              extension.status !== "ok"
                ? "nicht messbar"
                : changedProtected.length === 0
                  ? "stabil"
                  : `geändert: ${changedProtected.join(", ")}`;

            console.log(
              [
                "REAL-WORLD",
                result.slug,
                `baseline=${baseline.status || "unbekannt"}`,
                `extension=${extension.status || "unbekannt"}`,
                `elapsedDeltaMs=${comparison.elapsedDeltaMs ?? "n/a"}`,
                `longTaskDeltaMs=${comparison.totalLongTaskDeltaMs ?? "n/a"}`,
                `remainingPatterns=${patterns ?? "n/a"}`,
                `javascriptErrors=${javascriptErrors}`,
                `unhandledRejections=${rejections}`,
                `protected=${protectedLabel}`
              ].join(" ")
            );

            summary.push(
              `| ${result.slug} | ${baseline.status || "unbekannt"} | ${extension.status || "unbekannt"} | ${elapsedDelta} | ${longTaskDelta} | ${patterns ?? "–"} | ${javascriptErrors}/${rejections} | ${protectedLabel} |`
            );
          }

          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `${summary.join("\n")}\n`
            );
          }
          NODE

      - name: Live-Report und Screenshots hochladen
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sprachverstand-real-world-${{ github.sha }}
          path: artifacts/real-world/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
