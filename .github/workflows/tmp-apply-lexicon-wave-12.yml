name: Temporäre Lexikon-Ausbauwelle 12 anwenden

on:
  push:
    branches:
      - feat/lexicon-expansion-wave-12
    paths:
      - .github/workflows/tmp-apply-lexicon-wave-12.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Arbeitszweig auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/lexicon-expansion-wave-12
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Eindeutige Sonderplurale ergänzen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          person_path = Path("src/rules/person-lexicon.ts")
          person = person_path.read_text(encoding="utf-8")
          marker = "const personForms: readonly PersonForms[] = [\n"
          additions = [
              ("graveur", "graveure"),
              ("rotisseur", "rotisseure"),
              ("poissonnier", "poissonniers"),
              ("desinfektor", "desinfektoren"),
              ("präparator", "präparatoren"),
              ("repetitor", "repetitoren"),
              ("arrangeur", "arrangeure"),
              ("gardemanger", "gardemangers"),
              ("prior", "prioren"),
          ]
          missing = [
              (stem, plural)
              for stem, plural in additions
              if f'regular("{stem}", "{plural}")' not in person
          ]
          if missing:
              insertion = "".join(
                  f'  regular("{stem}", "{plural}"),\n'
                  for stem, plural in missing
              )
              person = person.replace(marker, marker + insertion, 1)
              person_path.write_text(person, encoding="utf-8")

          test_path = Path("tests/lexicon-expansion-wave-12.test.ts")
          test_path.write_text(
              '''import { describe, expect, it } from "vitest";
          import { mappedPluralSeparatorsRule } from "../src/rules/mapped-plural-separators";
          import { mapMappedSingular } from "../src/rules/person-lexicon";

          describe("zwölfte konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Graveur:innen", "Graveure"],
              ["Edelsteingraveur:innen", "Edelsteingraveure"],
              ["Rotisseur:innen", "Rotisseure"],
              ["Poissonnier:innen", "Poissonniers"],
              ["Desinfektor:innen", "Desinfektoren"],
              ["Präparator:innen", "Präparatoren"],
              ["Korrepetitor:innen", "Korrepetitoren"],
              ["Ballettrepetitor:innen", "Ballettrepetitoren"],
              ["Arrangeur:innen", "Arrangeure"],
              ["Gardemanger:innen", "Gardemangers"],
              ["Prior:innen", "Prioren"]
            ])("deckt einen eindeutig gemappten Sonderplural ab: %s", (input, expected) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              ["graveur", "genitive", "graveurs"],
              ["edelsteingraveur", "genitive", "edelsteingraveurs"],
              ["rotisseur", "genitive", "rotisseurs"],
              ["poissonnier", "genitive", "poissonniers"],
              ["desinfektor", "genitive", "desinfektors"],
              ["präparator", "genitive", "präparators"],
              ["korrepetitor", "genitive", "korrepetitors"],
              ["ballettrepetitor", "genitive", "ballettrepetitors"],
              ["arrangeur", "genitive", "arrangeurs"],
              ["gardemanger", "genitive", "gardemangers"],
              ["prior", "genitive", "priors"]
            ])("stellt die passende Genitivform bereit: %s", (base, grammaticalCase, expected) => {
              expect(mapMappedSingular(base, grammaticalCase as "genitive")).toBe(expected);
            });

            it.each([
              "Portier:innen",
              "Nachtportier:innen",
              "Diakon:innen",
              "Fraud-Analyst:innen"
            ])("friert einen bewusst mehrdeutigen Restfall ein: %s", (input) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: input,
                replacements: 0
              });
            });
          });
          ''',
              encoding="utf-8",
          )
          PY

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Neue Regressionen gezielt prüfen
        run: npx vitest run tests/lexicon-expansion-wave-12.test.ts

      - name: Vollständige Projektprüfung ausführen
        run: npm run check

      - name: Temporären Workflow entfernen und Änderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-apply-lexicon-wave-12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: zwölfte konservative Lexikonwelle ergänzen"
          git push origin HEAD:feat/lexicon-expansion-wave-12
