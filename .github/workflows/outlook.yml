name: Outlook

on:
  push:
    branches: [outlook]
  pull_request:
    branches: [outlook]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outlook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Outlook-Prüfung
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:locales
      - run: npm run changelog:check
      - run: npm run build:outlook
      # Offizielle Prüfung von Microsoft (Onlinedienst), wie beim Hochladen in Outlook.
      - name: Manifest bei Microsoft prüfen
        run: npx --yes office-addin-manifest@3.0.1 validate dist/outlook/manifest.xml
