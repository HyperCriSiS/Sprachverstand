name: Outlook

on:
  push:
    branches: [outlook]
  pull_request:
    branches: [outlook]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outlook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Outlook-Prüfung
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:locales
      - run: npm run changelog:check
      - run: npm run build:outlook
      # Offizielle Prüfung von Microsoft (Onlinedienst), wie beim Hochladen in Outlook.
      - name: Manifest bei Microsoft prüfen
        run: npx --yes office-addin-manifest@3.0.1 validate dist/outlook/manifest.xml

  # Stellt das Add-in unter GitHub Pages bereit, damit es sich ohne eigenen
  # Server in Outlook laden lässt. Das Manifest liegt unter .../manifest.xml.
  pages:
    name: Outlook-Bereitstellung
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}manifest.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm run build:outlook -- --base-url "${{ steps.pages.outputs.base_url }}/"
      - name: Pages-Paket hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/outlook
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
