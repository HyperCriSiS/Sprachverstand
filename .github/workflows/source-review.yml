name: Private Quellenreview

on:
  workflow_dispatch:
    inputs:
      queue:
        description: "Private Prüfwarteschlange"
        required: true
        default: "kldb-common-2026"
        type: string

permissions:
  contents: read

concurrency:
  group: sprachverstand-private-source-review
  cancel-in-progress: false

env:
  CI: true
  DATASTORE_REPOSITORY: HyperCriSiS/Generic-Datastore

jobs:
  review:
    name: Private Evidenz über öffentlichen Runner erzeugen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Sprachverstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Datastore-Zugriff prüfen
        env:
          DATASTORE_TOKEN: ${{ secrets.GENERIC_DATASTORE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATASTORE_TOKEN" ]]; then
            echo "Das Actions-Secret GENERIC_DATASTORE_TOKEN fehlt."
            exit 1
          fi

      - name: Privaten Datastore auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.DATASTORE_REPOSITORY }}
          ref: main
          path: datastore
          token: ${{ secrets.GENERIC_DATASTORE_TOKEN }}
          persist-credentials: true

      - name: Review-Warteschlange auswählen
        id: queue
        env:
          QUEUE: ${{ inputs.queue }}
        shell: bash
        run: |
          set -euo pipefail

          queue="$QUEUE"
          case "$queue" in
            kldb-common-2026)
              echo "candidate_file=datastore/sprachverstand/derived/candidates/kldb-snapshot-2026-unknown.txt" >> "$GITHUB_OUTPUT"
              echo "review_prefix=kldb-common-2026" >> "$GITHUB_OUTPUT"
              echo "source_id=ba-kldb-2026+ba-dkz-current" >> "$GITHUB_OUTPUT"
              echo "pairs_file=datastore/sprachverstand/derived/candidates/kldb-snapshot-2026-pairs.json" >> "$GITHUB_OUTPUT"
              ;;
            kldb-current-priority-*)
              if [[ ! "$queue" =~ ^kldb-current-priority-[1-9][0-9]*$ ]]; then
                echo "Ungültige kldb-current-Warteschlange: $queue"
                exit 1
              fi
              echo "candidate_file=datastore/sprachverstand/derived/candidates/${queue}.txt" >> "$GITHUB_OUTPUT"
              echo "review_prefix=${queue}" >> "$GITHUB_OUTPUT"
              echo "source_id=ba-dkz-current" >> "$GITHUB_OUTPUT"
              echo "pairs_file=datastore/sprachverstand/derived/candidates/kldb-current-pairs.json" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unbekannte Review-Warteschlange: $queue"
              exit 1
              ;;
          esac

      - name: Review-Warteschlange verifizieren
        env:
          QUEUE: ${{ inputs.queue }}
          CANDIDATE_FILE: ${{ steps.queue.outputs.candidate_file }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          queue = os.environ["QUEUE"]
          candidate_file = Path(os.environ["CANDIDATE_FILE"])
          current_file = Path(
              "datastore/sprachverstand/derived/candidates/"
              "kldb-current-unknown.txt"
          )

          candidates = {
              line.strip()
              for line in candidate_file.read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          current = {
              line.strip()
              for line in current_file.read_text(encoding="utf-8").splitlines()
              if line.strip()
          }

          if not candidates:
              raise SystemExit("Die Review-Warteschlange ist leer.")
          if not candidates.issubset(current):
              missing = sorted(candidates - current)
              raise SystemExit(
                  "Review-Kandidaten fehlen in kldb-current-unknown: "
                  + ", ".join(missing)
              )

          if queue == "kldb-common-2026":
              snapshot_file = Path(
                  "datastore/sprachverstand/derived/candidates/"
                  "kldb-snapshot-2026-unknown.txt"
              )
              snapshot = {
                  line.strip()
                  for line in snapshot_file.read_text(
                      encoding="utf-8"
                  ).splitlines()
                  if line.strip()
              }
              if candidates != snapshot:
                  raise SystemExit(
                      "Die Common-Queue stimmt nicht mit der Snapshot-Queue überein."
                  )
          else:
              review_dir = Path(
                  "datastore/sprachverstand/derived/review"
              )
              current_decisions_name = f"{queue}-manual-decisions.json"
              decided: set[str] = set()
              for decisions_file in sorted(
                  review_dir.glob("kldb-*-manual-decisions.json")
              ):
                  if decisions_file.name == current_decisions_name:
                      continue
                  decisions = json.loads(
                      decisions_file.read_text(encoding="utf-8")
                  )
                  decided.update(
                      item["candidate"]
                      for key in ("accepted", "rejected")
                      for item in decisions.get(key, [])
                      if item.get("candidate")
                  )

              overlap = sorted(candidates & decided)
              if overlap:
                  raise SystemExit(
                      "Bereits entschiedene Kandidaten im neuen Batch: "
                      + ", ".join(overlap)
                  )

          print(
              f"{len(candidates)} Kandidaten für {queue} verifiziert."
          )
          PY

      - name: Wikidata-Evidenz abfragen
        env:
          CANDIDATE_FILE: ${{ steps.queue.outputs.candidate_file }}
          REVIEW_PREFIX: ${{ steps.queue.outputs.review_prefix }}
        run: |
          mkdir -p datastore/sprachverstand/derived/evidence
          python datastore/sprachverstand/scripts/query_wikidata_candidates.py             "$CANDIDATE_FILE"             "datastore/sprachverstand/derived/evidence/${REVIEW_PREFIX}-wikidata.jsonl"             --limit 5             --pause 0.25

      - name: Wikipedia-Titelevidenz abfragen
        env:
          CANDIDATE_FILE: ${{ steps.queue.outputs.candidate_file }}
          REVIEW_PREFIX: ${{ steps.queue.outputs.review_prefix }}
        run: |
          mkdir -p datastore/sprachverstand/derived/evidence
          python datastore/sprachverstand/scripts/query_wikipedia_candidates.py             "$CANDIDATE_FILE"             "datastore/sprachverstand/derived/evidence/${REVIEW_PREFIX}-wikipedia.jsonl"             --limit 5             --pause 0.25

      - name: Private Review-Queue erzeugen
        env:
          PRODUCT_COMMIT: ${{ github.sha }}
          CANDIDATE_FILE: ${{ steps.queue.outputs.candidate_file }}
          REVIEW_PREFIX: ${{ steps.queue.outputs.review_prefix }}
          SOURCE_ID: ${{ steps.queue.outputs.source_id }}
          PAIRS_FILE: ${{ steps.queue.outputs.pairs_file }}
        run: |
          mkdir -p datastore/sprachverstand/derived/review
          python datastore/sprachverstand/scripts/assemble_review_queue.py             "$CANDIDATE_FILE"             "datastore/sprachverstand/derived/review/${REVIEW_PREFIX}-review.json"             --source-id "$SOURCE_ID"             --wikidata-jsonl "datastore/sprachverstand/derived/evidence/${REVIEW_PREFIX}-wikidata.jsonl"             --wikipedia-jsonl "datastore/sprachverstand/derived/evidence/${REVIEW_PREFIX}-wikipedia.jsonl"             --pairs-json "$PAIRS_FILE"             --product-commit "$PRODUCT_COMMIT"

      - name: Kompakte Review-Zusammenfassung erzeugen
        env:
          REVIEW_PREFIX: ${{ steps.queue.outputs.review_prefix }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          prefix = os.environ["REVIEW_PREFIX"]
          queue_path = Path(
              "datastore/sprachverstand/derived/review/"
              f"{prefix}-review.json"
          )
          output_path = Path(
              "datastore/sprachverstand/derived/review/"
              f"{prefix}-summary.json"
          )
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          candidates = queue.get("candidates", [])

          groups = {
              "bothExact": [],
              "wikidataExactOnly": [],
              "wikipediaExactOnly": [],
              "otherHits": [],
              "noHits": [],
          }
          source_pair_counts = {
              "strong": 0,
              "weak": 0,
              "none": 0,
          }
          multiple_source_pair_candidates = []
          missing_source_pair_candidates = []

          for item in candidates:
              candidate = item["candidate"]
              evidence = item.get("evidence", {})
              wd_exact = bool(evidence.get("wikidataExactLabelOrAlias"))
              wp_exact = bool(evidence.get("wikipediaExactTitle"))
              wd_hits = int(evidence.get("wikidataHitCount") or 0)
              wp_hits = int(evidence.get("wikipediaHitCount") or 0)
              pair_hits = int(evidence.get("sourcePairCount") or 0)
              strong_pair_hits = int(
                  evidence.get("strongSourcePairCount") or 0
              )

              if pair_hits > 1:
                  multiple_source_pair_candidates.append(candidate)

              if strong_pair_hits:
                  source_pair_counts["strong"] += 1
              elif pair_hits:
                  source_pair_counts["weak"] += 1
              else:
                  source_pair_counts["none"] += 1
                  missing_source_pair_candidates.append(candidate)

              if wd_exact and wp_exact:
                  groups["bothExact"].append(candidate)
              elif wd_exact:
                  groups["wikidataExactOnly"].append(candidate)
              elif wp_exact:
                  groups["wikipediaExactOnly"].append(candidate)
              elif wd_hits or wp_hits:
                  groups["otherHits"].append(candidate)
              else:
                  groups["noHits"].append(candidate)

          if missing_source_pair_candidates:
              raise SystemExit(
                  "BA-Quellpaare fehlen für Review-Kandidaten: "
                  + ", ".join(missing_source_pair_candidates)
              )

          payload = {
              "version": 1,
              "sourceId": queue.get("sourceId"),
              "productCommit": queue.get("productCommit"),
              "candidateCount": len(candidates),
              "groups": groups,
              "counts": {
                  name: len(values)
                  for name, values in groups.items()
              },
              "sourcePairCounts": source_pair_counts,
              "multipleSourcePairCandidates": multiple_source_pair_candidates,
              "autoApprovalAllowed": False,
          }
          output_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "Private Review-Zusammenfassung erzeugt: "
              f"{len(candidates)} Kandidaten."
          )
          PY

      - name: Änderungen auf private Review-Pfade begrenzen
        shell: bash
        run: |
          set -euo pipefail
          cd datastore
          mapfile -t CHANGED < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          if (( ${#CHANGED[@]} == 0 )); then
            echo "Die Evidenzabfrage hat keine privaten Dateien geändert."
            exit 0
          fi

          for path in "${CHANGED[@]}"; do
            case "$path" in
              sprachverstand/derived/evidence/*|sprachverstand/derived/review/*)
                ;;
              *)
                echo "Unerwartete Änderung außerhalb der erlaubten privaten Review-Pfade: $path"
                exit 1
                ;;
            esac
          done

      - name: Private Evidenz festschreiben
        env:
          REVIEW_PREFIX: ${{ steps.queue.outputs.review_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          cd datastore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprachverstand/derived/evidence sprachverstand/derived/review

          if git diff --cached --quiet; then
            echo "Keine Änderungen an der privaten Review-Evidenz."
            exit 0
          fi

          git commit -m "data: private Quellenreview ${REVIEW_PREFIX} aktualisieren"
          git push origin HEAD:main