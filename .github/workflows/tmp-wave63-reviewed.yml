name: Temporärer Welle-63-Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Produktbranch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: lexicon/reviewed-wave-63
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Privaten Review-Stand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HyperCriSiS/Generic-Datastore
          ref: main
          path: datastore
          token: ${{ secrets.GENERIC_DATASTORE_TOKEN }}
          persist-credentials: false

      - name: Welle 63 erzeugen
        run: python scripts/tmp-wave63-reviewed.py

      - name: Welle 63 prüfen
        run: |
          npm run typecheck
          npx vitest run tests/lexicon-person-forms-wave-63.test.ts

      - name: Produktänderungen begrenzen und festschreiben
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CHANGED < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          expected=(
            "src/rules/person-lexicon.ts"
            "src/rules/reviewed-person-forms-wave-63.ts"
            "tests/lexicon-person-forms-wave-63.test.ts"
          )

          if [[ "${#CHANGED[@]}" -ne "${#expected[@]}" ]]; then
            printf 'Unerwartete Änderungen:\n'
            printf ' - %s\n' "${CHANGED[@]}"
            exit 1
          fi

          for path in "${expected[@]}"; do
            printf '%s\n' "${CHANGED[@]}" | grep -Fxq "$path"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${expected[@]}"
          git commit -m "Lexikon: dreiundsechzigste Ausbauwelle"
          git push origin HEAD:lexicon/reviewed-wave-63
