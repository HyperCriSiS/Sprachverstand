name: Private Bestandsprüfung

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-review-once
  cancel-in-progress: false

jobs:
  review:
    name: Private Datenprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Produktstand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: product

      - name: Node.js vorbereiten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Produktabhängigkeiten installieren
        run: npm ci --prefix product --prefer-offline --no-audit --no-fund

      - name: Privaten Datenstand laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HyperCriSiS/Generic-Datastore
          ref: main
          path: datastore
          token: ${{ secrets.GENERIC_DATASTORE_TOKEN }}
          persist-credentials: true

      - name: Private Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r datastore/sprachverstand/requirements.txt

      - name: Private Prüfungen ausführen
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q datastore/sprachverstand/tests > /tmp/private-checks.log 2>&1 || {
            echo "Private Testprüfung fehlgeschlagen."
            exit 1
          }
          python datastore/sprachverstand/scripts/run_private_review.py             --product-dir product > /tmp/private-review.log 2>&1 || {
            echo "Privater Datenabgleich fehlgeschlagen."
            exit 1
          }
          echo "Privater Datenabgleich abgeschlossen."

      - name: Private Prüfergebnisse sichern
        shell: bash
        run: |
          set -euo pipefail
          cd datastore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprachverstand/derived/evidence sprachverstand/derived/candidates sprachverstand/derived/manifests
          if git diff --cached --quiet; then
            echo "Keine neuen Prüfdateien."
            exit 0
          fi
          git commit -qm 'data: privaten Prüflauf sichern'
          git fetch -q origin main
          git rebase -q origin/main
          git push -q origin HEAD:main
          echo "Private Daten gesichert."
