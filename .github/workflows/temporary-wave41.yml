name: Temporärer Quellen-Audit Welle 41

on:
  push:
    branches:
      - feat/source-audit-korrektur-lp-wave-41

permissions:
  contents: write

jobs:
  patch-und-pruefung:
    runs-on: ubuntu-latest
    steps:
      - name: Branch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/source-audit-korrektur-lp-wave-41

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Quellenänderungen anwenden
        shell: python
        run: |
          from pathlib import Path

          person_path = Path("src/rules/person-lexicon.ts")
          person = person_path.read_text(encoding="utf-8")
          marker = "const personForms: readonly PersonForms[] = [\n"
          additions = (
              '  { ...regular("lateinamerikaner", "lateinamerikaner"), match: "exact" as const },\n'
              '  { ...weak("lebensgefährt", "lebensgefährte", "lebensgefährten"), match: "exact" as const },\n'
              '  { ...regular("leutnant", "leutnants"), match: "exact" as const },\n'
              '  { ...regular("metzger", "metzger"), match: "exact" as const },\n'
              '  { ...weak("misanthrop"), match: "exact" as const },\n'
              '  { ...weak("nachkomm", "nachkomme", "nachkommen"), match: "exact" as const },\n'
              '  { ...regular("neuling", "neulinge", "neuling", "neulings"), match: "exact" as const },\n'
              '  { ...regular("ordner", "ordner"), match: "exact" as const },\n'
              '  { ...weak("ostasiat"), match: "exact" as const },\n'
              '  { ...weak("pedant"), match: "exact" as const },\n'
              '  { ...weak("philanthrop"), match: "exact" as const },\n'
          )
          if 'regular("lateinamerikaner"' not in person:
              if marker not in person:
                  raise RuntimeError("Einfügepunkt im Personenlexikon nicht gefunden")
              person = person.replace(marker, marker + additions, 1)
          person_path.write_text(person, encoding="utf-8")

          test = '''import { describe, expect, it } from "vitest";
          import { mappedPluralSeparatorsRule } from "../src/rules/mapped-plural-separators";
          import {
            mapMappedSingular,
            mapMappedSingularPair
          } from "../src/rules/person-lexicon";

          describe("einundvierzigste konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Lateinamerikaner:innen", "Lateinamerikaner"],
              ["Lebensgefährt*innen", "Lebensgefährten"],
              ["Leutnant_innen", "Leutnants"],
              ["Metzger:innen", "Metzger"],
              ["Misanthrop:innen", "Misanthropen"],
              ["Nachkomm:innen", "Nachkommen"],
              ["Neuling:innen", "Neulinge"],
              ["Ordner:innen", "Ordner"],
              ["Ostasiat:innen", "Ostasiaten"],
              ["Pedant:innen", "Pedanten"],
              ["Philanthrop:innen", "Philanthropen"]
            ])("normalisiert die neue Personenform %s", (input, expected) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it.each([
              ["lateinamerikaner", "genitive", "lateinamerikaners"],
              ["lebensgefährt", "nominative", "lebensgefährte"],
              ["lebensgefährt", "accusative", "lebensgefährten"],
              ["leutnant", "genitive", "leutnants"],
              ["metzger", "genitive", "metzgers"],
              ["misanthrop", "dative", "misanthropen"],
              ["nachkomm", "genitive", "nachkommen"],
              ["neuling", "genitive", "neulings"],
              ["ordner", "genitive", "ordners"],
              ["ostasiat", "accusative", "ostasiaten"],
              ["pedant", "dative", "pedanten"],
              ["philanthrop", "genitive", "philanthropen"]
            ] as const)("bildet %s im Kasus %s korrekt ab", (base, grammaticalCase, expected) => {
              expect(mapMappedSingular(base, grammaticalCase)).toBe(expected);
            });

            it.each([
              ["Lateinamerikaner", "Lateinamerikanerin", "Lateinamerikaner"],
              ["Lebensgefährte", "Lebensgefährtin", "Lebensgefährte"],
              ["Leutnant", "Leutnantin", "Leutnant"],
              ["Metzger", "Metzgerin", "Metzger"],
              ["Misanthrop", "Misanthropin", "Misanthrop"],
              ["Nachkomme", "Nachkommin", "Nachkomme"],
              ["Neuling", "Neulingin", "Neuling"],
              ["Ordner", "Ordnerin", "Ordner"],
              ["Ostasiat", "Ostasiatin", "Ostasiat"],
              ["Pedant", "Pedantin", "Pedant"],
              ["Philanthrop", "Philanthropin", "Philanthrop"]
            ])("erkennt das Paar %s/%s", (masculine, feminine, expected) => {
              expect(mapMappedSingularPair(masculine, feminine)).toBe(expected);
            });

            it.each([
              "Mamsell:innen",
              "Mentee:innen",
              "Mitglied:innen"
            ])("lässt nicht freigegebene oder geschlechtsneutrale Sonderfälle unverändert: %s", (input) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: input,
                replacements: 0
              });
            });
          });
          '''
          test = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in test.splitlines()
          ) + "\n"
          Path("tests/lexicon-person-forms-wave-41.test.ts").write_text(test, encoding="utf-8")

      - name: Vollständige Prüfung
        run: npm run check

      - name: Temporären Workflow entfernen
        run: rm .github/workflows/temporary-wave41.yml

      - name: Änderungen einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/person-lexicon.ts tests/lexicon-person-forms-wave-41.test.ts .github/workflows/temporary-wave41.yml
          git diff --cached --check
          git commit -m "Lexikon: einundvierzigste konservative Ausbauwelle"
          git push
