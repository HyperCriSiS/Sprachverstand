name: DOM-02 natives Funktionsprofil

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: DOM-Funktionsprofil in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Aktuellen Stand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: aktuell
          persist-credentials: false

      - name: Historischen Referenz-Tag auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v0.7.1
          path: baseline
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Identische Diagnosefunktion bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline/benchmarks reports
          cp aktuell/benchmarks/dom-native-profile-entry.audit.ts baseline/benchmarks/

      - name: Historische Abhängigkeiten installieren
        working-directory: baseline
        run: npm ci --no-audit --no-fund

      - name: Aktuelle Abhängigkeiten installieren
        working-directory: aktuell
        run: npm ci --no-audit --no-fund

      - name: Historischen Profil-Bundle bauen
        working-directory: baseline
        run: >-
          npx --no-install esbuild benchmarks/dom-native-profile-entry.audit.ts
          --bundle --platform=browser --format=iife --target=es2022
          --outfile=../baseline-native.js

      - name: Aktuellen Profil-Bundle bauen
        working-directory: aktuell
        run: >-
          npx --no-install esbuild benchmarks/dom-native-profile-entry.audit.ts
          --bundle --platform=browser --format=iife --target=es2022
          --outfile=../current-native.js

      - name: Beidseitige Funktionsprofile im echten Browser messen
        run: node aktuell/scripts/dom-native-browser-audit.mjs ${{ matrix.browser }}

      - name: Messeingaben und Funktionszeiten validieren
        shell: bash
        run: |
          set -euo pipefail
          node aktuell/scripts/compare-dom-native-audit.mjs \
            "reports/native-${{ matrix.browser }}-baseline.json" \
            "reports/native-${{ matrix.browser }}-current.json" \
            "reports/native-${{ matrix.browser }}-vergleich.md"
          node aktuell/scripts/summarize-dom-native-profile.mjs \
            "${{ matrix.browser }}" \
            "reports/native-${{ matrix.browser }}-baseline.json" \
            "reports/native-${{ matrix.browser }}-current.json" \
            "reports/native-${{ matrix.browser }}-profil.md"

      - name: Profil-Rohwerte und Methodenbericht archivieren
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dom02-profile-${{ matrix.browser }}-${{ github.sha }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
