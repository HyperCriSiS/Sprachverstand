name: Temporäre Lexikon-Ausbauwelle 6 anwenden

on:
  push:
    branches:
      - feat/lexicon-expansion-wave-6
    paths:
      - .github/workflows/tmp-apply-lexicon-wave-6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Arbeitszweig auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/lexicon-expansion-wave-6
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Schwache Flexionsformen ergänzen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/rules/person-lexicon.ts")
          text = path.read_text(encoding="utf-8")
          marker = "const personForms: readonly PersonForms[] = [\n"
          stems = [
              "typist",
              "telefonist",
              "dozent",
              "pharmakant",
              "expedient",
              "drogist",
              "pharmazeut",
              "maschinist",
          ]
          missing = [stem for stem in stems if f'weak("{stem}")' not in text]
          if missing:
              insertion = "".join(f'  weak("{stem}"),\n' for stem in missing)
              text = text.replace(marker, marker + insertion, 1)
              path.write_text(text, encoding="utf-8")

          Path("tests/lexicon-expansion-wave-6.test.ts").write_text(
          '''import { describe, expect, it } from "vitest";
          import { mappedPluralSeparatorsRule } from "../src/rules/mapped-plural-separators";
          import { mapMappedSingular } from "../src/rules/person-lexicon";

          describe("sechste konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Datentypist:innen", "Datentypisten"],
              ["Stenotypist:innen", "Stenotypisten"],
              ["Telefonist:innen", "Telefonisten"],
              ["Privatdozent:innen", "Privatdozenten"],
              ["Pharmakant:innen", "Pharmakanten"],
              ["Expedient:innen", "Expedienten"],
              ["Drogist:innen", "Drogisten"],
              ["Pharmazeut:innen", "Pharmazeuten"],
              ["Fördermaschinist:innen", "Fördermaschinisten"]
            ])("deckt eine geprüfte schwache Personenform ab: %s", (input, expected) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it("stellt die schwache Singularflexion auch für Komposita bereit", () => {
              expect(mapMappedSingular("Datentypist", "accusative")).toBe("Datentypisten");
              expect(mapMappedSingular("Stenotypist", "dative")).toBe("Stenotypisten");
              expect(mapMappedSingular("Privatdozent", "genitive")).toBe("Privatdozenten");
              expect(mapMappedSingular("Pharmakant", "dative")).toBe("Pharmakanten");
              expect(mapMappedSingular("Expedient", "genitive")).toBe("Expedienten");
              expect(mapMappedSingular("Drogist", "accusative")).toBe("Drogisten");
              expect(mapMappedSingular("Pharmazeut", "genitive")).toBe("Pharmazeuten");
              expect(mapMappedSingular("Fördermaschinist", "dative")).toBe("Fördermaschinisten");
            });

            it.each([
              "Datentyp:innen",
              "Telefon:innen",
              "Dose:innen",
              "Pharma:innen",
              "Expedition:innen",
              "Droge:innen",
              "Pharmazie:innen",
              "Maschine:innen"
            ])("lässt ähnlich aussehende Nicht-Personenformen unverändert: %s", (input) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: input,
                replacements: 0
              });
            });
          });
          ''', encoding="utf-8")
          PY

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Neue Regressionen gezielt prüfen
        run: npx vitest run tests/lexicon-expansion-wave-6.test.ts

      - name: Vollständige Projektprüfung ausführen
        run: npm run check

      - name: Temporären Workflow entfernen und Änderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-apply-lexicon-wave-6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sechste konservative Lexikonwelle ergänzen"
          git push origin HEAD:feat/lexicon-expansion-wave-6
