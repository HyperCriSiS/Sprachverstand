name: Settings-UI-Patch anwenden

on:
  push:
    branches:
      - ui/remove-settings-reset

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reset entfernen und Speichern vollbreit anordnen
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/settings_patch.py
          python3 /tmp/settings_patch.py

      - name: Einmaligen Patch-Workflow entfernen
        run: git rm .github/workflows/apply-settings-ui-patch.yml

      - name: Änderung committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/options/options.html static/options/options.css src/options.ts tests/options-layout.test.ts
          git commit -m "ui: invasiven Einstellungsreset entfernen"
          git push
