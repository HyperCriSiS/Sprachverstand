name: Temporäre Chromium-Familien-Konsolidierung

on:
  push:
    branches:
      - chore/consolidate-chromium-family-build

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Chromium-Familie auf einen Basis-Build konsolidieren
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json, re

          # Paket-Skripte: Edge und Opera verwenden den gemeinsamen Chromium-Build.
          p = Path("package.json")
          data = json.loads(p.read_text())
          scripts = data["scripts"]
          scripts.pop("build:edge", None)
          scripts.pop("build:opera", None)
          scripts["build:chromium-family"] = "node scripts/build.mjs --target chromium"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          # Edge und Opera bleiben explizite Kompatibilitätsziele, aber ohne eigenes Paket.
          p = Path("config/browser-compatibility.json")
          browsers = json.loads(p.read_text())
          names = {browser["name"] for browser in browsers}
          additions = []
          if "Microsoft Edge" not in names:
              additions.append({"name": "Microsoft Edge", "family": "chromium", "target": "chromium"})
          if "Opera" not in names:
              additions.append({"name": "Opera", "family": "chromium", "target": "chromium"})
          browsers = browsers[:1] + additions + browsers[1:]
          p.write_text(json.dumps(browsers, ensure_ascii=False, indent=2) + "\n")

          # Der Build kennt nur noch die beiden tatsächlich unterschiedlichen Engines.
          p = Path("scripts/build.mjs")
          text = p.read_text().replace(
              'const supportedTargets = ["chromium", "edge", "opera", "firefox"];',
              'const supportedTargets = ["chromium", "firefox"];'
          )
          p.write_text(text)

          # Browservalidierung: Edge und Opera werden gegen denselben Chromium-Build geprüft.
          p = Path("scripts/validate-browser-targets.mjs")
          text = p.read_text()
          text = text.replace('import { createHash } from "node:crypto";\n', '')
          text = text.replace(
              'import { readdir, readFile, stat } from "node:fs/promises";',
              'import { readFile, stat } from "node:fs/promises";'
          )
          text = text.replace(
              'const chromiumTargets = ["chromium", "edge", "opera"];',
              'const chromiumTargets = ["chromium"];'
          )
          text = re.sub(
              r'\nasync function listFiles\([\s\S]*?\n}\n\nasync function digest\([\s\S]*?\n}\n',
              '\n', text, count=1
          )
          text = re.sub(
              r'\n  const referenceDirectory = path\.join\(projectRoot, "dist", "chromium"\);[\s\S]*?\n  }\n}\n\nif \(selectedFamily !== "chromium"\)',
              '\n}\n\nif (selectedFamily !== "chromium")',
              text, count=1
          )
          text = text.replace(
              'console.log("Chromium-Ziele geprüft: Chromium, Microsoft Edge und Opera.");',
              'console.log("Gemeinsamer Chromium-Basis-Build geprüft.");'
          )
          p.write_text(text)

          # Tests auf einen einzigen Chromium-Releasevertrag umstellen.
          p = Path("tests/browser-targets.test.ts")
          text = p.read_text()
          text = text.replace(
              'import { readFileSync } from "node:fs";',
              'import { existsSync, readFileSync } from "node:fs";'
          )
          text = re.sub(r'const edgeManifest = JSON\.parse\(readFileSync\("manifests/edge\.json", "utf8"\)\);\n', '', text)
          text = re.sub(r'const operaManifest = JSON\.parse\(readFileSync\("manifests/opera\.json", "utf8"\)\);\n', '', text)
          text = re.sub(
              r'  it\("baut Chromium, Edge, Opera und Firefox als explizite Ziele", \(\) => \{[\s\S]*?\n  \}\);',
              '''  it("baut nur einen gemeinsamen Chromium-Build und den getrennten Firefox-Build", () => {\n    expect(buildScript).toContain(\n      'const supportedTargets = ["chromium", "firefox"];'\n    );\n    expect(packageJson.scripts["build:edge"]).toBeUndefined();\n    expect(packageJson.scripts["build:opera"]).toBeUndefined();\n    expect(packageJson.scripts["build:chromium-family"]).toBe(\n      "node scripts/build.mjs --target chromium"\n    );\n    expect(existsSync("manifests/edge.json")).toBe(false);\n    expect(existsSync("manifests/opera.json")).toBe(false);\n  });''',
              text, count=1
          )
          text = re.sub(
              r'  it\("hält Edge und Opera auf derselben minimalen Chromium-Berechtigungsbasis", \(\) => \{[\s\S]*?\n  \}\);',
              '''  it("ordnet Edge und Opera demselben minimalen Chromium-Basis-Build zu", () => {\n    expect(chromiumManifest.manifest_version).toBe(3);\n    expect(chromiumManifest.version).toBe(packageJson.version);\n    expect(chromiumManifest.permissions).toEqual(["storage"]);\n    expect(chromiumManifest.content_scripts).toHaveLength(1);\n    expect(chromiumManifest.content_scripts[0].matches).toEqual(["<all_urls>"]);\n    expect(chromiumManifest.background).toEqual({ service_worker: "background.js" });\n    expect(chromiumManifest.browser_specific_settings).toBeUndefined();\n\n    for (const name of ["Microsoft Edge", "Opera"]) {\n      expect(standardCompatibilityBrowsers).toContainEqual({\n        name,\n        family: "chromium",\n        target: "chromium"\n      });\n    }\n  });''',
              text, count=1
          )
          text = text.replace(
              '      { name: "Chromium", family: "chromium", target: "chromium" },\n      { name: "Brave", family: "chromium", target: "chromium" },',
              '      { name: "Chromium", family: "chromium", target: "chromium" },\n      { name: "Microsoft Edge", family: "chromium", target: "chromium" },\n      { name: "Opera", family: "chromium", target: "chromium" },\n      { name: "Brave", family: "chromium", target: "chromium" },'
          )
          text = re.sub(
              r'  it\("packt Edge und Opera im Release-Workflow", \(\) => \{[\s\S]*?\n  \}\);',
              '''  it("veröffentlicht für die Chromium-Familie nur ein gemeinsames Paket", () => {\n    expect(releaseWorkflow).toContain("dist/chromium");\n    expect(releaseWorkflow).toContain("-chromium.zip");\n    expect(releaseWorkflow).not.toContain("dist/edge");\n    expect(releaseWorkflow).not.toContain("dist/opera");\n    expect(releaseWorkflow).not.toContain("-edge.zip");\n    expect(releaseWorkflow).not.toContain("-opera.zip");\n  });''',
              text, count=1
          )
          p.write_text(text)

          # CI erzeugt und prüft nur noch den gemeinsamen Chromium-Build.
          p = Path(".github/workflows/ci.yml")
          text = p.read_text()
          text = text.replace('const manifests=["chromium","edge","opera","firefox"]', 'const manifests=["chromium","firefox"]')
          text = text.replace('for target in chromium edge opera firefox; do', 'for target in chromium firefox; do')
          text = text.replace('- name: Chromium-, Edge- und Opera-Builds erstellen', '- name: Gemeinsamen Chromium-Build erstellen')
          text = text.replace('- name: Chromium-Builds und Kompatibilität prüfen', '- name: Chromium-Build und Kompatibilität prüfen')
          text = text.replace('run: node scripts/validate-icons.mjs dist/chromium/icons dist/edge/icons dist/opera/icons', 'run: node scripts/validate-icons.mjs dist/chromium/icons')
          p.write_text(text)

          # Release veröffentlicht nur noch einen Chromium-Familien-Build.
          p = Path(".github/workflows/release.yml")
          text = p.read_text()
          text = text.replace(
              '? ["manifests/chromium.json", "manifests/firefox.json"]\n            : ["manifests/chromium.json", "manifests/edge.json", "manifests/opera.json", "manifests/firefox.json"];',
              '? ["manifests/chromium.json", "manifests/firefox.json"]\n            : ["manifests/chromium.json", "manifests/firefox.json"];'
          )
          text = text.replace(
              '? ["chromium", "firefox"]\n            : ["chromium", "edge", "opera", "firefox"];',
              '? ["chromium", "firefox"]\n            : ["chromium", "firefox"];'
          )
          text = re.sub(
              r'\n            \(\n              cd dist/edge\n              zip -qr "\.\./\.\./artifacts/public/sprachverstand-\$\{ASSET_LABEL\}-edge\.zip" \.\n            \)\n            \(\n              cd dist/opera\n              zip -qr "\.\./\.\./artifacts/public/sprachverstand-\$\{ASSET_LABEL\}-opera\.zip" \.\n            \)',
              '', text, count=1
          )
          text = text.replace(
              '              manifests/chromium.json\n              manifests/edge.json\n              manifests/opera.json\n              manifests/firefox.json',
              '              manifests/chromium.json\n              manifests/firefox.json'
          )
          text = text.replace(
              '            unzip -t "artifacts/public/sprachverstand-${ASSET_LABEL}-chromium.zip"\n            unzip -t "artifacts/public/sprachverstand-${ASSET_LABEL}-edge.zip"\n            unzip -t "artifacts/public/sprachverstand-${ASSET_LABEL}-opera.zip"\n            unzip -t "artifacts/public/sprachverstand-${ASSET_LABEL}-firefox.xpi"',
              '            unzip -t "artifacts/public/sprachverstand-${ASSET_LABEL}-chromium.zip"\n            unzip -t "artifacts/public/sprachverstand-${ASSET_LABEL}-firefox.xpi"'
          )
          p.write_text(text)

          # Dokumentation auf den gemeinsamen Chromium-Build umstellen.
          p = Path("README.md")
          text = p.read_text().replace(
              'Browser-Builds werden anschließend unter `dist/chromium/`, `dist/edge/`,\n`dist/opera/` und `dist/firefox/` erstellt. Edge und Opera verwenden bewusst\ndieselbe geprüfte Chromium-Payload; die CI kontrolliert deren Bytegleichheit\naußerhalb des Manifests.',
              'Browser-Builds werden anschließend unter `dist/chromium/` und `dist/firefox/`\nerstellt. Microsoft Edge, Opera und weitere Chromium-basierte Browser verwenden\ndenselben geprüften Chromium-Build; browserspezifische Kompatibilität bleibt\nseparat in der Browsermatrix abgesichert.'
          )
          p.write_text(text)

          p = Path("docs/EDGE-SUBMISSION.md")
          text = p.read_text().replace('`sprachverstand-<release>-edge.zip`', '`sprachverstand-<release>-chromium.zip`')
          text = text.replace('Das einzureichende Paket wird vom\nRelease-Workflow als `sprachverstand-<release>-chromium.zip` erzeugt.', 'Das einzureichende Paket ist der gemeinsame Chromium-Build und wird vom\nRelease-Workflow als `sprachverstand-<release>-chromium.zip` erzeugt.')
          p.write_text(text)

          p = Path("docs/OPERA-SUBMISSION.md")
          text = p.read_text().replace('`sprachverstand-<release>-opera.zip`', '`sprachverstand-<release>-chromium.zip`')
          text = text.replace('Das Release-Artefakt wird als\n`sprachverstand-<release>-chromium.zip` erzeugt.', 'Das Release-Artefakt ist der gemeinsame Chromium-Build und wird als\n`sprachverstand-<release>-chromium.zip` erzeugt.')
          text = text.replace('`dist/opera`', '`dist/chromium`')
          p.write_text(text)

          p = Path("docs/BETA-TEST.md")
          text = p.read_text().replace(
              '- `sprachverstand-<release>-chromium.zip`\n- `sprachverstand-<release>-edge.zip`\n- `sprachverstand-<release>-opera.zip`\n- `sprachverstand-<release>-firefox.xpi`',
              '- `sprachverstand-<release>-chromium.zip` – gemeinsamer Build für Chromium, Chrome, Edge, Opera und kompatible Chromium-Browser\n- `sprachverstand-<release>-firefox.xpi`'
          )
          p.write_text(text)
          PY

          git rm manifests/edge.json manifests/opera.json

      - name: Konsolidierten Stand prüfen
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          npm run typecheck
          npm run test -- tests/browser-targets.test.ts tests/release-product-lines.test.ts tests/store-release-automation.test.ts tests/workflow-supply-chain.test.ts
          npm run build
          npm run validate:browsers
          npm run validate:icons

      - name: Produktänderung committen und temporären Workflow entfernen
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-consolidate-chromium-family.yml
          git add -A
          git config user.name "HyperCriSiS"
          git config user.email "dev.github@w3b.world"
          git commit -m "build: Chromium-Familie auf gemeinsamen Build konsolidieren"
          git push origin HEAD:chore/consolidate-chromium-family-build
