name: Publish Pale Moon 0.7.0 prerelease

on:
  push:
    branches:
      - palemoon

permissions:
  contents: write

env:
  CI: true
  VERSION: 0.7.0
  TAG: v0.7.0-palemoon.1
  ASSET_LABEL: 0.7.0-palemoon.1

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: palemoon

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Release-Version setzen
        shell: bash
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          RELEASE_VERSION="$VERSION" node <<'NODE'
          const fs = require("node:fs");
          for (const path of ["manifests/chromium.json", "manifests/firefox.json"]) {
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          }
          NODE

      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Projekt vollständig prüfen
        run: npm run check

      - name: Pale-Moon-Build zusätzlich absichern
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/palemoon/install.rdf
          test -s dist/palemoon/chrome.manifest
          test -s dist/palemoon/icons/icon64.png
          test -s dist/palemoon/palemoon/browser-overlay.xul
          test -s dist/palemoon/palemoon/browser-overlay.css
          test -s dist/palemoon/palemoon/popup-panel.js
          test -s dist/palemoon/palemoon/controller.js
          test -s dist/palemoon/palemoon/content.js
          test -s dist/palemoon/palemoon/legacy-api.js
          grep -q "<em:version>${VERSION}</em:version>" dist/palemoon/install.rdf
          grep -q '<em:maxVersion>34.3.2</em:maxVersion>' dist/palemoon/install.rdf
          ! grep -q '<em:updateURL>' dist/palemoon/install.rdf
          test ! -e dist/palemoon/manifest.json
          file dist/palemoon/icons/icon64.png | grep -q '64 x 64'

      - name: Einmaligen Workflow entfernen und Release-Commit festlegen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/palemoon-release-once.yml
          git commit -m "ci: remove one-time Pale Moon release workflow"
          git push origin HEAD:palemoon
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Release-Artefakte erstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          (
            cd dist/palemoon
            zip -qr "../../artifacts/sprachverstand-${ASSET_LABEL}-palemoon.xpi" .
          )

          SOURCE_DIR=$(mktemp -d)
          git archive "$RELEASE_SHA" | tar -x -C "$SOURCE_DIR"
          cp package.json package-lock.json "$SOURCE_DIR/"
          cp manifests/chromium.json manifests/firefox.json "$SOURCE_DIR/manifests/"

          (
            cd "$SOURCE_DIR"
            zip -qr "$GITHUB_WORKSPACE/artifacts/sprachverstand-${ASSET_LABEL}-source.zip" .
          )
          rm -rf "$SOURCE_DIR"

          cp docs/PALEMOON-SUBMISSION.md artifacts/
          cp dist/palemoon/icons/icon64.png artifacts/palemoon-icon64.png
          printf '%s\n' "$RELEASE_SHA" > artifacts/SOURCE_COMMIT.txt

          cat > artifacts/RELEASE-NOTES.md <<'EOF'
          Dedicated Pale Moon prerelease of Sprachverstand 0.7.0.

          Compatibility: Pale Moon 34.0.0 through 34.3.2.
          The XPI is produced from the isolated `palemoon` branch and contains no WebExtension manifest.

          Before submission to the official Pale Moon Add-ons Site, run the clean-profile runtime checklist in `PALEMOON-SUBMISSION.md` against this exact XPI.
          EOF

          (
            cd artifacts
            sha256sum \
              "sprachverstand-${ASSET_LABEL}-palemoon.xpi" \
              "sprachverstand-${ASSET_LABEL}-source.zip" \
              palemoon-icon64.png \
              SOURCE_COMMIT.txt \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          unzip -t "artifacts/sprachverstand-${ASSET_LABEL}-palemoon.xpi"
          unzip -t "artifacts/sprachverstand-${ASSET_LABEL}-source.zip"

      - name: GitHub-Prerelease veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "artifacts/sprachverstand-${ASSET_LABEL}-palemoon.xpi" \
            "artifacts/sprachverstand-${ASSET_LABEL}-source.zip" \
            artifacts/PALEMOON-SUBMISSION.md \
            artifacts/palemoon-icon64.png \
            artifacts/SOURCE_COMMIT.txt \
            artifacts/SHA256SUMS.txt \
            --repo "$REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Sprachverstand 0.7.0 – Pale Moon" \
            --notes-file artifacts/RELEASE-NOTES.md \
            --prerelease
