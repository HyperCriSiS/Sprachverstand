name: Temporärer Welle-58-Patch v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Produktbranch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: lexicon/reviewed-wave-58
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Privaten Review-Stand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HyperCriSiS/Generic-Datastore
          ref: main
          path: datastore
          token: ${{ secrets.GENERIC_DATASTORE_TOKEN }}
          persist-credentials: false

      - name: Welle 58 erzeugen
        run: python scripts/tmp-wave58-reviewed.py

      - name: Welle 58 prüfen
        run: |
          npm run typecheck
          npx vitest run tests/lexicon-person-forms-wave-58.test.ts

      - name: Produktänderungen festschreiben
        shell: bash
        run: |
          set -euo pipefail
          test -f src/rules/reviewed-person-forms.ts
          test -f tests/lexicon-person-forms-wave-58.test.ts

          mapfile -t TRACKED < <(git diff --name-only | sort -u)
          if [[ "${#TRACKED[@]}" -ne 1 || "${TRACKED[0]}" != "src/rules/person-lexicon.ts" ]]; then
            printf 'Unerwartete verfolgte Änderungen:\n'
            printf ' - %s\n' "${TRACKED[@]}"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             src/rules/person-lexicon.ts             src/rules/reviewed-person-forms.ts             tests/lexicon-person-forms-wave-58.test.ts
          git commit -m "Lexikon: achtundfünfzigste Ausbauwelle"
          git push origin HEAD:lexicon/reviewed-wave-58
