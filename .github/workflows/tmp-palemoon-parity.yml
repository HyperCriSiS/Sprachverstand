name: Temporäre Pale-Moon-Parität

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: feat/palemoon-feature-parity-details
          fetch-depth: 0

      - name: Main als UI- und Feature-Referenz laden
        run: git fetch origin main

      - name: Gemeinsame Ersetzungsübersicht und Popup-UI übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:src/core/replacement-summary.ts > src/core/replacement-summary.ts
          git show origin/main:src/core/transform-text.ts > src/core/transform-text.ts
          git show origin/main:src/core/dom-processor.ts > src/core/dom-processor.ts
          git show origin/main:static/popup/popup.html > static/popup/popup.html
          git show origin/main:static/popup/popup.css > static/popup/popup.css
          git show origin/main:tests/replacement-summary.test.ts > tests/replacement-summary.test.ts
          git show origin/main:src/popup.ts > src/popup.ts

      - name: Pale-Moon-kompatible Implementierung anpassen
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          # Die gemeinsame Summary-Logik bleibt funktional identisch, vermeidet aber
          # Built-ins/Regex-Syntax oberhalb des Pale-Moon-es2017-Ziels.
          p = Path('src/core/replacement-summary.ts')
          s = p.read_text()
          old = "const wordLikeCharacter = /[\\p{L}\\p{M}\\p{N}’'_-]/u;"
          new = '''function isWordLikeCharacter(value: string): boolean {
            if (!value) {
              return false;
            }
            return /[0-9A-Za-zÄÖÜäöüßÀ-ÖØ-öø-ÿ’'_\\-]/.test(value) ||
              value.toLocaleLowerCase() !== value.toLocaleUpperCase();
          }'''
          assert old in s
          s = s.replace(old, new)
          s = s.replace('wordLikeCharacter.test(original[start - 1] ?? "")', 'isWordLikeCharacter(original[start - 1] ?? "")')
          s = s.replace('wordLikeCharacter.test(original[originalEnd] ?? "")', 'isWordLikeCharacter(original[originalEnd] ?? "")')
          s = s.replace('wordLikeCharacter.test(transformed[transformedEnd] ?? "")', 'isWordLikeCharacter(transformed[transformedEnd] ?? "")')
          s = s.replace('const last = entries.at(-1);', 'const last = entries[entries.length - 1];')
          p.write_text(s)

          # Popup: gleiche moderne Oberfläche/Funktionen, aber ohne WebExtension-i18n,
          # das Pale Moon nicht bereitstellt. Die deutschen Fallback-Texte bleiben.
          p = Path('src/popup.ts')
          s = p.read_text()
          s = s.replace('import { t } from "./i18n";\n', '')
          s = s.replace('title.textContent = t(group.labelKey, undefined, group.label);', 'title.textContent = group.label;')
          s = s.replace('''  domainActionButton.textContent = listed
            ? t(
                "currentWebsiteAlreadyInDomainList",
                undefined,
                "Website bereits in der Domainliste"
              )
            : settings.domainListMode === "include"
              ? t("includeCurrentWebsite", undefined, "Diese Website einschließen")
              : t("excludeCurrentWebsite", undefined, "Diese Website ausschließen");''', '''  domainActionButton.textContent = listed
            ? "Website bereits in der Domainliste"
            : settings.domainListMode === "include"
              ? "Diese Website einschließen"
              : "Diese Website ausschließen";''')
          s = s.replace('''  stateOutput.textContent = settings.enabled
            ? t("active", undefined, "Aktiv")
            : t("paused", undefined, "Pausiert");''', '  stateOutput.textContent = settings.enabled ? "Aktiv" : "Pausiert";')
          s = s.replace('let currentHostname = "";\n', 'let currentHostname = "";\nconst replacementStateRefreshIntervalMs = 750;\n')
          old = '''  api.runtime.onMessage.addListener(handleRuntimeMessage);
            window.addEventListener("unload", () => {
              api.runtime.onMessage.removeListener(handleRuntimeMessage);
            });'''
          new = '''  api.runtime.onMessage.addListener(handleRuntimeMessage);
            const replacementStateRefreshTimer = window.setInterval(() => {
              void refreshReplacementState();
            }, replacementStateRefreshIntervalMs);
            window.addEventListener("unload", () => {
              window.clearInterval(replacementStateRefreshTimer);
              api.runtime.onMessage.removeListener(handleRuntimeMessage);
            });'''
          assert old in s
          s = s.replace(old, new)
          old = '''  optionsButton.addEventListener("click", () => {
            void openOptionsPageInForeground(api);
          });'''
          new = '''  optionsButton.addEventListener("click", () => {
            const open = async (): Promise<void> => {
              if (activeTabId !== undefined) {
                await api.runtime.sendMessage({
                  type: "sprachverstand.set-inspected-tab",
                  tabId: activeTabId
                });
              }
              await openOptionsPageInForeground(api);
            };
            void open();
          });'''
          assert old in s
          p.write_text(s.replace(old, new))

          # Content-Runtime stellt neben dem Zähler jetzt auch die exakte Summary bereit.
          p = Path('src/palemoon/content.ts')
          s = p.read_text()
          s = s.replace('import type { Settings } from "../settings/defaults";\n', 'import type { Settings } from "../settings/defaults";\nimport type { ReplacementSummaryEntry } from "../core/replacement-summary";\n')
          s = s.replace('  getReplacementCount(): number;\n}', '  getReplacementCount(): number;\n  getReplacementSummary(): readonly ReplacementSummaryEntry[];\n}')
          old = '''  getReplacementCount() {
            return processor?.getReplacementCount() ?? 0;
          }
          };'''
          new = '''  getReplacementCount() {
            return processor?.getReplacementCount() ?? 0;
          },

          getReplacementSummary() {
            return processor?.getReplacementSummary() ?? [];
          }
          };'''
          assert old in s
          p.write_text(s.replace(old, new))

          # Controller transportiert die Summary per JSON über die bewährte Sandbox-Bridge.
          p = Path('src/palemoon/controller.ts')
          s = p.read_text()
          s = s.replace('interface GetCountMessage {', '''interface ReplacementSummaryEntry {
            readonly original: string;
            readonly replacement: string;
            readonly count: number;
          }

          interface GetCountMessage {''')
          needle = '''function replacementCountFromSandbox(sandbox: ContentSandbox): number {
            try {
              const value = evaluateInContentSandbox(
                sandbox,
                "this.SprachverstandPaleMoonContent ? this.SprachverstandPaleMoonContent.getReplacementCount() : 0"
              );
              return typeof value === "number" && Number.isFinite(value)
                ? Math.max(0, Math.trunc(value))
                : 0;
            } catch {
              return 0;
            }
          }
          '''
          addition = needle + '''
          function isReplacementSummaryEntry(value: unknown): value is ReplacementSummaryEntry {
            if (!value || typeof value !== "object") {
              return false;
            }

            const candidate = value as Partial<ReplacementSummaryEntry>;
            return (
              typeof candidate.original === "string" &&
              typeof candidate.replacement === "string" &&
              typeof candidate.count === "number" &&
              Number.isFinite(candidate.count) &&
              candidate.count > 0
            );
          }

          function replacementSummaryFromSandbox(
            sandbox: ContentSandbox
          ): ReplacementSummaryEntry[] {
            try {
              const serialized = evaluateInContentSandbox(
                sandbox,
                "this.SprachverstandPaleMoonContent ? JSON.stringify(this.SprachverstandPaleMoonContent.getReplacementSummary()) : '[]'"
              );
              if (typeof serialized !== "string") {
                return [];
              }
              const parsed = JSON.parse(serialized) as unknown;
              return Array.isArray(parsed) ? parsed.filter(isReplacementSummaryEntry) : [];
            } catch {
              return [];
            }
          }
          '''
          assert needle in s
          s = s.replace(needle, addition)
          old = '''  const text = formatBadgeCount(normalizedCount) || "0";
            notifyRuntimeMessage({
              type: "sprachverstand.count-updated",
              tabId,
              text,
              hostname: documentToReport.location?.hostname ?? ""
            });
            notifyRuntimeMessage({
              type: "sprachverstand.state-updated",
              tabId,
              text,
              hostname: documentToReport.location?.hostname ?? "",
              count: normalizedCount,
              replacements: []
            });'''
          new = '''  const text = formatBadgeCount(normalizedCount) || "0";
            const sandbox = sandboxesByDocument.get(documentToReport);
            const replacements = sandbox ? replacementSummaryFromSandbox(sandbox) : [];
            notifyRuntimeMessage({
              type: "sprachverstand.count-updated",
              tabId,
              text,
              hostname: documentToReport.location?.hostname ?? ""
            });
            notifyRuntimeMessage({
              type: "sprachverstand.state-updated",
              tabId,
              text,
              hostname: documentToReport.location?.hostname ?? "",
              count: normalizedCount,
              replacements
            });'''
          assert old in s
          s = s.replace(old, new)
          old = '''function replacementState(tabId: number): {
            readonly text: string;
            readonly hostname?: string;
            readonly count: number;
            readonly replacements: readonly [];
          } {
            const browser = browsersByTabId.get(tabId);
            const contentDocument = browser?.contentDocument;
            const count = contentDocument
              ? refreshDocumentCount(contentDocument)
              : countsByTabId.get(tabId) ?? 0;
            const hostname = contentDocument?.location?.hostname ?? "";

            return {
              text: formatBadgeCount(count) || "0",
              ...(hostname ? { hostname } : {}),
              count,
              replacements: []
            };
          }'''
          new = '''function replacementState(tabId: number): {
            readonly text: string;
            readonly hostname?: string;
            readonly count: number;
            readonly replacements: readonly ReplacementSummaryEntry[];
          } {
            const browser = browsersByTabId.get(tabId);
            const contentDocument = browser?.contentDocument;
            const count = contentDocument
              ? refreshDocumentCount(contentDocument)
              : countsByTabId.get(tabId) ?? 0;
            const hostname = contentDocument?.location?.hostname ?? "";
            const sandbox = contentDocument
              ? sandboxesByDocument.get(contentDocument)
              : undefined;
            const replacements = sandbox ? replacementSummaryFromSandbox(sandbox) : [];

            return {
              text: formatBadgeCount(count) || "0",
              ...(hostname ? { hostname } : {}),
              count,
              replacements
            };
          }'''
          assert old in s
          p.write_text(s.replace(old, new))
          PY

      - name: Pale-Moon-Paritätsregressionen ergänzen
        shell: bash
        run: |
          cat > tests/palemoon-feature-parity.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const popupHtml = readFileSync("static/popup/popup.html", "utf8");
          const popupCss = readFileSync("static/popup/popup.css", "utf8");
          const popup = readFileSync("src/popup.ts", "utf8");
          const controller = readFileSync("src/palemoon/controller.ts", "utf8");
          const content = readFileSync("src/palemoon/content.ts", "utf8");
          const core = readFileSync("src/core/dom-processor.ts", "utf8");
          const summary = readFileSync("src/core/replacement-summary.ts", "utf8");

          describe("Pale-Moon-Feature-Parität", () => {
            it("enthält dieselbe detaillierte Änderungsansicht wie die moderne Oberfläche", () => {
              for (const selector of [
                'id="main-view"',
                'id="open-replacements"',
                'id="details-view"',
                'id="details-count"',
                'id="details-unique-count"',
                'id="replacement-list"',
                'id="close-replacements"'
              ]) {
                expect(popupHtml).toContain(selector);
              }
              expect(popupCss).toContain(".replacement-item");
              expect(popupCss).toContain(".details-summary");
            });

            it("transportiert echte Ersetzungsdetails über die Legacy-Bridge", () => {
              expect(popup).toContain('type: "sprachverstand.get-replacement-state"');
              expect(popup).toContain("currentReplacements");
              expect(popup).toContain("renderReplacementDetails");
              expect(popup).toContain("replacementStateRefreshIntervalMs = 750");
              expect(controller).toContain("replacementSummaryFromSandbox");
              expect(controller).toContain("getReplacementSummary()");
              expect(controller).not.toContain("replacements: []");
              expect(content).toContain("getReplacementSummary()");
              expect(core).toContain("transformTextWithSummary");
            });

            it("vermeidet in der Summary Laufzeitfeatures oberhalb des es2017-Portziels", () => {
              expect(summary).not.toContain(".at(-1)");
              expect(summary).not.toContain("\\p{L}");
            });
          });
          EOF

      - name: Temporären Workflow entfernen und Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-palemoon-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(palemoon): detaillierte Änderungsansicht angleichen"
          git push origin HEAD:feat/palemoon-feature-parity-details
