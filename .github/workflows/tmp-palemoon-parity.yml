name: Temporärer AMO-Kommentar-Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: fix/amo-codeql-hmac
      - name: Einrückung korrigieren
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|^// Das AMO_API_SECRET|  // Das AMO_API_SECRET|' scripts/amo-api-v5.mjs
          sed -i 's|^// ein langsamer|  // ein langsamer|' scripts/amo-api-v5.mjs
          sed -i 's|^// lgtm|  // lgtm|' scripts/amo-api-v5.mjs
          sed -i 's|^const signature|  const signature|' scripts/amo-api-v5.mjs
          rm .github/workflows/tmp-palemoon-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: AMO-Sicherheitskommentar sauber einrücken"
          git push origin HEAD:fix/amo-codeql-hmac
