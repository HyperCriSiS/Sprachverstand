name: Temporärer BERUFENET-Patch Welle 37

on:
  push:
    branches:
      - feat/berufenet-language-wave-37

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Weitere BERUFENET-Formen und Regressionen ergänzen
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          lexicon = Path("src/rules/person-lexicon.ts")
          text = lexicon.read_text()
          marker = "const personForms: readonly PersonForms[] = [\n"
          additions = (
              '  { ...weak("skandinavist"), match: "exact" as const },\n',
              '  { ...weak("albanolog", "albanologe", "albanologen"), match: "exact" as const },\n',
              '  { ...weak("japanolog", "japanologe", "japanologen"), match: "exact" as const },\n',
              '  { ...weak("sinolog", "sinologe", "sinologen"), match: "exact" as const },\n',
          )
          for line in reversed(additions):
              if line.strip() not in text:
                  text = text.replace(marker, marker + line, 1)
          lexicon.write_text(text)

          Path("tests/lexicon-person-forms-wave-37.test.ts").write_text('''import { describe, expect, it } from "vitest";
          import { mappedPluralSeparatorsRule } from "../src/rules/mapped-plural-separators";
          import {
            mapMappedSingular,
            mapMappedSingularPair
          } from "../src/rules/person-lexicon";

          describe("siebenunddreißigste konservative Lexikon-Ausbauwelle", () => {
            it.each([
              ["Skandinavist:innen", "Skandinavisten"],
              ["Albanolog*innen", "Albanologen"],
              ["Japanolog_innen", "Japanologen"],
              ["Sinolog:innen", "Sinologen"]
            ])("normalisiert die aktuelle BERUFENET-Form %s", (input, expected) => {
              expect(mappedPluralSeparatorsRule.apply(input)).toEqual({
                text: expected,
                replacements: 1
              });
            });

            it("bildet Skandinavist schwach ab", () => {
              expect(mapMappedSingular("skandinavist", "nominative")).toBe("skandinavist");
              expect(mapMappedSingular("skandinavist", "accusative")).toBe("skandinavisten");
              expect(mapMappedSingular("skandinavist", "dative")).toBe("skandinavisten");
              expect(mapMappedSingular("skandinavist", "genitive")).toBe("skandinavisten");
              expect(mapMappedSingularPair("Skandinavist", "Skandinavistin")).toBe("Skandinavist");
            });

            it.each([
              ["albanolog", "albanologe", "albanologen", "Albanologe", "Albanologin"],
              ["japanolog", "japanologe", "japanologen", "Japanologe", "Japanologin"],
              ["sinolog", "sinologe", "sinologen", "Sinologe", "Sinologin"]
            ])("bildet %s mit schwacher e-Flexion korrekt ab", (stem, nominative, oblique, masculine, feminine) => {
              expect(mapMappedSingular(stem, "nominative")).toBe(nominative);
              expect(mapMappedSingular(stem, "accusative")).toBe(oblique);
              expect(mapMappedSingular(stem, "dative")).toBe(oblique);
              expect(mapMappedSingular(stem, "genitive")).toBe(oblique);
              expect(mapMappedSingularPair(masculine, feminine)).toBe(masculine);
            });
          });
          ''')
          PY

      - name: Gezielte Regressionen ausführen
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          npx vitest run tests/lexicon-person-forms-wave-37.test.ts

      - name: Temporären Workflow entfernen und Änderungen committen
        shell: bash
        run: |
          rm .github/workflows/temp-berufenet-wave-37.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rules/person-lexicon.ts tests/lexicon-person-forms-wave-37.test.ts .github/workflows/temp-berufenet-wave-37.yml
          git commit -m "Lexikon: dritte BERUFENET-Ausbauwelle ergänzen"
          git push
