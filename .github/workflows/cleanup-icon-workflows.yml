name: Einmalige Icon-Workflow-Bereinigung

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/cleanup-icon-workflows.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: dev auschecken
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Einmalige Workflows entfernen
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/restore-original-icon.yml \
            .github/workflows/cleanup-icon-workflows.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: remove one-time icon workflows"
          git push origin HEAD:dev
