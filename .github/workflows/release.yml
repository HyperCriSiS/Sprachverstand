name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Release-Ziel prüfen
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$REQUESTED_TAG"
          VERSION=$(node -p "require('./package.json').version")

          if [[ "$TAG" == "v" || "$TAG" != v* ]]; then
            echo "Der Release-Tag muss mit v beginnen und danach weitere Zeichen enthalten."
            exit 1
          fi

          if [[ "$TAG" != "v${VERSION}" && "$TAG" != "v${VERSION}-"* ]]; then
            echo "Tag ${TAG} passt nicht zur Add-on-Version ${VERSION}."
            echo "Erwartet wird v${VERSION} oder v${VERSION}-<Zusatz>."
            exit 1
          fi

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          RELEASE_SHA=$(git rev-parse HEAD)

          if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "Tag ${TAG} zeigt auf ${TAG_SHA}, ausgecheckt wurde ${RELEASE_SHA}."
            exit 1
          fi

          RELEASE_LABEL=${TAG#v}
          ASSET_LABEL=${RELEASE_LABEL//\//-}

          if [[ "$TAG" == "v${VERSION}" ]]; then
            IS_PRERELEASE=false
          else
            IS_PRERELEASE=true
          fi

          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_LABEL=${RELEASE_LABEL}" >> "$GITHUB_ENV"
          echo "ASSET_LABEL=${ASSET_LABEL}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"

      - name: Node.js einrichten und npm-Cache laden
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Vollständige Prüfung ausführen
        run: npm run check

      - name: Release-Pakete erstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          (
            cd dist/chromium
            zip -qr "../../artifacts/sprachverstand-${ASSET_LABEL}-chromium.zip" .
          )

          (
            cd dist/firefox
            zip -qr "../../artifacts/sprachverstand-${ASSET_LABEL}-firefox.xpi" .
          )

          git archive \
            --format=zip \
            --output="artifacts/sprachverstand-${ASSET_LABEL}-source.zip" \
            "$RELEASE_SHA"

          cp docs/BETA-TEST.md artifacts/
          cp docs/AMO-SOURCE-INSTRUCTIONS.md artifacts/
          printf '%s\n' "$RELEASE_SHA" > artifacts/SOURCE_COMMIT.txt

          (
            cd artifacts
            sha256sum \
              "sprachverstand-${ASSET_LABEL}-chromium.zip" \
              "sprachverstand-${ASSET_LABEL}-firefox.xpi" \
              "sprachverstand-${ASSET_LABEL}-source.zip" \
              SOURCE_COMMIT.txt \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          unzip -t "artifacts/sprachverstand-${ASSET_LABEL}-chromium.zip"
          unzip -t "artifacts/sprachverstand-${ASSET_LABEL}-firefox.xpi"
          unzip -t "artifacts/sprachverstand-${ASSET_LABEL}-source.zip"

          if unzip -l "artifacts/sprachverstand-${ASSET_LABEL}-firefox.xpi" | grep -q 'META-INF/'; then
            echo "Das AMO-Einreichungspaket darf vor der Mozilla-Signierung kein META-INF-Signaturverzeichnis enthalten."
            exit 1
          fi

      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$REPOSITORY" --clobber

            RELEASE_ID=$(gh release view "$TAG" --repo "$REPOSITORY" --json databaseId --jq '.databaseId')
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              MAKE_LATEST=false
            else
              MAKE_LATEST=true
            fi

            gh api \
              --method PATCH \
              "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
              -f name="Sprachverstand ${RELEASE_LABEL}" \
              -F prerelease="$IS_PRERELEASE" \
              -f make_latest="$MAKE_LATEST" \
              >/dev/null
          else
            RELEASE_ARGS=(
              "$TAG"
              artifacts/*
              --repo "$REPOSITORY"
              --verify-tag
              --title "Sprachverstand ${RELEASE_LABEL}"
              --generate-notes
            )

            if [[ "$IS_PRERELEASE" == "true" ]]; then
              RELEASE_ARGS+=(--prerelease)
            else
              RELEASE_ARGS+=(--latest)
            fi

            gh release create "${RELEASE_ARGS[@]}"
          fi
