name: RC-Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  CI: true

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten und npm-Cache laden
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Vollständige Prüfung ausführen
        run: npm run check

      - name: Release-Ziel festlegen und bestehende Tags ablehnen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PRERELEASE="rc.1"
          PRERELEASE_TITLE="RC1"
          TAG="v${VERSION}-${PRERELEASE}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Der unveränderliche Tag ${TAG} existiert bereits. Ein bestehender Release wird nicht überschrieben."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Der Release ${TAG} existiert bereits. Ein bestehender Release wird nicht überschrieben."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"
          echo "PRERELEASE_TITLE=${PRERELEASE_TITLE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Release-Pakete erstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          (
            cd dist/chromium
            zip -qr "../../artifacts/sprachverstand-${VERSION}-${PRERELEASE}-chromium.zip" .
          )

          (
            cd dist/firefox
            zip -qr "../../artifacts/sprachverstand-${VERSION}-${PRERELEASE}-firefox.xpi" .
          )

          git archive \
            --format=zip \
            --output="artifacts/sprachverstand-${VERSION}-${PRERELEASE}-source.zip" \
            "$GITHUB_SHA"

          cp docs/BETA-TEST.md artifacts/
          cp docs/AMO-SOURCE-INSTRUCTIONS.md artifacts/
          printf '%s\n' "$GITHUB_SHA" > artifacts/SOURCE_COMMIT.txt

          (
            cd artifacts
            sha256sum \
              "sprachverstand-${VERSION}-${PRERELEASE}-chromium.zip" \
              "sprachverstand-${VERSION}-${PRERELEASE}-firefox.xpi" \
              "sprachverstand-${VERSION}-${PRERELEASE}-source.zip" \
              SOURCE_COMMIT.txt \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          unzip -t "artifacts/sprachverstand-${VERSION}-${PRERELEASE}-chromium.zip"
          unzip -t "artifacts/sprachverstand-${VERSION}-${PRERELEASE}-firefox.xpi"
          unzip -t "artifacts/sprachverstand-${VERSION}-${PRERELEASE}-source.zip"

          if unzip -l "artifacts/sprachverstand-${VERSION}-${PRERELEASE}-firefox.xpi" | grep -q 'META-INF/'; then
            echo "Das AMO-Einreichungspaket darf vor der Mozilla-Signierung kein META-INF-Signaturverzeichnis enthalten."
            exit 1
          fi

      - name: GitHub-Prerelease veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Sprachverstand ${VERSION} – ${PRERELEASE_TITLE}" \
            --notes-file docs/RELEASE-NOTES.md \
            --prerelease

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "Tag ${TAG} zeigt auf ${TAG_SHA}, erwartet wurde ${GITHUB_SHA}."
            exit 1
          fi

      - name: Veröffentlichung in der Roadmap vermerken
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh issue comment 1 --repo "$REPOSITORY" --body "## ${PRERELEASE_TITLE} veröffentlicht

          Sprachverstand ${VERSION} ${PRERELEASE_TITLE} wurde nach erfolgreicher vollständiger Prüfung als unveränderlicher Release veröffentlicht.

          https://github.com/${REPOSITORY}/releases/tag/${TAG}"
