name: Temporärer Pale-Moon-Main-Paritätssync

on:
  push:
    branches:
      - feat/palemoon-feature-parity-replacements

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pale-Moon-Arbeitszweig auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/palemoon-feature-parity-replacements
          fetch-depth: 0

      - name: Gemeinsame Produktteile exakt aus main übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            src/browser/api.ts \
            src/core \
            src/i18n.ts \
            src/options.ts \
            src/popup.ts \
            src/rules \
            src/settings \
            static/_locales \
            static/i18n-bootstrap.js \
            static/legal \
            static/options \
            static/popup

      - name: Pale-Moon-Buildadapter ergänzen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build.mjs")
          source = path.read_text(encoding="utf-8")

          if "async function injectLocalizationBootstrap" not in source:
              old = '''async function injectPaleMoonCompatibilityScript(outputDirectory) {
            for (const relativePath of ["popup/popup.html", "options/options.html"]) {
              const filePath = path.join(outputDirectory, relativePath);
              const html = await readFile(filePath, "utf8");
              const bundleName = path.basename(relativePath, ".html");
              const escapedBundleName = bundleName.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");
              const markerPattern = new RegExp(
                `<script\\\\s+[^>]*src=["']${escapedBundleName}\\\\.js["'][^>]*><\\\\/script>`
              );
              const marker = html.match(markerPattern)?.[0];

              if (!marker) {
                throw new Error(
                  `Pale-Moon-Kompatibilität konnte nicht in ${relativePath} eingefügt werden.`
                );
              }

              const compatibilityScript =
                `<script src="../palemoon/legacy-api.js" defer></script>\\n    ${marker}`;

              await writeFile(
                filePath,
                html.replace(markerPattern, compatibilityScript),
                "utf8"
              );
            }
          }
          '''
              new = '''async function injectLocalizationBootstrap(outputDirectory) {
            for (const relativePath of [
              "popup/popup.html",
              "options/options.html",
              "legal/legal.html"
            ]) {
              const filePath = path.join(outputDirectory, relativePath);
              const html = await readFile(filePath, "utf8");
              const markerPattern =
                /<meta\\b(?=[^>]*\\bname=["']color-scheme["'])(?=[^>]*\\bcontent=["']dark light["'])[^>]*>/i;
              const marker = html.match(markerPattern)?.[0];

              if (!marker) {
                throw new Error(
                  `Lokalisierungs-Bootstrap konnte nicht in ${relativePath} eingefügt werden.`
                );
              }

              await writeFile(
                filePath,
                html.replace(
                  markerPattern,
                  `${marker}\\n    <script src="../i18n-bootstrap.js" defer></script>`
                ),
                "utf8"
              );
            }
          }

          async function injectPaleMoonCompatibilityScripts(outputDirectory) {
            for (const relativePath of [
              "popup/popup.html",
              "options/options.html",
              "legal/legal.html"
            ]) {
              const filePath = path.join(outputDirectory, relativePath);
              const html = await readFile(filePath, "utf8");
              const bootstrapPattern =
                /<script\\s+[^>]*src=["']\\.\\.\\/i18n-bootstrap\\.js["'][^>]*><\\/script>/i;
              const bootstrap = html.match(bootstrapPattern)?.[0];

              if (!bootstrap) {
                throw new Error(
                  `Pale-Moon-Kompatibilität konnte nicht in ${relativePath} eingefügt werden.`
                );
              }

              const compatibilityScripts = [
                '<script src="../palemoon/legacy-api.js" defer></script>',
                '<script src="../palemoon/parity-api.js" defer></script>',
                '<script src="../palemoon/i18n-bootstrap.js" defer></script>'
              ].join("\\n    ");

              await writeFile(
                filePath,
                html.replace(bootstrapPattern, compatibilityScripts),
                "utf8"
              );
            }
          }
          '''
              if old not in source:
                  raise SystemExit("Pale-Moon-Kompatibilitätsblock nicht gefunden")
              source = source.replace(old, new)

          if 'path.join(paleMoonRuntimeDirectory, "parity-api.js")' not in source:
              old = '''    cp(
              path.join(legacyDirectory, "palemoon", "legacy-api.js"),
              path.join(paleMoonRuntimeDirectory, "legacy-api.js")
            )
          ]);

          await injectPaleMoonCompatibilityScript(outputDirectory);
          }
          '''
              new = '''    cp(
              path.join(legacyDirectory, "palemoon", "legacy-api.js"),
              path.join(paleMoonRuntimeDirectory, "legacy-api.js")
            ),
            cp(
              path.join(legacyDirectory, "palemoon", "parity-api.js"),
              path.join(paleMoonRuntimeDirectory, "parity-api.js")
            ),
            cp(
              path.join(legacyDirectory, "palemoon", "i18n-bootstrap.js"),
              path.join(paleMoonRuntimeDirectory, "i18n-bootstrap.js")
            ),
            cp(
              path.join(legacyDirectory, "palemoon", "domain-ui.js"),
              path.join(outputDirectory, "options", "domain-ui.js")
            )
          ]);

          await injectPaleMoonCompatibilityScripts(outputDirectory);
          }
          '''
              if old not in source:
                  raise SystemExit("Pale-Moon-Dateikopierblock nicht gefunden")
              source = source.replace(old, new)

          if "await injectLocalizationBootstrap(outputDirectory);" not in source:
              old = '''  await cp(path.join(projectRoot, "static"), outputDirectory, {
            recursive: true
          });

          const legalDirectory = path.join(outputDirectory, "legal");
          '''
              new = '''  await cp(path.join(projectRoot, "static"), outputDirectory, {
            recursive: true
          });

          await injectLocalizationBootstrap(outputDirectory);

          const legalDirectory = path.join(outputDirectory, "legal");
          '''
              if old not in source:
                  raise SystemExit("Static-Copy-Marker nicht gefunden")
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Synchronisierten Stand committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build.mjs \
            src/browser/api.ts \
            src/core \
            src/i18n.ts \
            src/options.ts \
            src/popup.ts \
            src/rules \
            src/settings \
            static/_locales \
            static/i18n-bootstrap.js \
            static/legal \
            static/options \
            static/popup
          if git diff --cached --quiet; then
            echo "Gemeinsame Produktteile und Buildadapter sind bereits aktuell."
            exit 0
          fi
          git commit -m "sync(palemoon): gemeinsame Produktfunktionen und Legacy-Adapter abgleichen"
          git push origin HEAD:feat/palemoon-feature-parity-replacements
